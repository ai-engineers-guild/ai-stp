targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/cli/tests/fixtures/legacy\-state\.json$''']
regexes = ['''^\s*"secrets/device\-key\.device_01M4ZMZM87MF0ZT9H6V9VV1HKM\.secret":\ "eyJzZWVkIjogIm9peUZqdDBUbFVnZ2tTYnJoMlIzRzMwSy9uQWlYdmx0ZnFHU1JWUlZwZUU9In0="\s*$''']

[[allowlists]]
description = "Fixed public idempotency UUID in the access-workspace component fixture"
