condition = "AND"
regexTarget = "line"
paths = ['''^apps/web/tests/component/access\-workspace\.test\.tsx$''']
regexes = ['''^\s*const\ idempotencyKey\ =\ "88abdcde\-5013\-40ae\-a319\-bcd11b0a07fb";\s*$''']

