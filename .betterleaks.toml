betterleaksMinVersion = "v1.10.0"

# Keep text and lockfiles in scope, including bun.lock, which upstream skips.
# Binary assets and dependency/install directories retain their prior exclusions.
prefilter = '''
matchesAny(attributes["path"], [
  `(?:^|/)\.git(?:/|$)`,
  `(?:^|/)node_modules(?:/|$)`,
  `(?i)\.(?:bmp|gif|jpe?g|png|svg|tiff?|eot|[ot]tf|woff2?|pdf)$`
])
'''

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic test fixtures, generated contracts, and documentation examples"
paths = [
  '''^schemas/v1/openapi\.json$''',
  '''^packages/contracts/src/ai_stp_contracts/fixtures/v1/''',
  '''^tests/''',
  '''^\.serena/memories/quality-gates-and-commands\.md$''',
  '''^\.serena/memories/current-work\.md$''',
]
regexes = [
  '''^proposal-evidence-0001$''',
]

[[allowlists]]
description = "The REQ-8020 spec-table phrase 'partial/compensated' trips generic-api-key (entropy 3.68 on two English words). Verified false positive on commits 4f744a3f and fca6a854. The suppression is the finding's exact secret text, not a file or commit skip — a real credential, including one added to the same spec file, still scans."
regexes = [
  '''^partial/compensated$''',
  '''^gpt-oss-120b-medium$''',
]

[[allowlists]]
description = "Native projection of the public GitHub import idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/cli/resources/packages/contracts/src/ai_stp_contracts/fixtures/v1/github_connector\.json$''']
regexes = ['''^\s*"idempotency_key":\ "idem_visibility_plan_01"\s*$''']

[[allowlists]]
description = "Native projection of the public corporate idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/cli/resources/packages/contracts/src/ai_stp_contracts/fixtures/v1/corporate\.json$''']
regexes = ['''^\s*"idempotency_key":\ "corporate\-assignment\-0001",\s*$''']

[[allowlists]]
