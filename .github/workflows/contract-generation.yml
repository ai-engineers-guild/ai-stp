name: contract-generation

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "apps/web/openapi-ts.config.ts"
      - ".github/workflows/contract-generation.yml"
  workflow_dispatch:
    inputs:
      native_locks:
        description: "Regenerate Rust lockfiles from committed manifests instead of schemas"
        type: boolean
        default: false
      web_lock:
        description: "Regenerate only the web lockfile from its committed manifest"
        type: boolean
        default: false
      native_projections:
        description: "Compile native IPC declarations and regenerate embedded CLI resources"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contract-generation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.9"
  NODE_VERSION: "26.12.1"
  UV_VERSION: "0.13.5"
  BUN_VERSION: "1.4.4"

jobs:
  generate:
    if: github.event_name != 'workflow_dispatch' || (!inputs.native_locks && !inputs.web_lock && !inputs.native_projections)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Isolate generator tools and native package caches
        run: |
          set -euo pipefail
          {
            echo "UV_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-contract-generation"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Generate canonical schemas and typed consumers
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group docs --group dev
          uv run --locked python -m ai_stp_contracts.schemas schemas/v1
          uv run --locked python -m ai_stp_contracts.inventory_record
          uv run --locked python -m ai_stp_contracts.web_projections
          uv run --locked python -m ai_stp_contracts.technology_seed
          uv run --locked python release_scripts/provider_kit.py provider-kit/v3
          uv run --locked python release_scripts/first_party_corpus_digests.py
          uv run --locked --group docs python docs_scripts/skill_projections.py
          cd apps/web
          bun install --frozen-lockfile
          bun run api:generate
          bun run format
      - name: Install the pinned native resource generator toolchain
        run: bash .github/scripts/install-rust-toolchain.sh apps/cli/rust-toolchain.toml
      - name: Generate embedded native resources from the canonical sources
        run: cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- resources
      - name: Retain an exact source patch for review
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git add --intent-to-add -- .
          git diff --binary > "${RUNNER_TEMP}/contract-source.patch"
          {
            echo "source_head=${SOURCE_HEAD}"
            echo "checkout=$(git rev-parse HEAD)"
            sha256sum "${RUNNER_TEMP}/contract-source.patch"
            git diff --stat
          } > "${RUNNER_TEMP}/contract-source.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contract-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/contract-source.patch
            ${{ runner.temp }}/contract-source.txt
          if-no-files-found: error
          retention-days: 3

  native-locks:
    if: github.event_name == 'workflow_dispatch' && inputs.native_locks && !inputs.web_lock && !inputs.native_projections
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned native CLI toolchain
        run: bash .github/scripts/install-rust-toolchain.sh apps/cli/rust-toolchain.toml
      - name: Regenerate only changed native dependency resolutions
        run: |
          set -euo pipefail
          cargo update --manifest-path apps/cli/Cargo.toml --workspace
          cargo update --manifest-path apps/cli/xtask/Cargo.toml --workspace
          cargo update --manifest-path apps/desktop/core/Cargo.toml --workspace
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace
          git diff --exit-code -- . ':!apps/cli/Cargo.lock' ':!apps/cli/xtask/Cargo.lock' \
            ':!apps/desktop/core/Cargo.lock' ':!apps/desktop/src-tauri/Cargo.lock'
      - name: Retain the exact lockfile patch for review
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          git diff --binary -- apps/cli/Cargo.lock apps/cli/xtask/Cargo.lock \
            apps/desktop/core/Cargo.lock apps/desktop/src-tauri/Cargo.lock \
            > "${RUNNER_TEMP}/native-locks.patch"
          {
            echo "source_head=${SOURCE_HEAD}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            sha256sum "${RUNNER_TEMP}/native-locks.patch"
            git diff --stat -- apps/cli/Cargo.lock apps/cli/xtask/Cargo.lock \
              apps/desktop/core/Cargo.lock apps/desktop/src-tauri/Cargo.lock
          } > "${RUNNER_TEMP}/native-locks.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-locks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-locks.patch
            ${{ runner.temp }}/native-locks.txt
          if-no-files-found: error
          retention-days: 3

  web-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.web_lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Refuse conflicting generation modes
        if: inputs.native_locks || inputs.native_projections
        run: |
          echo '::error::Choose only one generation mode'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install only the pinned package manager
        run: |
          set -euo pipefail
          test "$(cat .bun-version)" = "${BUN_VERSION}"
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
          echo "BUN_INSTALL_CACHE_DIR=${RUNNER_TEMP}/ai-stp-web-lock-cache" >> "${GITHUB_ENV}"
      - name: Resolve only the committed web dependency graph
        run: |
          set -euo pipefail
          test ! -e node_modules
          test ! -e apps/web/node_modules
          (cd apps/web && bun install --lockfile-only --ignore-scripts)
          test ! -e node_modules
          test ! -e apps/web/node_modules
          git diff --exit-code -- . ':!apps/web/bun.lock'
      - name: Retain the exact web lockfile patch for review
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          git diff --binary -- apps/web/bun.lock > "${RUNNER_TEMP}/web-lock.patch"
          {
            echo "source_head=${SOURCE_HEAD}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            sha256sum "${RUNNER_TEMP}/web-lock.patch"
            git diff --stat -- apps/web/bun.lock
          } > "${RUNNER_TEMP}/web-lock.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-lock-${{ github.sha }}
          path: |
            ${{ runner.temp }}/web-lock.patch
            ${{ runner.temp }}/web-lock.txt
          if-no-files-found: error
          retention-days: 3

  native-projections:
    if: github.event_name == 'workflow_dispatch' && inputs.native_projections
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Refuse conflicting generation modes
        if: inputs.native_locks || inputs.web_lock
        run: |
          echo '::error::Choose only one generation mode'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned native projection tools
        run: |
          set -euo pipefail
          bash .github/scripts/install-rust-toolchain.sh apps/cli/rust-toolchain.toml rustfmt
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - name: Restore successful Dev's native dependencies without retaining generator outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        timeout-minutes: 5
        with:
          prefix-key: desktop-deps-v1
          shared-key: ubuntu-26.04
          workspaces: |
            apps/cli
            apps/cli/xtask
            apps/desktop/core
            apps/desktop/src-tauri
          cache-bin: 'false'
          save-if: 'false'
      - name: Prepare the committed Desktop generator dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Generate native IPC projections from the compiled owner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@2141b5788e0dbd7518781a125618def620600f13
        with:
          recipe: desktop-native-gen
      - name: Generate native CLI resources from canonical sources
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@2141b5788e0dbd7518781a125618def620600f13
        with:
          recipe: cli-gen
      - name: Retain the exact native projection patch for review
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          git add --intent-to-add -- .
          git diff --binary > "${RUNNER_TEMP}/native-projections.patch"
          {
            echo "source_head=${SOURCE_HEAD}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            sha256sum "${RUNNER_TEMP}/native-projections.patch"
            git diff --stat
          } > "${RUNNER_TEMP}/native-projections.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-projections-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-projections.patch
            ${{ runner.temp }}/native-projections.txt
          if-no-files-found: error
          retention-days: 3
