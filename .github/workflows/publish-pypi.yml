# Publishes to PyPI the exact bytes a `release-candidate` run already built and
# attested. It never builds and never checks out repository code: the artifact
# comes from the named run, so what is uploaded is what was attested rather than
# something equivalent produced a second time.
#
# Two independent authorisations, and neither implies the other. `run_id` names
# one immutable set of bytes; the `pypi-cli` environment holds the upload until a
# person approves it. Trusted Publishing then authenticates with an OIDC token
# naming this repository, this workflow file and that environment, so a token
# minted anywhere else buys nothing.
#
# There is no API token in this file, and that is the point: a long-lived upload
# credential is a secret somebody has to keep safe forever, and Trusted
# Publishing replaces it with an identity PyPI verifies for each run.
#
# After the upload, `github-release` attaches the same candidate files to the
# GitHub Release for the tag, so the two public copies cannot differ.
#
# The candidate carries one `ai-stp-cli` distribution plus an SBOM, a release
# manifest and `SHA256SUMS`. Only the distributions are uploaded, and only after
# their digests are checked against those sums — uploading whatever the
# directory happened to contain would make the download the only real check.
name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish, without a leading v
        required: true
        type: string
      run_id:
        description: release-candidate run whose attested artifact is published
        required: true
        type: string
      package:
        description: Exact PyPI project to publish in this run
        required: true
        type: choice
        options:
          - cli

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: publish-ai-stp-${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-cli
      url: https://pypi.org/project/ai-stp-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact bytes attested by release-candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ai-stp-python-${{ inputs.version }}-*
          merge-multiple: true
          path: candidate

      - name: Verify distributions against the candidate SHA256SUMS
        working-directory: candidate
        run: |
          set -euo pipefail
          test -f SHA256SUMS || { echo "candidate carries no SHA256SUMS" >&2; exit 1; }
          # Every file the candidate recorded, including the SBOM and manifest.
          # Checking only what we upload would leave a swapped SBOM unnoticed.
          sha256sum --check --strict SHA256SUMS

      - name: Select package distributions and reject incomplete sets
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DISTRIBUTION: ai_stp_${{ inputs.package }}
          # Through the environment for the same reason as the two above it.
          # This one was expanded straight into the `run` block below, so the
          # file was already doing the right thing twice and the wrong thing
          # once — the shape a review reads past, because the correct lines are
          # adjacent and look like the whole answer.
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          wheel="candidate/${DISTRIBUTION}-${EXPECTED_VERSION}-py3-none-any.whl"
          sdist="candidate/${DISTRIBUTION}-${EXPECTED_VERSION}.tar.gz"
          for path in "${wheel}" "${sdist}"; do
            if [[ ! -f "${path}" ]]; then
              echo "run ${RUN_ID} has no $(basename "${path}")" >&2
              exit 1
            fi
            cp "${path}" dist/
          done
          # Exactly two: one package in both formats. A surplus file means
          # the candidate is not the one this workflow was written against.
          count="$(find dist -type f | wc -l)"
          if [[ "${count}" -ne 2 ]]; then
            echo "expected 2 distributions, selected ${count}" >&2
            exit 1
          fi
          printf 'publishing:\n'
          find dist -type f -printf '  %f\n' | sort

      - name: Upload through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          print-hash: true

  github-release:
    name: github-release-ai-stp-${{ inputs.package }}
    # The GitHub Release carries the bytes PyPI just accepted, from the same
    # attested run. It used to be a manual step after publication, and it was
    # missed: v0.0.23, v0.0.29, v0.0.30, v0.0.32-v0.0.35 and v0.0.37-v0.0.38
    # reached PyPI with no GitHub Release until a later audit backfilled them.
    # `desktop-release.yml` already creates its own; this is the same step for
    # the CLI.
    #
    # Runs only after the upload succeeded, needs no environment and no OIDC,
    # and never checks out repository code: the assets are the candidate's own
    # files, verified against its SHA256SUMS a second time.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # `gh release create` on the existing tag; nothing else
    steps:
      - name: Download the exact bytes attested by release-candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ai-stp-python-${{ inputs.version }}-*
          merge-multiple: true
          path: candidate

      - name: Verify the candidate against its SHA256SUMS
        working-directory: candidate
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS

      - name: Create the GitHub release from the same candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.run_id }}
          PUBLISH_RUN: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        working-directory: candidate
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # A rerun after a partial failure must not fail on its own earlier
          # success, and must not replace assets someone already verified.
          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; left unchanged"
            exit 0
          fi
          # The previous CLI tag, for a compare link. Desktop tags
          # (`desktop-v*`) share the repository and are a different line.
          previous="$(
            gh api "repos/${REPOSITORY}/tags" --paginate --jq '.[].name' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "${tag}"; } \
              | sort -V -u | grep -B1 -x -F "${tag}" | head -n1
          )"
          # The backticks are Markdown for the release body, not a substitution.
          # shellcheck disable=SC2016
          {
            printf 'PyPI: `ai-stp-cli==%s` (publish run %s). ' "${VERSION}" "${PUBLISH_RUN}"
            printf 'Attested bytes from release-candidate run %s.\n' "${RUN_ID}"
            if [[ -n "${previous}" && "${previous}" != "${tag}" ]]; then
              printf '\nChanges: https://github.com/%s/compare/%s...%s\n' \
                "${REPOSITORY}" "${previous}" "${tag}"
            fi
          } > "${RUNNER_TEMP}/NOTES.md"
          # `--latest=false`: the repository's Latest is the desktop download;
          # the CLI's install channel is PyPI.
          gh release create "${tag}" \
            --repo "${REPOSITORY}" --verify-tag --latest=false \
            --title "ai-stp-cli ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/NOTES.md" \
            -- *
