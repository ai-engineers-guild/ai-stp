# Reuse the exact qualified Dev source, accepted analysis and native installers.
# The target fetches the monotonic deployment ref; this workflow has no host credential.
name: deploy

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing successful push-to-Dev qualification to reconcile
        type: string
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: promote
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'dev'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    permissions:
      contents: write
      actions: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-promotion
      cancel-in-progress: false
    outputs:
      head_sha: ${{ steps.source.outputs.head_sha }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_attempt: ${{ steps.source.outputs.source_attempt }}
      publish_desktop: ${{ steps.promote.outputs.publish_desktop }}
      desktop_version: ${{ steps.promote.outputs.desktop_version }}
    steps:
      - name: Admit the exact successful Dev source before executing its code
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          OBSERVED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          run_path="repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          source_run="$(gh api "${run_path}")"
          head="$(jq -r .head_sha <<< "${source_run}")"
          attempt="$(jq -r .run_attempt <<< "${source_run}")"
          [[ "${head}" =~ ^[0-9a-f]{40}$ && "${attempt}" =~ ^[1-9][0-9]*$ ]]
          if [[ -n "${OBSERVED_ATTEMPT}" ]]; then
            test "${OBSERVED_ATTEMPT}" = "${attempt}"
          fi
          jq -e --arg repo "${REPOSITORY}" --arg sha "${head}" \
            --argjson run "${SOURCE_RUN_ID}" --argjson attempt "${attempt}" '
            .id == $run and .repository.full_name == $repo and
            .head_repository.full_name == $repo and .head_sha == $sha and
            .event == "push" and .head_branch == "dev" and
            .path == ".github/workflows/check.yml" and
            .status == "completed" and .conclusion == "success" and .run_attempt == $attempt
          ' <<< "${source_run}" >/dev/null
          jobs="$(gh api "${run_path}/attempts/${attempt}/jobs?per_page=100")"
          jq -e '
            .total_count == (.jobs | length) and
            ([.jobs[] | select(.name == "full-qualification")] |
              length == 1 and all(.[]; .status == "completed" and .conclusion == "success"))
          ' <<< "${jobs}" >/dev/null
          test "$(gh api "repos/${REPOSITORY}/git/ref/heads/dev" --jq .object.sha)" = "${head}"
          printf 'head_sha=%s\nsource_run_id=%s\nsource_attempt=%s\n' \
            "${head}" "${SOURCE_RUN_ID}" "${attempt}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.9"
      - name: Check the qualified source and reviewed live delivery rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@2141b5788e0dbd7518781a125618def620600f13
        with:
          recipe: ci-delivery-admit
      - name: Require the published CLI download before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          python3 - <<'PY'
          import ast
          import base64
          import json
          import os
          import re
          import subprocess

          repository = os.environ["REPOSITORY"]
          head = os.environ["HEAD_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", head)

          def api(path):
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/{path}"],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              return json.loads(result.stdout)

          document = api(
              "contents/packages/contracts/src/ai_stp_contracts/cli_copy.py?ref=" + head
          )
          assert document["encoding"] == "base64"
          source = base64.b64decode("".join(document["content"].split()), validate=True)
          values = [
              node.value.value
              for node in ast.parse(source).body
              if isinstance(node, ast.AnnAssign)
              and isinstance(node.target, ast.Name)
              and node.target.id == "CLI_RELEASES_URL"
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          assert len(values) == 1, "one literal native CLI release link required"
          match = re.fullmatch(
              r"https://github.com/ai-engineers-guild/ai-stp/releases/tag/cli-v"
              r"((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))",
              values[0],
          )
          assert match, "canonical stable native CLI release link required"
          version = match[1]
          tag = "cli-v" + version
          release = api("releases/tags/" + tag)
          assert release["tag_name"] == tag and release["draft"] is False
          assert release["prerelease"] is False and release["published_at"]
          names = set()
          for target, extension, platform in [
              ("x86_64-unknown-linux-gnu", "tar.gz", "manylinux_2_43_x86_64"),
              ("aarch64-apple-darwin", "tar.gz", "macosx_15_0_arm64"),
              ("x86_64-pc-windows-msvc", "zip", "win_amd64"),
          ]:
              names.add(f"ai-stp-cli-{version}-{target}.{extension}")
              names.add(f"ai_stp-{version}-py3-none-{platform}.whl")
          names.add(f"ai-stp-cli-{version}.crate")
          names |= {name + ".sha256" for name in names}
          assets = release["assets"]
          assert len(assets) == len(names) == 14
          assert {asset["name"] for asset in assets} == names
          assert all(
              asset["state"] == "uploaded" and asset["size"] > 0
              and re.fullmatch(r"sha256:[0-9a-f]{64}", asset["digest"] or "")
              for asset in assets
          ), "complete uploaded CLI release assets and digests required"
          reference = api("git/ref/tags/" + tag)["object"]
          assert reference["type"] == "tag", "annotated release tag required"
          tagged = api("git/tags/" + reference["sha"])
          assert tagged["tag"] == tag and tagged["object"]["type"] == "commit"
          comparison = api("compare/" + tagged["object"]["sha"] + "..." + head)
          assert comparison["status"] in ("ahead", "identical"), "release outside source history"
          print(f"Published native CLI {tag}: all14 assets; source ancestry accepted")
          PY
      - name: Download actual source analysis without executing its contents
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          pattern: codeql-source-*
          path: source-analysis
          digest-mismatch: error
      - name: Register unchanged qualified analysis for the release reference
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@2141b5788e0dbd7518781a125618def620600f13
        with:
          recipe: ci-delivery-register-findings
      - name: Fast-forward the qualified source and read back deployment
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@2141b5788e0dbd7518781a125618def620600f13
        with:
          recipe: ci-delivery-promote

  verify-public:
    name: verify-public
    needs: promote
    # The same condition `promote` carries, and for the same reason it carries
    # it twice: a static analyser cannot see that `needs` already settles this.
    # CodeQL reports the checkout below as untrusted because a `workflow_run`
    # can in general be raised by a fork's pull request — which this one cannot,
    # since `promote` admits only an exact qualified Dev source and a
    # skipped dependency skips its dependents. Saying so here makes the
    # guarantee legible to the reader and to the scanner.
    #
    # The checkout is credential-free regardless: `persist-credentials: false`,
    # and this job may only read.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'dev'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    # The wait below plus checkout and setup. Larger than the wait, so a
    # timeout means the job was starved rather than the target being late.
    #
    # It was 18 while the wait beneath it was already 25, so the job was killed
    # seven minutes before its own wait could conclude. Run 32629727961 spent
    # 18m28s and was cancelled while production had in fact deployed — exactly
    # the red-run-for-a-healthy-deployment this bound exists to prevent, caused
    # by the fix for it moving only one of the two numbers.
    #
    # `test_deploy_verification_outlasts_its_own_wait` now holds the pair, which
    # is a relationship the tree can state: the comment above says the ceiling
    # must exceed the wait, and nothing checked that it did.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.promote.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.9"
      # Promotion and deployment are separate events, so an immediate check
      # would measure whether the target had already deployed a commit promoted
      # seconds earlier — it never has. Waiting a bounded time is what makes a
      # green deployment a claim rather than a formality.
      #
      # The bound is measured, and the first measurement was too tight. Twelve
      # minutes came from an observed six between the target's tick and
      # readiness; two deployments on 2026-08-22 took 13m17s and about the same
      # from `promote` to the new commit answering, so the job reported failure
      # for deployments that had in fact succeeded a minute later. That is worse
      # than no check: a red run for a healthy deployment teaches people to
      # ignore the colour.
      #
      # Twenty-five minutes was the bound until 2026-08-27, chosen as roughly
      # twice an observed thirteen. The instruction it left — measure before
      # raising — is what produced the numbers below, and they say the margin
      # was gone rather than that this was one bad run:
      #
      #   33078274318  failure  25.4 min   promote 13:43:01 → host recorded 14:10:10
      #   33026898606  success  25.2 min
      #   33026235678  success  25.4 min
      #
      # Three of the last six sat on the ceiling; two got in and one did not.
      # The real figure is the first line: **27m09s** from promote to the host
      # recording the commit. So it was never twice the observed time, it was
      # a hair over it, and what actually happened on 2026-08-27 is that the
      # host crossed by two minutes.
      #
      # Forty minutes was the bound until 2026-09-02, against a measured 27.
      # What dominates is the target rebuilding images and that grows with the
      # tree — the failing run's log carries 503s and read timeouts from the
      # host while it rebuilds, which is the same growth seen from the other
      # side.
      #
      # The measurement that moved it again was not one roll but a queue.
      # Three promotions inside sixteen minutes on 2026-09-01:
      #
      #   33562822602  9c137fdb  promote 21:46:04 → host serving 22:15:03  (29 min)
      #   33563510671  80b155cd  promote 21:53:57 → failed 22:34, host still on 9c137fdb
      #   33564221818  b04eebbe  promote 22:02:12 → failed 22:42, host still on 9c137fdb
      #
      # The host pulls every minute but deploys serially, and it always takes
      # the newest ref — so a promotion that lands mid-roll waits for that roll
      # to finish and then for its own, and the queue is never deeper than two.
      # The bound is therefore two rolls of the measured 29, not one: sixty-five
      # minutes. Both later commits were serving by 23:00, contained by
      # `b04eebbe`, which the ancestry check below already accepts. A shorter
      # bound reports the second of two pushes as failed every time, which is
      # the red-run-for-a-healthy-deployment this whole comment is about.
      #
      # Measure again before raising. A roll that genuinely takes half an hour
      # is a fact about the host — image builds on a small machine — worth
      # acting on separately, not a number to bump a third time.
      #
      # Deliberately not held by a test. The only relationship available in the
      # tree is to the timer's sixty-second tick, and a bound stated against
      # that would have passed at twelve minutes — the value that actually
      # failed. What this number has to clear is how long the host takes to
      # rebuild, which no file here knows. A test that would have missed the
      # defect it was written for is worse than the comment explaining it.
      - name: Prove the target deployed the promoted commit
        env:
          ORIGIN: ${{ vars.AI_STP_PUBLIC_ORIGIN }}
          DOCS_ORIGIN: ${{ vars.AI_STP_DOCS_ORIGIN }}
          HEAD_SHA: ${{ needs.promote.outputs.head_sha }}
          # Which commit contains which is asked of GitHub, because this
          # checkout is shallow and pinned to `HEAD_SHA`: the commit that
          # overtook it does not exist in the clone.
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${ORIGIN}"
          test -n "${DOCS_ORIGIN}"
          python3 deploy/verify_public.py \
            --origin "${ORIGIN}" \
            --docs-origin "${DOCS_ORIGIN}" \
            --expected-commit "${HEAD_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --migrations-dir migrations/versions \
            --expected-environment prod \
            --wait-seconds 3900

  desktop-release:
    name: desktop-release
    needs: promote
    if: needs.promote.outputs.publish_desktop == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.promote.outputs.desktop_version }}
      source_sha: ${{ needs.promote.outputs.head_sha }}
      source_run_id: ${{ needs.promote.outputs.source_run_id }}
