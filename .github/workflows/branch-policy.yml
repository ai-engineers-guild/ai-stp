name: branch-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-26.04
    steps:
      - name: Require integration pull requests to target Dev
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = pull_request ] && [ "${BASE}" != dev ]; then
            echo 'Changes integrate through dev; main advances from qualified Dev source.' >&2
            exit 1
          fi
