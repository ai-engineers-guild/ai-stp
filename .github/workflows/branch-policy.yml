name: branch-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  branch-policy:
    runs-on: ubuntu-26.04
    steps:
      - name: Require integration pull requests to target Dev
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = pull_request ] && [ "${BASE}" != dev ]; then
            echo 'Changes integrate through dev; main advances from qualified Dev source.' >&2
            exit 1
          fi
