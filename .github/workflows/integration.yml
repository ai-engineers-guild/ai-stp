# PR eligibility never publishes the full-qualification context.
name: integration

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/source.yml
  qualification:
    name: qualification
    if: always()
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require the complete integration result
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "${RESULT}" = success
