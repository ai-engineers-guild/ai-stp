# PR eligibility never publishes the full-qualification context.
name: integration

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  verify:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/source.yml
  qualification:
    name: qualification
    if: always()
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require the complete integration result
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "${RESULT}" = success
