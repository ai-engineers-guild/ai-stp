name: macos-confinement

on:
  pull_request:
    paths:
      - tests/native_confinement/macos.mm
      - .github/scripts/qualify-macos-confinement.py
      - .github/workflows/macos-confinement.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-confinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-helper:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.9"
      - name: Compile and exercise the signed helper and actual descendant
        run: python3 .github/scripts/qualify-macos-confinement.py
