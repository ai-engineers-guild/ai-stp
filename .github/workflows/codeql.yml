# Static analysis for the public mirror. check.yml joins actual analysis and
# processed findings for source qualification. Independent scheduled analysis
# also detects vulnerabilities after the containing code stopped changing.
#
# GitHub-hosted on purpose. CodeQL needs `security-events: write` and does not
# need Docker; the fleet class that runs the gate must not carry this job
# (`ADR-0105`, unpublished). Public repositories get this runner at no cost.
# Private ones do not get Code scanning on the free plan, so the job is
# skipped there —
# the file still lives in this tree so the public mirror stays a copy instead
# of growing its own workflow.
name: codeql

on:
  workflow_call:
  schedule:
    # Weekly, offset off the hour so it does not join the crowd at midnight.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: analyse (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Keep init and analyze on the same release and commit.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
