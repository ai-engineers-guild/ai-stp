# Static analysis for the public mirror. check.yml joins actual analysis and
# processed findings for source qualification. Independent scheduled analysis
# also detects vulnerabilities after the containing code stopped changing.
#
# GitHub-hosted on purpose. CodeQL needs `security-events: write` and does not
# need Docker; the fleet class that runs the gate must not carry this job.
# Public repositories get this runner at no cost.
# Private ones do not get Code scanning on the free plan, so the job is
# skipped there —
# the file still lives in this tree so the public mirror stays a copy instead
# of growing its own workflow.
name: codeql

on:
  workflow_call:
  schedule:
    # Weekly, offset off the hour so it does not join the crowd at midnight.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: analyse (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Outside telemetry off
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@9fead1382c452a6b791a0a9e464ac6ac66537ac3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: '3.15.2'
      # Keep init and analyze on the same release and commit.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyse
        id: analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
          post-processed-sarif-path: ${{ runner.temp }}/codeql-original-payload
      - name: Retain the exact accepted analysis and original provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-original-payload
          SARIF_OUTPUT: ${{ runner.temp }}/codeql-source-proof
          SOURCE_LANGUAGE: ${{ matrix.language }}
          ORIGINAL_SARIF_ID: ${{ steps.analysis.outputs.sarif-id }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-codeql-retain-analysis
      - name: Retain source analysis without granting it release authority
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-source-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-source-proof/
          if-no-files-found: error
          retention-days: 7
