# Static analysis for the public mirror. It is not the gate: findings must not
# look like a broken `check`, and a vulnerability class can appear after the
# code that contains it stopped changing, so this also runs on a schedule.
#
# GitHub-hosted on purpose. CodeQL needs `security-events: write` and does not
# need Docker; the fleet class that runs the gate must not carry this job
# (`ADR-0105`). Public repositories get this runner at no cost. Private ones
# do not get Code scanning on the free plan, so the job is skipped there —
# the file still lives in this tree so the public mirror stays a copy instead
# of growing its own workflow.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, offset off the hour so it does not join the crowd at midnight.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: analyse (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Pinned by commit, like every other action here, and chosen as the
      # current release rather than whatever was current when this was
      # written: `codeql-bundle-v2.26.3`.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef
        with:
          category: /language:${{ matrix.language }}
