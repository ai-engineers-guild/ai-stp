        with:
          recipe: ci-coverage-combine-shard-coverage-and-report
  # Lint, types, production build, audit and Storybook are Linux-only: they
  # do not read the host OS the way the test suites do. Unit, e2e and feature
  # profiles run on three operating systems. Browser jobs pay for
  # Playwright; e2e stays one spec-set per OS because mock auth/profile/catalog
  # state is process-local (`fullyParallel: false`, playwright#30253).
  web-static:
    if: github.event_name != 'pull_request'
    name: web-static
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Build, static-check, audit and Storybook
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-web-static-build-static-check-audit-and-storybook
      - name: Dependency advisory scan with bounded source assessments
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-web-static-dependency-advisory-scan-with-bounded-source-assessments

  web-unit:
