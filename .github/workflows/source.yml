# Shared source qualification. Callers select PR integration or full Dev checks.
# All existing owners and strict phase accounting stay in this workflow.
name: source

on:
  workflow_call:
    inputs:
      native_vault_rounds:
        description: Concurrent real Linux vault rounds (1-100)
        type: string
        default: "100"

permissions:
  contents: read

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHON_VERSION: "3.15.2"
  NODE_VERSION: "26.13.1"
  UV_VERSION: "0.13.7"
  BUN_VERSION: "1.4.4"

jobs:
  native-experiments:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      wasi: ${{ steps.select.outputs.wasi }}
      cli: ${{ steps.select.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '0'
          persist-credentials: 'false'
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check the project command grammar and formatting
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: just-fmt
      - name: Prepare the exact infrastructure source checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/infra-check-tools.json
          directory: ${{ runner.temp }}/ai-stp-infra-tools
      - name: Expose this job's infrastructure checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-infra-check-tools
      - name: Check workflow, Dockerfile and shell source
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: infra-source
      - name: Select only registered native experiment owners
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/select-native-experiments.py

  wasi-confinement:
    needs: native-experiments
    if: needs.native-experiments.outputs.wasi == 'true'
    uses: ./.github/workflows/wasi-confinement.yml

  safety-runtime:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/safety-runtime.yml

  vendor-discovery:
    needs: archives
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/native-vendor-checks.yml
    with:
      installed_engine: true

  native-corporate:
    needs: archives
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: read
    uses: ./.github/workflows/native-corporate-checks.yml

  secrets:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      SOURCE_SECRET_SCANNER_VERSION: "1.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '0'
          persist-credentials: 'false'
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare the exact offline source-secret scanner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/secret-check-tools.json
          directory: ${{ runner.temp }}/ai-stp-integration-secrets
      - name: Expose this job's source-secret scanner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-source-secret-tools
      - name: Verify the scanner and inspect the selected source
        env:
          SOURCE_SECRET_SCANNER: ${{ runner.temp }}/ai-stp-integration-secrets/betterleaks
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-secrets-verify-the-scanner-and-inspect-the-selected-source
  rust-dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/project-rust
        with:
          components: rustfmt
      - name: Prepare the exact native dependency checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/rust-check-tools.json
          directory: ${{ runner.temp }}/ai-stp-native-check-tools
      - name: Expose this job's prepared checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-check-tools
      - name: Prepare the locked crate sources without compiling them
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: setup-rust-analysis
      - name: Offline dependency use, version constraints and sources
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: rust-dependencies

  python-dependencies:
    name: python-dependencies (${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.16", "3.13.18", "3.14.10", "current"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ matrix.python == 'current' && env.PYTHON_VERSION || matrix.python }}
          uv-version: ${{ env.UV_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          {
            echo "UV_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-python-dependencies"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - name: Prepare the locked Python dependencies
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: setup-python
      - name: Check each owner and actual refusal behavior
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-python-dependencies

  integration-python:
    if: github.event_name == 'pull_request'
    needs: native-experiments
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          {
            echo "UV_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-integration-python"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - name: Prepare the declared Python and analysis dependencies
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: setup-python-source
      - name: Prepare the exact documentation source checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/documentation-check-tools.json
          directory: ${{ runner.temp }}/ai-stp-documentation-tools
      - name: Expose this job's documentation checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-documentation-check-tools
      - name: Verify actual checker acceptance and rule refusals
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-documentation-checker-contracts
      - name: Python source, contracts and units without server services
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-python-check-source-contracts-and-units-without-server-services
  integration-web:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '0'
          persist-credentials: 'false'
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore bun packages without a PR-scoped duplicate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Web syntax, types and units
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-web-web-syntax-types-and-units
      - name: Desktop types and component units
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-web-desktop-types-and-component-units
      - name: Prepare the exact documentation source checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/documentation-check-tools.json
          directory: ${{ runner.temp }}/ai-stp-documentation-tools
      - name: Expose this job's documentation checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-documentation-check-tools
      - name: Verify actual checker acceptance and rule refusals
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-documentation-checker-contracts
      - name: Documentation Markdown syntax
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-web-documentation-markdown-syntax
  integration-native:
    if: github.event_name == 'pull_request'
    name: integration-native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-latest]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '0'
          persist-credentials: 'false'
      - name: Select an external native artifact directory
        shell: bash
        run: |
          python - <<'PY'
          import os
          target = os.path.join(os.environ["RUNNER_TEMP"], "ai-stp-native-target")
          relative = os.path.relpath(target, "apps/cli")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"CARGO_TARGET_DIR={target}\n")
              output.write(f"NATIVE_CACHE_WORKSPACE=apps/cli -> {relative}\n")
          PY
      - uses: ./.github/actions/project-rust
        with:
          components: clippy,rustfmt
      - name: Prepare the exact native test runner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/nextest-${{ runner.os }}.json
          directory: ${{ runner.temp }}/ai-stp-native-test-tools
      - name: Expose this job's prepared native test runner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-test-tools
      - name: Restore native dependencies shared with successful Dev
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        timeout-minutes: 5
        with:
          prefix-key: native-deps-v1
          shared-key: cli
          workspaces: ${{ env.NATIVE_CACHE_WORKSPACE }}
          cache-bin: 'false'
          save-if: 'false'
      - name: Observe Linux package networking before native checks
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/observe-native-package-network.sh before-native
      - name: Native formatting, all-target analysis and library units
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-native-native-formatting-all-target-analysis-and-library-units
      - name: Existing native vault and independent CLI processes
        if: runner.os != 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-native-existing-native-vault-and-independent-cli-processes
      - name: Public native configuration across independent CLI processes
        if: runner.os != 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-native-public-native-configuration-across-independent-cli-processes
      - name: Install the isolated Linux credential fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash .github/scripts/observe-native-package-network.sh before-index
          bash .github/scripts/native-apt.sh update -qq
          bash .github/scripts/native-apt.sh install --yes --no-install-recommends \
            dbus-daemon gnome-keyring libglib2.0-bin
      - name: Fresh concurrent Linux clients and independent CLI processes
        if: runner.os == 'Linux'
        env:
          AI_STP_NATIVE_VAULT_ROUNDS: '10'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-native-fresh-concurrent-linux-clients-and-independent-cli-processes

  desktop:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: read
    uses: ./.github/workflows/desktop.yml

  analysis:
    if: github.event.repository.private == false
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  archives:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cli-archives.yml

  qualification:
    name: qualification
    if: always()
    needs:
      - native-experiments
      - rust-dependencies
      - python-dependencies
      - wasi-confinement
      - safety-runtime
      - vendor-discovery
      - native-corporate
      - secrets
      - integration-python
      - integration-web
      - integration-native
      - cli
      - docs
      - package
      - tests
      - coverage
      - web-static
      - web-unit
      - web-e2e
      - web-profiles
      - desktop
      - analysis
      - archives
    permissions:
      contents: read
      security-events: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          PHASE: ${{ github.event_name == 'pull_request' && 'integration' || 'full' }}
          WASI_SELECTED: ${{ needs.native-experiments.outputs.wasi }}
          CLI_SELECTED: ${{ needs.native-experiments.outputs.cli }}
        run: |
          set -euo pipefail
          jq -c 'to_entries | map({job: .key, result: .value.result})' <<< "${RESULTS}"
          printf 'Qualification phase: %s\n' "${PHASE}"
          jq -e --argjson private "${PRIVATE_REPOSITORY}" --arg phase "${PHASE}" \
            --arg wasi "${WASI_SELECTED}" --arg cli "${CLI_SELECTED}" '
            type == "object" and length == 23 and
            ($phase == "integration" or $phase == "full") and
            ($wasi == "true" or $wasi == "false") and
            ($phase != "full" or $wasi == "true") and
            ($cli == "true" or $cli == "false") and
            ($phase != "full" or $cli == "true") and
            all(to_entries[];
              if .key == "analysis" then
                .value.result == (if $private then "skipped" else "success" end)
              elif (.key == "secrets" or .key == "native-experiments"
                    or .key == "rust-dependencies" or .key == "python-dependencies") then
                .value.result == "success"
              elif .key == "wasi-confinement" then
                .value.result == (if $wasi == "true" then "success" else "skipped" end)
              elif .key == "cli" then
                .value.result == (if $cli == "true" then "success" else "skipped" end)
              elif (.key | startswith("integration-")) then
                .value.result == (if $phase == "integration" then "success" else "skipped" end)
              else
                .value.result == (if $phase == "full" then "success" else "skipped" end)
              end
            )
          ' <<< "${RESULTS}" >/dev/null
      - name: Check the validated source and processed code scanning findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = push ]; then
            current="$(gh api "repos/${REPOSITORY}/git/ref/${SOURCE_REF#refs/}" --jq .object.sha)"
            test "${current}" = "${SOURCE_SHA}"
          fi
          # CodeQL's pinned analyzer waits for SARIF processing before its
          # dependency completes. A successful upload alone cannot hide alerts.
          if [ "${PRIVATE_REPOSITORY}" = false ]; then
            findings="$(gh api --method GET "repos/${REPOSITORY}/code-scanning/alerts" \
              -f state=open -f ref="${SOURCE_REF}" -f per_page=1 --jq length)"
            test "${findings}" = 0
          fi

  cli:
    # A pull request that touches the native CLI or its corporate fixtures runs
    # the Linux leg, so a broken corporate journey is caught before the merge.
    needs: native-experiments
    if: needs.native-experiments.outputs.cli == 'true'
    name: cli-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold Windows build takes about 25 minutes before the consumer proof.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["ubuntu-26.04"]')
          || fromJSON('["ubuntu-26.04", "macos-26", "windows-latest"]') }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
      - name: Prepare shared wire-contract validators
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-cli"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - name: Install shared wire-contract validators
        shell: bash
        run: >-
          uv sync --locked --package ai-stp-contracts
          --package ai-stp-sources --no-default-groups
      - name: Select an external native artifact directory
        shell: bash
        run: |
          python - <<'PY'
          import os
          target = os.path.join(os.environ["RUNNER_TEMP"], "ai-stp-native-target")
          relative = os.path.relpath(target, "apps/cli")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"CARGO_TARGET_DIR={target}\n")
              output.write(f"NATIVE_CACHE_WORKSPACE=apps/cli -> {relative}\n")
          PY
      - uses: ./.github/actions/project-rust
        with:
          components: clippy,rustfmt
      - name: Prepare the exact native test runner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/nextest-${{ runner.os }}.json
          directory: ${{ runner.temp }}/ai-stp-native-test-tools
      - name: Expose this job's prepared native test runner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-test-tools
      - name: Restore and retain only successful Dev's native dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        timeout-minutes: 5
        with:
          prefix-key: native-deps-v1
          shared-key: cli
          # One mapping owns the shared target: cleaning it once per workspace
          # would discard another workspace's dependencies. All checks still run.
          workspaces: ${{ env.NATIVE_CACHE_WORKSPACE }}
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      - name: Restore isolated previous native build artifacts
        if: runner.os == 'Linux'
        id: previous-native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/ai-stp-previous-native-binaries
          # Restore before long-running checks to reduce the eviction window.
          # Every use verifies compiler/recipe/bytes and reruns actual API controls.
          # No prefix fallback may import another producer's artifacts.
          key: >-
            previous-native-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('apps/cli/rust-toolchain.toml',
            '.github/scripts/build-previous-native-cli.sh',
            '.github/scripts/previous-native-cache.py') }}
      - name: Observe Linux package networking before native checks
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/observe-native-package-network.sh before-native
      - name: Native boundary checks
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-native-boundary-checks
      - name: Public native configuration across independent CLI processes
        if: runner.os != 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-native-public-native-configuration-across-independent-cli-processes
      - name: Install the isolated Linux credential fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash .github/scripts/observe-native-package-network.sh before-index
          bash .github/scripts/native-apt.sh update -qq
          bash .github/scripts/native-apt.sh install --yes --no-install-recommends \
            dbus-daemon gnome-keyring libglib2.0-bin
      - name: Actual Linux Secret Service enrollment and recovery
        # A pull request soaks the same check in integration-native.
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        env:
          AI_STP_NATIVE_VAULT_ROUNDS: ${{ inputs.native_vault_rounds || '100' }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-integration-native-fresh-concurrent-linux-clients-and-independent-cli-processes
      - name: Existing consumers and real SQLite backup
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-existing-consumers-and-real-sqlite-backup
      - name: Build the immutable previous schema58 native writer
        if: runner.os == 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-build-the-immutable-previous-schema58-native-writer
      - name: Build the qualified previous schema59 binding writer
        if: runner.os == 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-build-the-qualified-previous-schema59-binding-writer
      - name: Verify the immutable released schema60 native writer
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-verify-the-immutable-released-schema60-native-writer
      - name: Verify the immutable released schema61 native writer
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-verify-the-immutable-released-schema61-native-writer
      - name: Ownership and corporate journeys through the native HTTP client
        if: runner.os == 'Linux'
        env:
          AI_STP_TEST_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@127.0.0.1:15432/ai_stp
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-cli-ownership-and-corporate-journeys-through-the-native-http-client
      - name: Cache previous native builds after API acceptance
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
          runner.os == 'Linux' && steps.previous-native-cache.outputs.cache-hit != 'true' &&
          steps.previous-native-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/ai-stp-previous-native-binaries
          key: ${{ steps.previous-native-cache.outputs.cache-primary-key }}

  docs:
    if: github.event_name != 'pull_request'
    name: docs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-docs-${{ hashFiles('docs_scripts/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-docs-
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-docs"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Prepare the exact documentation source checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/documentation-check-tools.json
          directory: ${{ runner.temp }}/ai-stp-documentation-tools
      - name: Expose this job's documentation checkers
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-documentation-check-tools
      - name: Verify actual checker acceptance and rule refusals
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-documentation-checker-contracts
      - name: Prepare and check the documentation
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-docs-prepare-and-check-the-documentation
      - name: Build the pinned production docs image
        timeout-minutes: 15
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-docs-build-the-pinned-production-docs-image
      - name: Qualify the actual unprivileged docs process and both languages
        timeout-minutes: 3
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-docs-qualify-the-actual-unprivileged-docs-process-and-both-languages
      - name: Retain the public docs runtime result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/docs-runtime-proof.json
          if-no-files-found: error
          retention-days: 7

  package:
    if: github.event_name != 'pull_request'
    name: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
