          restore-keys: ${{ runner.os }}-bun-
      - name: Unit and component tests
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-web-unit-unit-and-component-tests
  web-e2e:
    if: github.event_name != 'pull_request'
    name: web-e2e (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total || 2 }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-latest]
        shard: [1, 2]
        # macOS runs the suite as one shard: GitHub's free plan gives five concurrent macOS jobs,
        # and a second macOS shard queues behind the native jobs to repeat a ~4 min fixed cost.
        exclude:
          - os: macos-26
            shard: 2
        include:
          - os: macos-26
            shard: 1
            total: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Ensure a Google Chrome is present
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-web-e2e-ensure-a-google-chrome-is-present
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Build and run the browser scenarios
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-web-e2e-build-and-run-the-browser-scenarios
          arguments: ${{ format('["{0}/{1}"]', matrix.shard, matrix.total || 2) }}
      # A failing browser scenario used to end here, leaving a line of console
      # output and nothing to diagnose it with: whether the biography never
      # reached the catalogue, reached it and did not render, or rendered after
      # the locator gave up are different defects with the same message. The
      # suite runs against in-process mocks with mock auth, so what is retained
      # is fixture content rather than anyone's data. Bounded on purpose.
      - name: Keep the diagnostics for a failed browser scenario
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-diagnostics-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/web/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  web-profiles:
