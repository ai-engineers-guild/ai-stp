name: wasi-confinement

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasi-confinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.9"
      - name: Use the exact project compiler on this disposable runner
        run: bash .github/scripts/install-rust-toolchain.sh apps/cli/rust-toolchain.toml
      - name: Add only the pinned compiler's WASIp2 standard library
        run: rustup target add --toolchain "${RUSTUP_TOOLCHAIN}" wasm32-wasip2
      - name: Compile one portable component without third-party guest dependencies
        env:
          ARTIFACT: ${{ runner.temp }}/wasi-component
        run: python .github/scripts/qualify-wasi-confinement.py build "${ARTIFACT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasi-component
          path: ${{ runner.temp }}/wasi-component
          if-no-files-found: error
          retention-days: 7

  confinement:
    needs: component
    name: wasi-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.9"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wasi-component
          path: ${{ runner.temp }}/wasi-component
      - name: Verify runtime digest and exercise the identical guest component
        shell: bash
        env:
          ARTIFACT: ${{ runner.temp }}/wasi-component
        run: python .github/scripts/qualify-wasi-confinement.py exercise "${ARTIFACT}"
