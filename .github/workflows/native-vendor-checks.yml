name: native-vendor-checks

on:
  workflow_call:
    inputs:
      installed_engine:
        description: Require the native CLI artifacts from this same source run
        type: boolean
        default: false
      source_run_id:
        description: Diagnostic archive producer; empty requires this source run
        type: string
        default: ''
      engine_source:
        description: Diagnostic engine source; empty requires this source SHA
        type: string
        default: ''

concurrency:
  group: native-vendor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  discovery:
    name: vendors-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      AI_STP_NATIVE_VENDOR_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare the declared hosted SDK
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: '3.15.2'
          bun-version: '1.4.4'
          node-version: '26.13.1'
      - name: Read the same-run qualified native CLI archive
        if: inputs.installed_engine
        id: engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-stp-rust-${{ matrix.target }}-${{ inputs.engine_source || github.sha }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ inputs.source_run_id && github.token || '' }}
          path: ${{ runner.temp }}/ai-stp-engine-archives
      - name: Prepare the exact official vendor distribution
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          manifest: .github/codex-${{ runner.os }}.json
          directory: ${{ runner.temp }}/ai-stp-codex-distribution
      - name: Read actual vendor configuration and refusal controls
        env:
          AI_STP_NATIVE_ENGINE_SOURCE: ${{ inputs.engine_source }}
          AI_STP_NATIVE_ENGINE_SOURCE_RUN: ${{ inputs.source_run_id }}
          AI_STP_REQUIRE_ENGINE: ${{ inputs.installed_engine && 'true' || 'false' }}
          AI_STP_NATIVE_ENGINE_ARCHIVES: ${{ steps.engine.outputs.download-path }}
          AI_STP_CODEX_MANIFEST: .github/codex-${{ runner.os }}.json
          AI_STP_CODEX_TOOLS: ${{ runner.temp }}/ai-stp-codex-distribution
          AI_STP_CODEX_PROOF: ${{ runner.temp }}/codex-loading-proof.json
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-vendor-codex
      - name: Read actual Grok configuration and refusal controls
        env:
          AI_STP_NATIVE_ENGINE_SOURCE: ${{ inputs.engine_source }}
          AI_STP_NATIVE_ENGINE_SOURCE_RUN: ${{ inputs.source_run_id }}
          AI_STP_REQUIRE_ENGINE: ${{ inputs.installed_engine && 'true' || 'false' }}
          AI_STP_NATIVE_ENGINE_ARCHIVES: ${{ steps.engine.outputs.download-path }}
          AI_STP_GROK_PROOF: ${{ runner.temp }}/grok-loading-proof.json
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-vendor-grok
      - name: Read actual Pi configuration and refusal controls
        env:
          AI_STP_NATIVE_ENGINE_SOURCE: ${{ inputs.engine_source }}
          AI_STP_NATIVE_ENGINE_SOURCE_RUN: ${{ inputs.source_run_id }}
          AI_STP_REQUIRE_ENGINE: ${{ inputs.installed_engine && 'true' || 'false' }}
          AI_STP_NATIVE_ENGINE_ARCHIVES: ${{ steps.engine.outputs.download-path }}
          AI_STP_PI_PROOF: ${{ runner.temp }}/pi-loading-proof.json
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-vendor-pi
      - name: Read Claude configuration and observe owned startup hooks
        env:
          AI_STP_NATIVE_ENGINE_SOURCE: ${{ inputs.engine_source }}
          AI_STP_NATIVE_ENGINE_SOURCE_RUN: ${{ inputs.source_run_id }}
          AI_STP_REQUIRE_ENGINE: ${{ inputs.installed_engine && 'true' || 'false' }}
          AI_STP_NATIVE_ENGINE_ARCHIVES: ${{ steps.engine.outputs.download-path }}
          AI_STP_CLAUDE_PROOF: ${{ runner.temp }}/claude-loading-proof.json
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-vendor-claude
      - name: Read OpenCode skills through an owned private server
        env:
          AI_STP_NATIVE_ENGINE_SOURCE: ${{ inputs.engine_source }}
          AI_STP_NATIVE_ENGINE_SOURCE_RUN: ${{ inputs.source_run_id }}
          AI_STP_REQUIRE_ENGINE: ${{ inputs.installed_engine && 'true' || 'false' }}
          AI_STP_NATIVE_ENGINE_ARCHIVES: ${{ steps.engine.outputs.download-path }}
          AI_STP_OPENCODE_PROOF: ${{ runner.temp }}/opencode-loading-proof.json
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-native-vendor-opencode
      - name: Retain content-free vendor discovery proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vendor-loading-${{ runner.os }}
          path: |
            ${{ runner.temp }}/codex-loading-proof.json
            ${{ runner.temp }}/grok-loading-proof.json
            ${{ runner.temp }}/pi-loading-proof.json
            ${{ runner.temp }}/claude-loading-proof.json
            ${{ runner.temp }}/opencode-loading-proof.json
          if-no-files-found: error
          retention-days: 7
