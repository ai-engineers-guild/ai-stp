# Desktop release: builds real OS bundles for the exact tag and publishes
# them to a GitHub Release. Mirrors release-candidate/publish-pypi: the run
# must sit on the tag it claims, the version inside tauri.conf.json must
# equal the tag, and every artifact is checksummed before upload.
#
# Tags use the `desktop-v*` namespace so desktop releases do not collide
# with `v*` CLI releases. Bundles are unsigned — signing needs a notarizing
# certificate that does not exist yet; the release notes say so plainly.
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version being released (digits, e.g. 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"
  UV_VERSION: "0.12.23"

jobs:
  guard:
    name: verify-tag-and-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The dispatch must run on the tag it claims to release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/desktop-v${EXPECTED_VERSION}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "desktop release requires ${expected_ref}, got ${GITHUB_REF}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: every desktop manifest must equal the tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for m in \
            apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json; do
            actual=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$m" | head -1)
            [[ "${actual}" == "${EXPECTED_VERSION}" ]] || {
              echo "${m} has ${actual}, tag wants ${EXPECTED_VERSION}" >&2
              exit 1
            }
          done
          for m in \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/core/Cargo.toml; do
            actual=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$m" | head -1)
            [[ "${actual}" == "${EXPECTED_VERSION}" ]] || {
              echo "${m} has ${actual}, tag wants ${EXPECTED_VERSION}" >&2
              exit 1
            }
          done

  bundle:
    name: bundle-${{ matrix.os }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux bundles need the glibc of the image that built them, so the leg
        # pins the image the shipped bundles were built and tested on rather
        # than `ubuntu-latest`, which moves to Ubuntu 26.04 from 2026-10-19.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned bun
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - name: Install WebKitGTK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Frontend install and checks
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun x tsc --noEmit
          bun x vitest run
          bun x vite build
      - name: Core crate tests
        working-directory: apps/desktop/core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Stub sidecar for shell-crate checks
        shell: bash
        # tauri-build's build.rs verifies resource paths exist at compile
        # time; the stub satisfies that before the real PyInstaller sidecar
        # is built below.
        run: bash apps/desktop/scripts/build-cli-sidecar.sh --stub
      - name: Shell crate tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Build the bundled CLI sidecar
        shell: bash
        run: bash apps/desktop/scripts/build-cli-sidecar.sh
      - name: Sidecar spawns under the app's filtered env
        shell: bash
        # CliRunner clears the child env and re-adds a passthrough set —
        # the same path the installed app takes. On Windows the frozen
        # CLI dies in its bootloader if TMP/TEMP/USERPROFILE are dropped.
        # The script is shared with `just desktop-regress`.
        run: bash apps/desktop/scripts/test-bundled-sidecar.sh
      - name: Tauri build
        working-directory: apps/desktop
        shell: bash
        run: bun x tauri build
      - name: Probe the packaged CLI resource tree
        shell: bash
        run: uv run --locked python apps/desktop/scripts/test-packaged-sidecar.py
      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-${{ inputs.version }}-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  release:
    name: publish-github-release
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-release-${{ inputs.version }}-*
          merge-multiple: true
          path: bundles
      - name: Flatten bundle directories and reject collisions
        working-directory: bundles
        run: |
          set -euo pipefail
          test -n "$(find . -mindepth 1 -type f -print -quit)" || {
            echo "no bundles produced" >&2; exit 1;
          }
          # Artifacts keep their per-format subdirs (deb/, dmg/, nsis/, ...).
          # Release assets are the files themselves, so flatten first and let
          # a duplicate basename fail loudly instead of silently overwriting.
          while IFS= read -r f; do
            base="$(basename "${f}")"
            if [[ -e "./${base}" ]]; then
              echo "bundle basename collision: ${base}" >&2; exit 1;
            fi
            mv "${f}" .
          done < <(find . -mindepth 2 -type f)
          find . -mindepth 1 -type d -empty -delete
      - name: Checksum everything
        working-directory: bundles
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        working-directory: bundles
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/NOTES.md" <<'NOTES'
          Desktop application over the ai-stp CLI (ADR-0222). The CLI is
          bundled inside the app as `ai-stp-desktop-cli` (PyInstaller
          directory via `bundle.resources`) — no separate install is
          needed; a configured path or PATH `ai-stp` still works in
          development.

          Upgrading from `ai-stp` 0.3.0? Uninstall it first — the product
          was renamed to `ai-stp-desktop`, so old installs do not
          auto-upgrade and both would coexist.

          Bundles are unsigned: macOS will ask to allow the app in
          Privacy & Security, Windows SmartScreen will warn, and Linux
          packages carry no signature. `SHA256SUMS` covers every artifact.

          - Linux: `.deb`, `.rpm`, `.AppImage`
          - macOS: `.dmg`
          - Windows: `.msi` / `-setup.exe`
          NOTES
          sed -i 's/^          //' "${RUNNER_TEMP}/NOTES.md"
          # No checkout in this job: name the repository explicitly, gh
          # cannot resolve it from a missing .git directory.
          gh release create "desktop-v${VERSION}" \
            --repo "${{ github.repository }}" --verify-tag \
            --title "ai-stp-desktop ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/NOTES.md" \
            -- *
