# Desktop release: the same three-OS owner builds and qualifies the exact
# published packages, including installed Linux journeys. The run
# must sit on the tag it claims, the version inside tauri.conf.json must
# equal the tag, and every artifact is checksummed before upload.
#
# Tags use the `desktop-v*` namespace so desktop releases do not collide
# with `cli-v*` CLI releases. Bundles are unsigned — signing needs a notarizing
# certificate that does not exist yet; the release notes say so plainly.
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version being released (digits, e.g. 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  guard:
    name: verify-tag-and-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: The dispatch must run on the tag it claims to release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/desktop-v${EXPECTED_VERSION}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "desktop release requires ${expected_ref}, got ${GITHUB_REF}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: every desktop manifest must equal the tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for m in \
            apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json; do
            actual=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$m" | head -1)
            [[ "${actual}" == "${EXPECTED_VERSION}" ]] || {
              echo "${m} has ${actual}, tag wants ${EXPECTED_VERSION}" >&2
              exit 1
            }
          done
          for m in \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/core/Cargo.toml; do
            actual=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$m" | head -1)
            [[ "${actual}" == "${EXPECTED_VERSION}" ]] || {
              echo "${m} has ${actual}, tag wants ${EXPECTED_VERSION}" >&2
              exit 1
            }
          done

      - name: Require the exact currently qualified main source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/require-client-release-source.sh

  bundle:
    needs: guard
    uses: ./.github/workflows/desktop.yml

  release:
    name: publish-github-release
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ai-stp-desktop-*
          merge-multiple: true
          path: bundles
      - name: Select only the six qualified install bundles and reject collisions
        run: |
          set -euo pipefail
          mkdir release
          while IFS= read -r -d '' file; do
            base="$(basename "${file}")"
            test ! -e "release/${base}"
            mv "${file}" "release/${base}"
          done < <(find bundles -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -print0)
          for extension in deb rpm AppImage dmg msi exe; do
            files=(release/*."${extension}")
            test "${#files[@]}" -eq 1 && test -f "${files[0]}"
          done
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 6
      - name: Checksum everything
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/NOTES.md" <<'NOTES'
          Desktop application over the native ai-stp CLI. The CLI is
          bundled inside the app as the optimized Rust `ai-stp-desktop-cli`
          with a digest manifest via `bundle.resources` — no separate install is
          needed; a configured path or PATH `ai-stp` still works in
          development.

          Includes offline personal contexts, independent account connections,
          explicit personal/corporate view switching, credential recovery,
          corporate checkout request/confirmation/reconciliation, local binding
          adoption and separately reviewed terminal binding retirement. Original
          receipts and tasks retain their original authority across view changes.
          Reviewed location anchors and explicit same-object checkout relocation
          preserve original adoption receipts and offline location history. The
          app never moves checkout files. After native identity recovery, review
          a fresh context through the existing sign-in before a new checkout change.
          Linux installed personal and corporate restart journeys run against
          these exact release bundles before publication; macOS and Windows run
          their native checks, resource probes and package builds.
          Harness executables remain user/vendor managed. Isolated setup
          installation is currently Linux-only; other platforms expose that
          limitation before starting. Existing Python state requires the
          explicit migration plan in Settings.

          The reviewed local registry upgrade writes schema61. Older clients
          that cannot read that schema refuse it; do not downgrade the registry
          or replace retained operations and receipts to roll back the app.

          Bundles are unsigned: macOS will ask to allow the app in
          Privacy & Security, Windows SmartScreen will warn, and Linux
          packages carry no signature. `SHA256SUMS` covers every artifact.

          - Linux: `.deb`, `.rpm`, `.AppImage`
          - macOS: `.dmg`
          - Windows: `.msi` / `-setup.exe`
          NOTES
          sed -i 's/^          //' "${RUNNER_TEMP}/NOTES.md"
          # No checkout in this job: name the repository explicitly, gh
          # cannot resolve it from a missing .git directory.
          gh release create "desktop-v${VERSION}" \
            --repo "${{ github.repository }}" --verify-tag \
            --title "ai-stp-desktop ${VERSION}" --latest=false \
            --notes-file "${RUNNER_TEMP}/NOTES.md" \
            -- *
