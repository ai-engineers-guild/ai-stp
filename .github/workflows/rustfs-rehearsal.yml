# Rehearses a RustFS upgrade on an owned volume before production takes it: the recipe starts the
# pinned current image from deploy/compose.prod.yml, writes through it, then the candidate on the
# same volume, and records the proof. A disposable GitHub-hosted runner gives it Docker; it needs
# no secret and makes its own credentials. Run it by hand with the candidate by digest.
name: rustfs-rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The RustFS image to qualify, rustfs/rustfs:<tag>@sha256:<digest>.
        required: true
        type: string

permissions: {}

env:
  PYTHON_VERSION: "3.15.2"
  UV_VERSION: "0.13.7"

jobs:
  rehearsal:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require an image by digest
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$CANDIDATE" =~ ^rustfs/rustfs:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::candidate must be rustfs/rustfs:<tag>@sha256:<digest>"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@1a409d4ee632eb594e58a6b291ce9e5a0ef51da2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
      - name: Prepare the Python environment
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@1a409d4ee632eb594e58a6b291ce9e5a0ef51da2
        with:
          recipe: setup-python
      - name: Rehearse the upgrade on an owned volume
        env:
          AI_STP_RUSTFS_CANDIDATE: ${{ inputs.candidate }}
          AI_STP_RUSTFS_PROOF: ${{ runner.temp }}/rustfs-upgrade-proof.json
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@1a409d4ee632eb594e58a6b291ce9e5a0ef51da2
        with:
          recipe: ci-rustfs-upgrade-rehearsal
      - name: Retain the rehearsal proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfs-upgrade-proof
          path: ${{ runner.temp }}/rustfs-upgrade-proof.json
          if-no-files-found: warn
          retention-days: 30
