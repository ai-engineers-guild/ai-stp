# Every expensive repository check runs on GitHub-hosted runners.
# The local commit hook is intentionally fast; this workflow is the required
# oracle for full docs, backend/BT regression, web, browser, and matrix suites.
#
# Split by what each job needs rather than by taste: only the test jobs need a
# database, only the web jobs need a browser, and the rest need neither. No job
# depends on another, so the run ends when the slowest one does rather than
# after their sum.
#
# The commands below are the recipe bodies of the local `justfile`, written out
# without it: `just` is a local convenience, not a CI dependency. The union of
# what these jobs run is checked mechanically against `just check` by
# tests/contract/test_gate_split_covers_the_gate.py, so a check cannot fall
# out of either side silently.
name: check

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.9"
  NODE_VERSION: "26.12.1"
  UV_VERSION: "0.13.5"
  BUN_VERSION: "1.4.4"

jobs:
  cli:
    name: cli-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold Windows build takes about 25 minutes before the consumer proof.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Prepare shared wire-contract validators
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-cli"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - name: Install shared wire-contract validators
        shell: bash
        run: >-
          uv sync --locked --package ai-stp-contracts
          --package ai-stp-sources --no-default-groups
      - name: Select an external native artifact directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/ai-stp-native-target" >> "${GITHUB_ENV}"
      - name: Install the pinned native CLI toolchain
        shell: bash
        run: >-
          bash .github/scripts/install-rust-toolchain.sh
          apps/cli/rust-toolchain.toml clippy rustfmt
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/ai-stp-native-target
          key: >-
            cli-shared-${{ runner.os }}-${{ hashFiles('apps/cli/Cargo.*',
            'apps/cli/*.toml', 'apps/cli/xtask/Cargo.*') }}
          # A package-version bump should retain reusable dependencies. Cargo
          # revalidates the restored build; every check below still runs.
          restore-keys: cli-shared-${{ runner.os }}-
      - name: Native boundary checks
        working-directory: apps/cli
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- resources --check
          cargo fmt --check
          cargo fmt --manifest-path xtask/Cargo.toml --check
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path xtask/Cargo.toml
          cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- build \
            cargo clippy --locked --all-targets -- -D warnings
          cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- build cargo test --locked
          cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- build \
            cargo build --locked --release --bins --examples
      - name: Install the isolated Linux credential fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            dbus-daemon gnome-keyring libglib2.0-bin
      - name: Actual Linux Secret Service enrollment and recovery
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/check-native-secret-service.sh
      - name: Existing consumers and real SQLite backup
        shell: bash
        run: |
          set -euo pipefail
          binary="$(
            cd apps/cli &&
              cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- cli-binary
          )"
          printf 'AI_STP_TEST_CLI_BINARY=%s\n' "$binary" >> "${GITHUB_ENV}"
          uv run --no-sync python tests/native_contract/verify.py "$binary"
      - name: Ownership and corporate journeys through the native HTTP client
        if: runner.os == 'Linux'
        shell: bash
        env:
          AI_STP_TEST_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@127.0.0.1:15432/ai_stp
        run: |
          set -euo pipefail
          docker run --detach --name ai-stp-native-ownership \
            -e POSTGRES_USER=ai_stp -e POSTGRES_PASSWORD=ai_stp_dev -e POSTGRES_DB=ai_stp \
            -p 127.0.0.1:15432:5432 \
            docker.io/library/postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          trap 'docker rm --force ai-stp-native-ownership >/dev/null' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            if docker exec ai-stp-native-ownership pg_isready -U ai_stp -d ai_stp; then
              break
            fi
            sleep 1
          done
          docker exec ai-stp-native-ownership pg_isready -U ai_stp -d ai_stp
          uv sync --locked
          uv run --locked python -m tests.native_contract.verify_ownership \
            "${AI_STP_TEST_CLI_BINARY}"
          uv run --locked python -m tests.native_contract.verify_corporate \
            "${AI_STP_TEST_CLI_BINARY}"
      - name: Cache the successful native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        # Cache availability must not prevent or invalidate the checks above.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/ai-stp-native-target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-docs-${{ hashFiles('docs_scripts/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-docs-
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-docs"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Prepare and check the documentation
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group docs --group dev
          # A subshell, not `cd … && … && cd ..`: when the install failed, the
          # trailing `cd ..` was skipped and every command after it ran from
          # `docs_scripts`, so the job's first real error was a confusing
          # `docs_scripts/docs_scripts/docs_lint.py`.
          (cd docs_scripts && bun install --frozen-lockfile)
          uv run --locked --group docs python docs_scripts/docs_lint.py
          uv run --locked --group docs python docs_scripts/contract_lint.py
          uv run --locked --group docs python docs_scripts/run_markdownlint.py
          uv run --locked --group docs python -m yamllint -c docs_scripts/.yamllint.yml .
          uv run --locked --group docs python -m unittest discover -s docs_scripts/tests -v
          uv run --locked --group docs python -m mkdocs build --strict -f docs_scripts/mkdocs.yml
          uv run --locked --group docs python -m mkdocs build --strict \
            -f docs_scripts/user-mkdocs.yml
          uv run --locked --group docs python docs_scripts/mermaid_check.py

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-package"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Static analysis, packaging and the install regression
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group docs --group dev
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pyright
          uv run --locked python -m ai_stp_contracts.schemas --check schemas/v1
          uv run --locked python -m ai_stp_contracts.inventory_record --check
          uv run --locked python -m ai_stp_contracts.web_projections --check
          uv run --locked python -m ai_stp_contracts.technology_seed --check
          uv run --locked python release_scripts/provider_kit.py --check provider-kit/v3
          uv run --locked python release_scripts/first_party_corpus_digests.py --check
          uv run --locked python release_scripts/safety_requirements.py --check
          uv run --locked python -m release_scripts.update_component_fixture --check
          uv run --locked --group docs python docs_scripts/skill_projections.py --check
          rm -rf dist
          uv build --all-packages --out-dir dist -q
          bash release_scripts/clean_install_regress.sh

  tests:
    name: tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per tree. PostgreSQL is on every shard so a missing
          # service cannot skip the rows that need it. Eight processes on
          # a 4-vCPU runner is deliberate: the suite waits on the database
          # and on subprocesses, not on cores (ADR-0116).
          - shard: api
            extra: tests/api
          - shard: integration
            extra: tests/integration
          - shard: scenario
            extra: tests/scenario
          - shard: unit-platform
            extra: tests/unit/platform
          - shard: unit-api
            extra: tests/unit/api
          - shard: unit
            extra: tests/unit --ignore=tests/unit/platform --ignore=tests/unit/api
          - shard: contract
            extra: tests/contract
          - shard: property
            extra: tests/property
    services:
      postgres:
        # GitHub-hosted runners are exempt from public Docker Hub pull limits.
        # Keep the exact production digest without ECR's anonymous data quota.
        image: >-
          docker.io/library/postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: ai_stp
          POSTGRES_PASSWORD: ai_stp_dev
          POSTGRES_DB: ai_stp
        options: >-
          --health-cmd "pg_isready -U ai_stp -d ai_stp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-tests-${{ matrix.shard }}"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      # Without a database the platform tests skip, so the URL is part of
      # the check rather than an optional extra. `-n 8 --dist=load`
      # oversubscribes the 4-vCPU runner on purpose (ADR-0116). Coverage
      # is combined after the shards and printed; it does not fail the
      # job on a percentage (ADR-0147).
      - name: Run a shard of the test suite
        env:
          AI_STP_TEST_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@127.0.0.1:5432/ai_stp
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          COVERAGE_CORE: sysmon
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group dev
          uv run --locked pytest -n 8 --dist=load \
            ${{ matrix.extra }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          # The file starts with a dot, and this action has excluded hidden
          # files by default since v4. Without this it uploads nothing and
          # `if-no-files-found: error` reports a missing file that the shard
          # did in fact write — the shard passes, the upload fails, and the
          # message points at the wrong half.
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-coverage"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine shard coverage and report
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          uv run --locked coverage combine \
            .coverage.api .coverage.integration .coverage.scenario \
            .coverage.unit-platform .coverage.unit-api .coverage.unit \
            .coverage.contract .coverage.property
          uv run --locked coverage report --precision=2

  # Lint, types, production build, audit and Storybook are Linux-only: they
  # do not read the host OS the way the test suites do. Unit, e2e and feature
  # profiles run on three operating systems (ADR-0116). Browser jobs pay for
  # Playwright; e2e stays one spec-set per OS because mock auth/profile/catalog
  # state is process-local (`fullyParallel: false`, playwright#30253).
  web-static:
    name: web-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Build, static-check, audit and Storybook
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          AI_STP_WEB_PROFILE=public_saas bun run build
          bun run i18n:check
          bun run lint
          bun run format:check
          bun run type-check
          bun run audit
          bun run build-storybook
      - name: Python dependency advisory scan
        run: bash scripts/safety/scan_lockfile.sh

  web-unit:
    name: web-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned uv for the real local API fixture
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          echo "UV_PYTHON=${python_path}" >> "${GITHUB_ENV}"
          echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-web-unit-${{ matrix.os }}" \
            >> "${GITHUB_ENV}"
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Prepare the local API runtime
        run: |
          set -euo pipefail
          uv sync --locked --group dev
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Unit and component tests
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          bun run test:coverage
          bun run test:coverage:catalog

  web-e2e:
    name: web-e2e (${{ matrix.os }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Ensure a Google Chrome is present
        run: bash .github/scripts/ensure-chrome.sh
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Build and run the browser scenarios
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          AI_STP_WEB_PROFILE=public_saas bun run build
          # Two shards, not four, and the difference was measured rather than
          # reasoned about. Four shards do split the suite correctly —
          # 46/44/46/44 whose union is exactly 180 — and bought nothing: the
          # slowest Windows shard ran 269s against 262s at two. The tests were
          # never the cost. Before one of them runs, the Windows leg spends
          # ~140s installing bun and restoring its cache and another ~120s
          # building Next.js, and splitting the list pays that fixed cost on
          # four runners instead of two. It also put six more jobs in a queue
          # that was already the binding constraint, and the run got slower.
          #
          # Serial execution is untouched — `fullyParallel: false` and one
          # worker still hold inside each shard, so the process-local mock
          # state the suite depends on is exactly as isolated as before.
          bun run test:e2e -- --shard=${{ matrix.shard }}/2
      # A failing browser scenario used to end here, leaving a line of console
      # output and nothing to diagnose it with: whether the biography never
      # reached the catalogue, reached it and did not render, or rendered after
      # the locator gave up are different defects with the same message. The
      # suite runs against in-process mocks with mock auth, so what is retained
      # is fixture content rather than anyone's data. Bounded on purpose.
      - name: Keep the diagnostics for a failed browser scenario
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-diagnostics-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/web/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  web-profiles:
