# Full source qualification runs once on Dev. Production consumes these bytes.
name: check

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      native_vault_rounds:
        description: Concurrent real Linux vault rounds (1-100)
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/source.yml
    with:
      native_vault_rounds: ${{ inputs.native_vault_rounds || '100' }}
  qualification:
    name: full-qualification
    if: always()
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require complete source and installed qualification
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "${RESULT}" = success
