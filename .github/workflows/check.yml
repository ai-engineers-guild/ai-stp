# Full source qualification runs once on Dev. Production consumes these bytes.
name: check

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      native_vault_rounds:
        description: Concurrent real Linux vault rounds (1-100)
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  verify:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/source.yml
    with:
      native_vault_rounds: ${{ inputs.native_vault_rounds || '100' }}
  qualification:
    name: full-qualification
    if: always()
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require complete source and installed qualification
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "${RESULT}" = success
