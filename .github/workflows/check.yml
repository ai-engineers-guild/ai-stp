# Every check this repository has, on GitHub-hosted runners.
#
# Split by what each job needs rather than by taste: only the test jobs need a
# database, only the web jobs need a browser, and the rest need neither. No job
# depends on another, so the run ends when the slowest one does rather than
# after their sum.
#
# The commands below are the recipe bodies of the local `justfile`, written out
# without it: `just` is a local convenience, not a CI dependency. The union of
# what these jobs run is checked mechanically against `just check` by
# tests/contract/test_gate_split_covers_the_gate.py, so a check cannot fall
# out of either side silently.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  UV_VERSION: "0.12.1"
  BUN_VERSION: "1.4.0"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-docs-${{ hashFiles('docs_scripts/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-docs-
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-docs"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Prepare and check the documentation
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group docs --group dev
          # A subshell, not `cd … && … && cd ..`: when the install failed, the
          # trailing `cd ..` was skipped and every command after it ran from
          # `docs_scripts`, so the job's first real error was a confusing
          # `docs_scripts/docs_scripts/docs_lint.py`.
          (cd docs_scripts && bun install --frozen-lockfile)
          uv run --locked --group docs python docs_scripts/docs_lint.py
          uv run --locked --group docs python docs_scripts/spec_lint.py
          uv run --locked --group docs python docs_scripts/contract_lint.py
          uv run --locked --group docs python docs_scripts/run_markdownlint.py
          uv run --locked --group docs python -m yamllint -c docs_scripts/.yamllint.yml .
          uv run --locked --group docs python -m unittest discover -s docs_scripts/tests -v
          uv run --locked --group docs python -m mkdocs build --strict -f docs_scripts/mkdocs.yml
          uv run --locked --group docs python -m mkdocs build --strict \
            -f docs_scripts/user-mkdocs.yml
          uv run --locked --group docs python docs_scripts/mermaid_check.py

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-package"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Static analysis, packaging and the install regression
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group docs --group dev
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pyright
          uv run --locked python -m release_scripts.public_export --report
          uv run --locked python -m ai_stp_contracts.schemas --check schemas/v1
          uv run --locked python -m ai_stp_contracts.web_projections --check
          uv run --locked python release_scripts/provider_kit.py --check provider-kit/v3
          uv run --locked --group docs python docs_scripts/skill_projections.py --check
          rm -rf dist
          uv build --all-packages --out-dir dist -q
          bash release_scripts/clean_install_regress.sh

  tests:
    name: tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per tree. PostgreSQL is on every shard so a missing
          # service cannot skip the rows that need it and drop combined
          # coverage under the threshold. Eight processes on a 4-vCPU
          # runner is deliberate: the suite waits on the database and on
          # subprocesses, not on cores (ADR-0116).
          - shard: api
            extra: tests/api
          - shard: integration
            extra: tests/integration
          - shard: scenario
            extra: tests/scenario
          - shard: unit-platform
            extra: tests/unit/platform
          - shard: unit-api
            extra: tests/unit/api
          - shard: unit
            extra: tests/unit --ignore=tests/unit/platform --ignore=tests/unit/api
          # `tests/contract` is three jobs because one file holds most of it.
          # Measured with eight processes: `test_cli_process.py` alone is 107s,
          # `test_offline_closure.py` with `test_installation_restart.py` is
          # 65s, and everything else together is 23s. Left whole the shard runs
          # for as long as the sum, and it was the second-longest job in the
          # gate.
          - shard: contract-process
            extra: tests/contract/test_cli_process.py
          - shard: contract-lifecycle
            extra: >-
              tests/contract/test_offline_closure.py
              tests/contract/test_installation_restart.py
          - shard: contract
            extra: >-
              tests/contract
              --ignore=tests/contract/test_cli_process.py
              --ignore=tests/contract/test_offline_closure.py
              --ignore=tests/contract/test_installation_restart.py
          - shard: property
            extra: tests/property
    services:
      postgres:
        # Pinned like every other base in this tree: a republished tag changes
        # what CI ran against and records nothing that it did.
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: ai_stp
          POSTGRES_PASSWORD: ai_stp_dev
          POSTGRES_DB: ai_stp
        options: >-
          --health-cmd "pg_isready -U ai_stp -d ai_stp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-tests-${{ matrix.shard }}"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      # Without a database the platform tests skip and combined coverage falls
      # under its threshold, so the URL is part of the check rather than an
      # optional extra. `-n 8 --dist=load` oversubscribes the 4-vCPU runner
      # on purpose (ADR-0116). Each shard disables the per-run threshold:
      # 90% is a property of the union and is checked after `coverage combine`.
      - name: Run a shard of the test suite
        env:
          AI_STP_TEST_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@127.0.0.1:5432/ai_stp
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          COVERAGE_CORE: sysmon
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group dev
          uv run --locked pytest -n 8 --dist=load --cov-fail-under=0 \
            ${{ matrix.extra }}
          if [ "${{ matrix.shard }}" = "contract" ]; then
            uv run --locked pytest --no-cov -q \
              -W error::ResourceWarning \
              -W error::pytest.PytestUnraisableExceptionWarning \
              tests/contract/test_cli_resource_lifecycle.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          # The file starts with a dot, and this action has excluded hidden
          # files by default since v4. Without this it uploads nothing and
          # `if-no-files-found: error` reports a missing file that the shard
          # did in fact write — the shard passes, the upload fails, and the
          # message points at the wrong half.
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-coverage"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine shard coverage and enforce the threshold
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          uv run --locked coverage combine \
            .coverage.api .coverage.integration .coverage.scenario \
            .coverage.unit-platform .coverage.unit-api .coverage.unit \
            .coverage.contract-process .coverage.contract-lifecycle \
            .coverage.contract .coverage.property
          uv run --locked coverage report --precision=2 --fail-under=90

  # Lint, types, production build, audit and Storybook are Linux-only: they
  # do not read the host OS the way the test suites do. Unit, e2e and feature
  # profiles run on three operating systems (ADR-0116). Browser jobs pay for
  # Playwright; e2e stays one spec-set per OS because mock auth/profile/catalog
  # state is process-local (`fullyParallel: false`, playwright#30253).
  web-static:
    name: web-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Build, static-check, audit and Storybook
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          AI_STP_WEB_PROFILE=public_saas bun run build
          bun run i18n:check
          bun run lint
          bun run format:check
          bun run type-check
          bun run audit
          bun run build-storybook

  web-unit:
    name: web-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Unit and component tests
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          bun run test:coverage
          bun run test:coverage:catalog

  web-e2e:
    name: web-e2e (${{ matrix.os }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Ensure a Google Chrome is present
        run: bash .github/scripts/ensure-chrome.sh
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Build and run the browser scenarios
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          AI_STP_WEB_PROFILE=public_saas bun run build
          # Two shards, not four, and the difference was measured rather than
          # reasoned about. Four shards do split the suite correctly —
          # 46/44/46/44 whose union is exactly 180 — and bought nothing: the
          # slowest Windows shard ran 269s against 262s at two. The tests were
          # never the cost. Before one of them runs, the Windows leg spends
          # ~140s installing bun and restoring its cache and another ~120s
          # building Next.js, and splitting the list pays that fixed cost on
          # four runners instead of two. It also put six more jobs in a queue
          # that was already the binding constraint, and the run got slower.
          #
          # Serial execution is untouched — `fullyParallel: false` and one
          # worker still hold inside each shard, so the process-local mock
          # state the suite depends on is exactly as isolated as before.
          bun run test:e2e -- --shard=${{ matrix.shard }}/2

  web-profiles:
    name: web-profiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned bun
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      # Kept on Windows despite costing 85s to restore there — measured
      # against the alternative rather than assumed. Without it `bun install`
      # downloads the whole store inside the build step, and that step went
      # from 121s to 222s: the restore is 85s and buys 101s.
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Ensure a Google Chrome is present
        run: bash .github/scripts/ensure-chrome.sh
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/web/.next/cache
          # Source in the key so a changed page rebuilds, lockfile so a changed
          # dependency does; the restore-key keeps the previous cache useful
          # when only one file moved, which is the common case.
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-${{
            hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-next-
      - name: Feature profile builds
        run: |
          set -euo pipefail
          cd apps/web
          bun install --frozen-lockfile
          bun run test:feature-profiles

  cli:
    name: cli-${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Measured rather than guessed. The macOS leg reached 78% of this selection
    # in thirty minutes and was cut off mid-run — no failure, no hang, simply a
    # slower machine than the Linux one that finishes the same work in seven.
    # The distribution below should bring it well under this, and the ceiling is
    # what stops a genuine hang from occupying a runner for an hour.
    timeout-minutes: 45
    # The helper above is a bash script, and the Windows runner defaults to
    # PowerShell. Bash is present on all three images.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Process tests spawn real CLI subprocesses and dominated the macOS
        # contract tail. They get their own runner; the rest of contract and
        # the unit tree keep theirs (ADR-0116).
        suite: [unit, contract, process]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Isolate this job's Python environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          {
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/cli-${{ matrix.os }}-${{ matrix.suite }}"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      # `uv sync` resolves and downloads the same locked dependencies on every
      # job of every run. Keyed by the lock, so a hit is exact and a change to
      # the lock misses on purpose.
      #
      # The path is `UV_CACHE_DIR` and not `~/.cache/uv`, which is where uv
      # puts its cache on Linux alone: Windows uses `%LOCALAPPDATA%\uv\cache`,
      # so the cached path did not exist there and `actions/cache` skipped the
      # save with a warning nobody read. Every Windows job had been resolving
      # and downloading the whole dependency set from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install pinned uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      # The database-backed platform tests and the wheel regression are Linux
      # jobs above. What runs here is the part that has to behave identically on
      # three operating systems: discovery, passports, selection and the CLI
      # surface, which read a real filesystem and resolve real executables.
      # The pytest flags are the contract of this leg: `-vv` because addopts
      # already carries `-q` and a single `-v` cancels out; `faulthandler_timeout`
      # names the hanging test instead of ending mid-line, which is how three
      # CI runs died on their own timeout without saying why.
      - name: Run the cross-platform surface
        run: |
          set -euo pipefail
          source .github/scripts/provider-safe-path.sh
          ai_stp_use_provider_safe_path
          uv sync --locked --group dev
          case "${{ matrix.suite }}" in
            unit) extra="tests/unit --ignore=tests/unit/platform --ignore=tests/unit/api" ;;
            contract) extra="tests/contract --ignore=tests/contract/test_cli_process.py" ;;
            process) extra="tests/contract/test_cli_process.py" ;;
            *) echo "unknown suite ${{ matrix.suite }}" >&2; exit 1 ;;
          esac
          # shellcheck disable=SC2086
          # `--durations` because this leg is 245s on Windows against 47s on
          # macOS for the same selection, and nothing in the log says where it
          # goes. A list of the slowest tests separates "a few tests are slow
          # on this filesystem" from "eight xdist workers cost more to start
          # than the suite costs to run", which need opposite fixes.
          uv run --locked pytest -n 8 --dist=load --no-cov -vv \
            -o faulthandler_timeout=300 --durations=15 \
            ${extra}
