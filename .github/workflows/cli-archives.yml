name: cli-archives

on:
  workflow_call:
    inputs:
      version:
        description: Exact tagged release version; empty for source qualification
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cli-archives-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  build:
    name: archive-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            binary: ai-stp
            extension: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            binary: ai-stp
            extension: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: ai-stp.exe
            extension: zip
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Dispatch must name its exact release tag
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/tags/cli-v${EXPECTED_VERSION}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/project-rust
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          python-version: '3.15.2'
          uv-version: '0.13.7'
      - name: Bind version and prepare wire-contract validators
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- version)
          if [[ -n "${EXPECTED_VERSION}" ]]; then
            test "${GITHUB_EVENT_NAME}" = workflow_dispatch
            test "${version}" = "${EXPECTED_VERSION}"
            git merge-base --is-ancestor HEAD origin/main
          fi
          python_path=$(python -c 'import sys; print(sys.executable)')
          {
            echo "RELEASE_VERSION=${version}"
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-rust-release-contracts"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - name: Install shared wire-contract validators
        shell: bash
        run: >-
          uv sync --locked --package ai-stp-contracts
          --package ai-stp-sources --no-default-groups
      # Build from source: cached build scripts can retain another image's SDK paths.
      - name: Build the native executable
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-build-build-the-native-executable
      - name: Package and verify the extracted executable outside checkout
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-build-package-and-verify-the-extracted-executable-outside-checkout
      - name: Package and qualify the native wheel
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
          UV_TOOL_DIR: ${{ runner.temp }}/native-wheel-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/native-wheel-bin
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-build-package-and-qualify-the-native-wheel
      - name: Qualify the standalone Cargo source package
        if: runner.os == 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9fead1382c452a6b791a0a9e464ac6ac66537ac3
        with:
          recipe: ci-build-qualify-the-standalone-cargo-source-package
      - name: Seal the qualified native payload without rebuilding
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          python -m release_scripts.cli_artifacts seal --directory release
          --source "${GITHUB_SHA}" --version "${RELEASE_VERSION}" --target "${RELEASE_TARGET}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-stp-rust-${{ matrix.target }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
