name: cli-archives

on:
  workflow_call:
    inputs:
      version:
        description: Exact tagged release version; empty for source qualification
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cli-archives-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: archive-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: ai-stp
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: ai-stp
            extension: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: ai-stp.exe
            extension: zip
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Dispatch must name its exact release tag
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/tags/cli-v${EXPECTED_VERSION}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the native CLI toolchain
        shell: bash
        run: bash .github/scripts/install-rust-toolchain.sh apps/cli/rust-toolchain.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.9"
      - name: Bind version and prepare wire-contract validators
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- version)
          if [[ -n "${EXPECTED_VERSION}" ]]; then
            test "${GITHUB_EVENT_NAME}" = workflow_dispatch
            test "${version}" = "${EXPECTED_VERSION}"
            git merge-base --is-ancestor HEAD origin/main
          fi
          python_path=$(python -c 'import sys; print(sys.executable)')
          {
            echo "RELEASE_VERSION=${version}"
            echo "UV_PYTHON=${python_path}"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-rust-release-contracts"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
          bash .github/scripts/install-uv.sh "0.13.5" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Install shared wire-contract validators
        shell: bash
        run: >-
          uv sync --locked --package ai-stp-contracts
          --package ai-stp-sources --no-default-groups
      # Build from source: cached build scripts can retain another image's SDK paths.
      - name: Build the native executable
        working-directory: apps/cli
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- cli-binary)"
          printf 'CLI_SOURCE_BINARY=%s\n' "$binary" >> "${GITHUB_ENV}"
      - name: Package and verify the extracted executable outside checkout
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- package \
            --binary "${CLI_SOURCE_BINARY}" \
            --target "${RELEASE_TARGET}" --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" --output release
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- package \
            --binary "${CLI_SOURCE_BINARY}" \
            --target "${RELEASE_TARGET}" --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" --output release-repeat
          stem="ai-stp-cli-${RELEASE_VERSION}-${RELEASE_TARGET}"
          cmp "release/${stem}.${RELEASE_EXTENSION}" "release-repeat/${stem}.${RELEASE_EXTENSION}"
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- verify \
            --archive "release/${stem}.${RELEASE_EXTENSION}" \
            --target "${RELEASE_TARGET}" --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" --install-directory "${RUNNER_TEMP}/ai-stp-rust-install"
          uv run --no-sync python tests/native_contract/verify.py \
            "${RUNNER_TEMP}/ai-stp-rust-install/${RELEASE_BINARY}"
      - name: Package and qualify the native wheel
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
          UV_TOOL_DIR: ${{ runner.temp }}/native-wheel-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/native-wheel-bin
        run: |
          set -euo pipefail
          stem="ai-stp-cli-${RELEASE_VERSION}-${RELEASE_TARGET}"
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- wheel \
            --archive "release/${stem}.${RELEASE_EXTENSION}" \
            --target "${RELEASE_TARGET}" --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" --output wheels
          wheel=$(find wheels -maxdepth 1 -name '*.whl' -type f)
          test -n "${wheel}"
          uv tool install --no-index "${wheel}"
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- probe \
            --binary "${UV_TOOL_BIN_DIR}/${RELEASE_BINARY}" --version "${RELEASE_VERSION}"
          python -m venv "${RUNNER_TEMP}/pip-native"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            pip_python="${RUNNER_TEMP}/pip-native/Scripts/python.exe"
            pip_binary="${RUNNER_TEMP}/pip-native/Scripts/${RELEASE_BINARY}"
          else
            pip_python="${RUNNER_TEMP}/pip-native/bin/python"
            pip_binary="${RUNNER_TEMP}/pip-native/bin/${RELEASE_BINARY}"
          fi
          "${pip_python}" -m pip install --no-index --no-deps "${wheel}"
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- probe \
            --binary "${pip_binary}" --version "${RELEASE_VERSION}"
          cp "${wheel}" release/
          (cd release && sha256sum -- *.whl > "$(basename "${wheel}").sha256")
      - name: Qualify the standalone Cargo source package
        if: runner.os == 'Linux'
        working-directory: apps/cli
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- resources --check
          cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- \
            build cargo package --locked
          cp "target/package/ai-stp-cli-${RELEASE_VERSION}.crate" ../../release/
          cd ../../release
          sha256sum -- *.crate > "ai-stp-cli-${RELEASE_VERSION}.crate.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-stp-rust-${{ matrix.target }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
