# Manual consumer-path evidence for the **configuration** lifecycle, on every
# supported native OS/architecture pair.
#
# `software-evidence` beside it proves the program lifecycle — `harness
# install/status/update/remove`. This one proves the other subject entirely, and
# the one the product exists for: a machine's own native surface taken into
# management and put back.
#
#     seed a native surface  ->  component adopt  ->  component version release
#     ->  select propose     ->  select confirm   ->  install plan
#     ->  install approve    ->  install apply    ->  target status/backups
#     ->  install plan --action remove -> approve -> apply
#     ->  the native path is gone again
#
# Until this workflow existed that arc was measured by hand, on linux/x86_64
# alone, while the release target is three operating systems on two
# architectures. One row per harness, typed outcomes, a missing row is an error.
# Not part of `check`: the repository gate must not depend on another party's
# release network.
name: config-evidence

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact provider release tag to drive (for example 0.0.50)"
        required: true
        type: string
      harness:
        description: "One harness id to drive alone (empty means all seven)"
        required: false
        default: ""
        type: string
      from_import:
        description: "Capture through setup import of the whole root instead of component adopt"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: config-evidence
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.1"

jobs:
  consume:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: macos-x86_64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    env:
      AI_STP_FORCE_FILE_CREDENTIAL_STORE: "1"
      GH_TOKEN: ${{ github.token }}
      PROVIDER_TAG: ${{ inputs.tag }}
      PROVIDER_HARNESS: ${{ inputs.harness }}
      PROVIDER_FROM_IMPORT: ${{ inputs.from_import }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install pinned native uv
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Isolate the exact Python job environment
        run: |
          set -euo pipefail
          python_path="$(python -c 'import sys; print(sys.executable)')"
          test -n "${python_path}"
          echo "UV_PYTHON=${python_path}" >> "${GITHUB_ENV}"
          echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/config-${{ matrix.id }}" \
            >> "${GITHUB_ENV}"
      - name: Install the isolation the product requires on Linux
        # The configuration apply path runs the provider through
        # `network_launcher`, which is Bubblewrap on Linux, and a hosted runner
        # does not ship it. Without it the first six-leg run answered
        # `AI_STP_DEPENDENCY_UNAVAILABLE` at `install plan` on both Linux legs —
        # the product refusing correctly, and the evidence proving nothing.
        # `software-evidence` beside this one does not need it, which is why the
        # gap only appeared when the configuration path was measured.
        if: startsWith(matrix.id, 'linux')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, and Bubblewrap needs one to unshare the network. Present
          # but unable to isolate is the state the first run reported as
          # `network_enforcement: unavailable` with `bwrap` installed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-net --dev-bind / / true && echo "unshare-net works"
      - name: Install the consumer and nothing else
        # The slice drives `ai-stp` the way a user's machine does, and a user's
        # machine holds no server. A workspace-wide sync would also demand a
        # cryptography build on windows/arm64, where the locked version ships
        # no wheel — a fact about the server's dependencies, not this slice's.
        run: |
          set -euo pipefail
          uv sync --locked --package ai-stp-cli
      - name: Drive every released provider through the configuration path
        run: |
          set -euo pipefail
          mkdir -p evidence
          arguments=(--tag "${PROVIDER_TAG}")
          if [ -n "${PROVIDER_HARNESS}" ]; then
            arguments+=(--harness "${PROVIDER_HARNESS}")
          fi
          if [ "${PROVIDER_FROM_IMPORT}" = "true" ]; then
            arguments+=(--from-import)
          fi
          uv run --locked --package ai-stp-cli \
            python -m release_scripts.verify_config_slice "${arguments[@]}" \
            | tee "evidence/config-${{ matrix.id }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: config-${{ matrix.id }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
