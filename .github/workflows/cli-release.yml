# Attest the exact qualified Dev archives; publication never rebuilds source.
name: cli-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable Rust version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Dispatch must name its exact release tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "${GITHUB_REF}" = "refs/tags/cli-v${EXPECTED_VERSION}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          python-version: '3.15.2'
      - name: Require the exact currently qualified Main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/require-client-release-source.sh

      - name: Download the exact qualified native archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.qualified_run_id }}
          pattern: ai-stp-rust-*-${{ github.sha }}
          path: qualified
          merge-multiple: true
          digest-mismatch: error
      - name: Verify all native archive bytes without running them
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: >-
          python -m release_scripts.cli_artifacts verify --directory qualified
          --source "${GITHUB_SHA}" --version "${EXPECTED_VERSION}"
          --output "${RUNNER_TEMP}/verified-cli-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-cli-release
          path: ${{ runner.temp }}/verified-cli-release/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest-release-archives
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout or repository code executes on the OIDC-bearing runner.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualified-cli-release
          path: release
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*
