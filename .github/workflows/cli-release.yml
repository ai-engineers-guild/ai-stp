# Attest the exact qualified Dev archives; publication never rebuilds source.
name: cli-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable Rust version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # No tool reports usage to its maker (the switches of nddev-ci's telemetry action).
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BUN_DO_NOT_TRACK: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DISABLE_TELEMETRY: '1'
  SEMGREP_SEND_METRICS: 'off'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      qualified_run_id: ${{ steps.source.outputs.qualified_run_id }}
    steps:
      - name: Dispatch must name its exact release tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "${GITHUB_REF}" = "refs/tags/cli-v${EXPECTED_VERSION}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@1a409d4ee632eb594e58a6b291ce9e5a0ef51da2
        with:
          python-version: '3.15.2'
      - name: Require the exact currently qualified Main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/require-client-release-source.sh

      - name: Download the exact qualified native archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.qualified_run_id }}
          pattern: ai-stp-rust-*-${{ github.sha }}
          path: qualified
          merge-multiple: true
          digest-mismatch: error
      - name: Verify all native archive bytes without running them
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: >-
          python -m release_scripts.cli_artifacts verify --directory qualified
          --source "${GITHUB_SHA}" --version "${EXPECTED_VERSION}"
          --output "${RUNNER_TEMP}/verified-cli-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-cli-release
          path: ${{ runner.temp }}/verified-cli-release/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest-release-archives
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout or repository code executes on the OIDC-bearing runner.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualified-cli-release
          path: release
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*


  release:
    needs: [guard, attest]
    permissions:
      contents: write
    uses: ./.github/workflows/client-publication.yml
    with:
      kind: cli
      version: ${{ inputs.version }}
      source_run_id: ${{ needs.guard.outputs.qualified_run_id }}


  registries:
    name: publish-registries-and-reconcile
    needs: [guard, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      # Keep the existing standalone Trusted Publisher workflow identities.
      # No checkout, repository program or OIDC token executes here.
      - name: Publish registries before reconciling the qualified deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ needs.guard.outputs.qualified_run_id }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ && "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          tag="cli-v${VERSION}"
          test "${GITHUB_REF}" = "refs/tags/${tag}"
          require_current() {
            for branch in dev main; do
              current="$(gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
              test "${current}" = "${SOURCE_SHA}"
            done
          }
          require_current
          runs=()
          for workflow in publish-pypi.yml publish-crates.yml; do
            response="$(jq -n --arg tag "${tag}" --arg version "${VERSION}" \
              '{ref: $tag, inputs: {version: $version}}' |
              gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${REPOSITORY}/actions/workflows/${workflow}/dispatches" --input -)"
            id="$(jq -er '.workflow_run_id' <<< "${response}")"
            [[ "${id}" =~ ^[1-9][0-9]*$ ]]
            runs+=("${id}:${workflow}")
            printf 'Registry publication %s: run %s\n' "${workflow}" "${id}"
          done
          deadline=$((SECONDS + 3000))
          for item in "${runs[@]}"; do
            id="${item%%:*}"
            workflow="${item#*:}"
            while :; do
              run="$(gh api "repos/${REPOSITORY}/actions/runs/${id}")"
              jq -e --arg repo "${REPOSITORY}" --arg sha "${SOURCE_SHA}" \
                --arg tag "${tag}" --arg path ".github/workflows/${workflow}" --argjson id "${id}" '
                .id == $id and .head_sha == $sha and .head_branch == $tag and
                .path == $path and .event == "workflow_dispatch" and
                .repository.full_name == $repo and .head_repository.full_name == $repo
              ' <<< "${run}" >/dev/null
              if [[ "$(jq -r .status <<< "${run}")" = completed ]]; then
                jq -e '.conclusion == "success"' <<< "${run}" >/dev/null
                break
              fi
              test "${SECONDS}" -lt "${deadline}"
              sleep 10
            done
          done
          require_current
          jq -n --arg run "${SOURCE_RUN_ID}" '{ref: "dev", inputs: {source_run_id: $run}}' |
            gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPOSITORY}/actions/workflows/deploy.yml/dispatches" --input - |
            jq -e '.workflow_run_id | type == "number" and . > 0' >/dev/null
