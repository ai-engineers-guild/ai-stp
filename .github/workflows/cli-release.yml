# Release-only authority stays outside the reusable source archive checks.
name: cli-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable Rust version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the exact currently qualified main source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/require-client-release-source.sh

  build:
    needs: guard
    uses: ./.github/workflows/cli-archives.yml
    with:
      version: ${{ inputs.version }}

  attest:
    name: attest-release-archives
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout or repository code executes on the OIDC-bearing runner.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ai-stp-rust-*-${{ github.sha }}
          path: release
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*
