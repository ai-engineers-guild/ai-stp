# Desktop application CI: the Tauri shell over apps/desktop on all three
# target OSes. Style follows check.yml — pinned action SHAs, pinned tool
# versions, no job depends on another.
#
# The core crate tests run everywhere; the full `tauri build` produces the
# per-OS bundles (.deb/.rpm/.AppImage, .dmg, .msi/.nsis) so cross-platform
# breakage is caught here rather than on a maintainer's machine.
name: desktop

on:
  push:
    branches: [dev, main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.4.2"
  UV_VERSION: "0.12.19"

jobs:
  desktop:
    name: desktop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned bun
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - name: Install WebKitGTK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Frontend install
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Frontend checks (tsc, vitest, vite build)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun x tsc --noEmit
          bun x vitest run
          bun x vite build
      - name: Core crate tests
        working-directory: apps/desktop/core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-uv.sh "${UV_VERSION}" "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Build the bundled CLI sidecar
        shell: bash
        run: bash apps/desktop/scripts/build-cli-sidecar.sh
      - name: Tauri build
        working-directory: apps/desktop
        shell: bash
        run: bun x tauri build
      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aistp-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn
