# Desktop application CI: the Tauri shell over apps/desktop on all three
# target OSes. Style follows check.yml — pinned action SHAs, pinned tool
# versions. check.yml owns source-event admission and joins this result.
#
# The core crate tests run everywhere; the full `tauri build` produces the
# per-OS bundles (.deb/.rpm/.AppImage, .dmg, .msi/.nsis) so cross-platform
# breakage is caught here rather than on a maintainer's machine.
name: desktop

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      packages_only:
        description: Build diagnostic packages without application acceptance or release permission
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "26.13.0"

jobs:
  desktop:
    name: desktop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux bundles use the selected Ubuntu 26.04/glibc baseline. Native
        # installed acceptance must use these exact packaged bytes.
        os: [ubuntu-26.04, macos-15, windows-2025]
    steps:
      - name: Confine package-only diagnosis to its explicit manual workflow
        if: inputs.packages_only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_WORKFLOW}" = desktop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared hosted SDKs
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          python-version: '3.15.2'
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/project-rust
        with:
          components: clippy,rustfmt
      - name: Prepare the exact native test runner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          manifest: .github/nextest-${{ runner.os }}.json
          directory: ${{ runner.temp }}/ai-stp-native-test-tools
      - name: Expose this job's prepared native test runner
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: ci-native-test-tools
      - name: Refresh the Linux package index
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get update
      - name: Install WebKitGTK dependencies (Linux)
        if: runner.os == 'Linux'
        # A measured cold Azure mirror transfer took 28 min for 69.4 MB. Keep
        # a finite budget above that observation; do not label it a hang.
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf dbus-daemon gnome-keyring libglib2.0-bin \
            webkitgtk-webdriver xvfb xauth
      - name: Restore and retain only successful Dev's desktop dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        timeout-minutes: 5
        with:
          prefix-key: desktop-deps-v1
          shared-key: ${{ matrix.os }}
          workspaces: |
            apps/cli
            apps/cli/xtask
            apps/desktop/core
            apps/desktop/src-tauri
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      - name: Frontend install
        working-directory: apps/desktop
        run: |
          python ../../release_scripts/desktop_version.py --check
          python ../../release_scripts/desktop_tools.py
          bun install --frozen-lockfile
      - name: Qualify Desktop through the shared project commands
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: desktop-check
      - name: Prepare the exact Linux packaging tools
        if: runner.os == 'Linux'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          manifest: .github/tauri-tools.json
          directory: ${{ runner.temp }}/ai-stp-tauri-cache/tauri
      - name: Prepare the exact Windows packaging assets
        if: runner.os == 'Windows'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          manifest: .github/tauri-tools-windows.json
          directory: ${{ runner.temp }}/ai-stp-tauri-windows
      - name: Prepare the SDK's native Windows tool layout
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python release_scripts/desktop_tools.py
          --prepare-windows "${RUNNER_TEMP}/ai-stp-tauri-windows"
      - name: Tauri build
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/ai-stp-tauri-cache
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: ci-desktop-tauri-build
      - name: Verify the macOS disk image
        if: runner.os == 'macOS'
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: ci-desktop-verify-the-macos-disk-image
      - name: Probe the packaged CLI resource tree
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: ci-desktop-probe-the-packaged-cli-resource-tree
      - name: Retain built Linux bytes before installed diagnosis
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-build-linux
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Install the release package on the disposable Linux runner
        if: runner.os == 'Linux' && !inputs.packages_only
        shell: bash
        run: |
          set -euo pipefail
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1 && test -f "${packages[0]}"
          sudo dpkg --install "${packages[0]}"
          test -x /usr/bin/ai-stp-desktop
      - name: Install the pinned external WebDriver in disposable CI state
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ai-stp-webdriver-target
        run: >-
          cargo install tauri-driver --version 2.1.0 --locked
          --root "${RUNNER_TEMP}/ai-stp-webdriver"
      - name: Three installed Linux Desktop journeys with bundled CLI and native vault
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: >-
            ci-desktop-three-installed-linux-desktop-journeys-with-bundled-cli-and-native-vault
      - name: Prepare uv for the Linux corporate API fixture
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          uv-version: '0.13.7'
      - name: Isolate the corporate API fixture on Linux
        if: runner.os == 'Linux' && !inputs.packages_only
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "UV_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-installed-corporate"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
      - name: Installed corporate onboarding, lost reply and original binding recovery
        if: runner.os == 'Linux' && !inputs.packages_only
        env:
          AI_STP_TEST_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@127.0.0.1:15434/ai_stp
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: ci-desktop-installed-corporate-onboarding-lost-reply-and-original-binding-recovery
      - name: Retain the public installed corporate checkout result
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-linux-corporate-checkout-proof
          path: ${{ runner.temp }}/installed-corporate-desktop-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain public installed Desktop results
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-linux-desktop-proof
          path: ${{ runner.temp }}/installed-desktop-proof-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare the exact installed performance baseline
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          manifest: .github/desktop-performance-baseline.json
          directory: ${{ runner.temp }}/desktop-performance-baseline
      - name: Compare installed startup and repeated navigation on the same worker
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: desktop-performance
      - name: Retain the exact same-worker performance observations
        if: runner.os == 'Linux' && !inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-linux-desktop-performance
          path: ${{ runner.temp }}/installed-desktop-performance.json
          if-no-files-found: error
          retention-days: 7
      - name: Seal the exact platform installers
        if: ${{ !inputs.packages_only }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM: ${{ runner.os }}
        run: >-
          python -m release_scripts.desktop_artifacts seal
          --directory apps/desktop/src-tauri/target/release/bundle
          --source "${SOURCE_SHA}" --platform "${PLATFORM}"
      - name: Qualify personal workspace on installed macOS and Windows
        if: (runner.os == 'macOS' || runner.os == 'Windows') && !inputs.packages_only
        timeout-minutes: 8
        uses: >-
          NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@ca07bd07d12c91f103ce481372100cab6c83d72f
        with:
          recipe: ci-desktop-installed-personal-workspace
      - name: Retain installed macOS and Windows personal results
        if: (runner.os == 'macOS' || runner.os == 'Windows') && !inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-personal-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/installed-personal-desktop.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-stp-desktop-${{ inputs.packages_only && 'preflight-' || '' }}${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
      - name: Prepare the existing native drivers for Linux diagnosis
        if: runner.os == 'Linux' && inputs.packages_only
        shell: bash
        run: |
          set -euo pipefail
          drivers="${RUNNER_TEMP}/native-desktop-drivers"
          mkdir "${drivers}"
          install -m 755 "${RUNNER_TEMP}/ai-stp-webdriver/bin/tauri-driver" \
            "${drivers}/tauri-driver"
          install -m 755 /usr/bin/WebKitWebDriver "${drivers}/WebKitWebDriver"
          cp /usr/share/doc/webkitgtk-webdriver/copyright \
            "${drivers}/WebKitWebDriver.COPYRIGHT"
          dpkg-query --show webkitgtk-webdriver > "${drivers}/webkit-version.txt"
          cd "${drivers}"
          sha256sum -- tauri-driver WebKitWebDriver \
            WebKitWebDriver.COPYRIGHT webkit-version.txt > SHA256SUMS
      - name: Retain the pinned drivers for native Linux diagnosis
        if: runner.os == 'Linux' && inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-preflight-linux-driver
          path: ${{ runner.temp }}/native-desktop-drivers/
          if-no-files-found: error
          retention-days: 7
      - name: Record that diagnostic packages have no application acceptance
        if: inputs.packages_only
        shell: bash
        run: |
          set -euo pipefail
          printf '{"schema_version":1,"source_sha":"%s",%s}\n' "${GITHUB_SHA}" \
            '"application_acceptance":false,"release_authorized":false' \
            > "${RUNNER_TEMP}/desktop-preflight.json"
      - name: Retain diagnostic intent separately from acceptance proofs
        if: inputs.packages_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-preflight-intent-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-preflight.json
          if-no-files-found: error
