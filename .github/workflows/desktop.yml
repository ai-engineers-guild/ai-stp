# Desktop application CI: the Tauri shell over apps/desktop on all three
# target OSes. Style follows check.yml — pinned action SHAs, pinned tool
# versions. check.yml owns source-event admission and joins this result.
#
# The core crate tests run everywhere; the full `tauri build` produces the
# per-OS bundles (.deb/.rpm/.AppImage, .dmg, .msi/.nsis) so cross-platform
# breakage is caught here rather than on a maintainer's machine.
name: desktop

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "26.12.1"

jobs:
  desktop:
    name: desktop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux bundles need the glibc of the image that built them, so the leg
        # pins the image the shipped bundles were built and tested on rather
        # than `ubuntu-latest`, which moves to Ubuntu 26.04 from 2026-10-19.
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'Linux'
        with:
          python-version: "3.14.9"
      - name: Install the native CLI toolchain
        shell: bash
        run: >-
          bash .github/scripts/install-rust-toolchain.sh
          apps/cli/rust-toolchain.toml clippy rustfmt
      - name: Install pinned bun
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-bun.sh "${BUN_VERSION}" "${RUNNER_TEMP}/bun"
          echo "${RUNNER_TEMP}/bun" >> "${GITHUB_PATH}"
      - name: Install WebKitGTK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf dbus-daemon gnome-keyring libglib2.0-bin \
            webkit2gtk-driver xvfb xauth
      - name: Restore desktop Rust build cache
        id: desktop-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli/target
            apps/cli/xtask/target
            apps/desktop/core/target
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/release/bundle/**
          key: >-
            desktop-cargo-v1-${{ matrix.os }}-${{ hashFiles('apps/cli/Cargo.*',
            'apps/cli/xtask/Cargo.*', 'apps/cli/rust-toolchain.toml',
            'apps/desktop/core/Cargo.*', 'apps/desktop/src-tauri/Cargo.*') }}
          restore-keys: desktop-cargo-v1-${{ matrix.os }}-
      - name: Frontend install
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Frontend checks (tsc, vitest, vite build)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun x tsc --noEmit
          bun x vitest run
          bun x vite build
      - name: Core crate tests
        working-directory: apps/desktop/core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Stub sidecar for shell-crate checks
        shell: bash
        # tauri-build's build.rs verifies resource paths exist at compile
        # time; the stub satisfies that before the real Rust sidecar
        # is built below.
        run: cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- desktop-stub
      - name: Shell crate tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the bundled CLI sidecar
        shell: bash
        run: cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- desktop-build
      - name: Sidecar spawns under the app's filtered env
        shell: bash
        # CliRunner clears the child env and re-adds a passthrough set —
        # the same path the installed app takes. The probe verifies the Rust
        # runtime, executable registry and native task input contract.
        # The native tool is shared with `just desktop-regress`.
        run: cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- desktop-probe
      - name: Tauri build
        shell: bash
        run: bash .github/scripts/build-desktop-bundles.sh
      - name: Verify the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          images=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1 && test -f "${images[0]}"
          /usr/bin/hdiutil verify "${images[0]}"
      - name: Probe the packaged CLI resource tree
        shell: bash
        run: >-
          cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml --
          desktop-package-probe
      - name: Install the release package on the disposable Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1 && test -f "${packages[0]}"
          sudo dpkg --install "${packages[0]}"
          test -x /usr/bin/ai-stp-desktop
      - name: Install the pinned external WebDriver in disposable CI state
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ai-stp-webdriver-target
        run: >-
          cargo install tauri-driver --version 2.1.0 --locked
          --root "${RUNNER_TEMP}/ai-stp-webdriver"
      - name: Three installed Linux Desktop journeys with bundled CLI and native vault
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            printf 'Installed Desktop journey %s/3\n' "${round}"
            bash .github/scripts/check-native-secret-service.sh --installed-desktop
            mv "${RUNNER_TEMP}/installed-desktop-proof.json" \
              "${RUNNER_TEMP}/installed-desktop-proof-${round}.json"
          done
      - name: Prepare the actual corporate API fixture on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "UV_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/ai-stp-installed-corporate"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
          } >> "${GITHUB_ENV}"
          bash .github/scripts/install-uv.sh 0.13.5 "${RUNNER_TEMP}/uv"
          echo "${RUNNER_TEMP}/uv" >> "${GITHUB_PATH}"
      - name: Installed corporate onboarding, lost reply and original binding recovery
        if: runner.os == 'Linux'
        shell: bash
        env:
          AI_STP_TEST_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@127.0.0.1:15434/ai_stp
        run: |
          set -euo pipefail
          fixture_postgres="$(docker run --detach --name ai-stp-installed-corporate \
            -e POSTGRES_USER=ai_stp -e POSTGRES_PASSWORD=ai_stp_dev -e POSTGRES_DB=ai_stp \
            -p 127.0.0.1:15434:5432 \
            docker.io/library/postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722)"
          trap 'docker rm --force "${fixture_postgres}" >/dev/null' EXIT
          bash .github/scripts/wait-postgres.sh "${fixture_postgres}"
          uv sync --locked
          bash .github/scripts/check-native-secret-service.sh --installed-corporate-desktop
      - name: Retain the public installed corporate checkout result
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-linux-corporate-checkout-proof
          path: ${{ runner.temp }}/installed-corporate-desktop-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain public installed Desktop results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-linux-desktop-proof
          path: ${{ runner.temp }}/installed-desktop-proof-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-stp-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn
      - name: Cache the qualified desktop build
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
          steps.desktop-cache.outputs.cache-hit != 'true' &&
          steps.desktop-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli/target
            apps/cli/xtask/target
            apps/desktop/core/target
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/release/bundle/**
          key: ${{ steps.desktop-cache.outputs.cache-primary-key }}
