name: desktop-msi-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare published MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          gh release download desktop-v0.0.9 --repo ai-engineers-guild/ai-stp --pattern '*.msi' --pattern SHA256SUMS --dir apps/desktop/src-tauri/target/release/bundle/msi
          python -c "from pathlib import Path; import hashlib; p=Path('apps/desktop/src-tauri/target/release/bundle/msi'); f=next(p.glob('*.msi')); assert hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name in (p/'SHA256SUMS').read_text()"
      - name: Rust extraction
        continue-on-error: true
        shell: pwsh
        run: cargo run --quiet --locked --manifest-path apps/cli/xtask/Cargo.toml -- desktop-package-probe
      - name: Original subprocess extraction
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import pathlib, subprocess, tempfile
          msi=next(pathlib.Path('apps/desktop/src-tauri/target/release/bundle/msi').resolve().glob('*.msi'))
          with tempfile.TemporaryDirectory() as dest:
              args=['msiexec.exe', '/a', str(msi), '/qn', '/l*v', 'msi-python.log', 'TARGETDIR='+dest]
              print(repr(args), flush=True)
              result=subprocess.run(args, timeout=180)
              print('Python extraction exit:', result.returncode)
              print('Extracted CLI:', list(pathlib.Path(dest).rglob('ai-stp-desktop-cli.exe')))
          '@ | python
      - name: MSI diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Filter 'msi-*.log' | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 100 }
