# Group routine updates per ecosystem; keep library major upgrades separate.
# Native and browser CI still run their complete platform matrices for every PR.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /apps/cli
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(cli)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    # Only `default-days`: Dependabot rejects `semver-major-days` for the
    # github-actions ecosystem, which has no semver-major notion in its
    # cooldown model.
    cooldown:
      default-days: 7
  - package-ecosystem: bun
    directory: /docs_scripts
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(docs)"
    # A version published minutes ago has been reviewed by nobody. The
    # cooldown is the cheapest defence against a compromised release being
    # pulled in before anyone has looked at it.
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: bun
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(web)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: bun
    directory: /apps/desktop
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(desktop)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  # The desktop Rust workspace keeps two manifests (`core` and `src-tauri`)
  # with separate lockfiles; Dependabot's cargo ecosystem reads a directory
  # per entry, so both are listed.
  - package-ecosystem: cargo
    directory: /apps/desktop/core
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(desktop)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(desktop)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  # Keep coordinated Bun pins and PostgreSQL major migrations manual.
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"
    # Container ecosystems support default-days, not semver-specific cooldowns.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: oven/bun
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deploy)"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
