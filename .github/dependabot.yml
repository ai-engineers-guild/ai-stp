# Version updates, not only the security ones GitHub raises by itself.
#
# Actions are pinned by commit here, which is the right default for a public
# repository and also the reason this file exists: a pinned commit does not
# drift, so nothing tells you it has gone stale unless something looks.
#
# `bun`, not `npm`, for the JavaScript directories. They carry `bun.lock` and
# no `package-lock.json`, and Dependabot's npm ecosystem edits `package.json`
# without regenerating a bun lockfile — so every pull request it opened here
# failed `bun install --frozen-lockfile` with
# `lockfile had changes, but lockfile is frozen`, five of them at once and none
# of them mergeable as generated.
#
# The three bun entries stay listed but currently cannot open pull requests:
# bun 1.4 writes `bun.lock` with `lockfileVersion` 2, while the updater
# Dependabot runs bundles bun 1.3.x and fails with
# `Unsupported bun.lock 'lockfileVersion' 2` (dependabot/dependabot-core#16026;
# fix PR #16071 still open as of 2026-10-03). They resume on their own once
# upstream ships. Until then JS/Rust advisories are caught by
# `scripts/safety/scan_lockfile.sh` (OSV) in CI and JS freshness is manual.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    # Only `default-days`: Dependabot rejects `semver-major-days` for the
    # github-actions ecosystem, which has no semver-major notion in its
    # cooldown model.
    cooldown:
      default-days: 7
  - package-ecosystem: bun
    directory: /docs_scripts
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docs)"
    # A version published minutes ago has been reviewed by nobody. The
    # cooldown is the cheapest defence against a compromised release being
    # pulled in before anyone has looked at it.
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: bun
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(web)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: bun
    directory: /apps/desktop
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(desktop)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  # The desktop Rust workspace keeps two manifests (`core` and `src-tauri`)
  # with separate lockfiles; Dependabot's cargo ecosystem reads a directory
  # per entry, so both are listed.
  - package-ecosystem: cargo
    directory: /apps/desktop/core
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(desktop)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(desktop)"
    cooldown:
      default-days: 7
      semver-major-days: 14
  # Container images. Every base and service image is pinned by digest
  # (`test_container_bases_are_pinned`), and a digest never drifts — which is
  # the reason it needs something that looks. Without these two entries the
  # production RustFS sat three months on `1.0.0-beta.8`, a build sixteen
  # published advisories (two critical) affect, and the Python base kept a
  # digest Docker Hub had long since republished.
  #
  # Majors are ignored only where a bump is a migration rather than an image
  # change: PostgreSQL's data directory needs `pg_upgrade` across majors, and
  # the bun image is one of three pins (`.bun-version`, `BUN_VERSION`) a
  # contract test holds together, so a version bump arrives as one hand-made
  # change. Digest refreshes of the same tag still arrive for both.
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: oven/bun
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deploy)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
