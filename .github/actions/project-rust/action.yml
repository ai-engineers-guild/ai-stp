name: Prepare the project Rust toolchain
description: Select Rust from the checkout and prepare it with the shared CI library.
inputs:
  components:
    description: Comma-separated Rust components required by this job.
    default: ""
  targets:
    description: Comma-separated Rust targets required by this job.
    default: ""
runs:
  using: composite
  steps:
    - name: Read the Rust toolchain pin
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^channel = "\(.*\)"$/\1/p' apps/cli/rust-toolchain.toml)"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
    - uses: >-
        NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@ca07bd07d12c91f103ce481372100cab6c83d72f
      with:
        rust-version: ${{ steps.pin.outputs.version }}
        rust-components: ${{ inputs.components }}
        rust-targets: ${{ inputs.targets }}
    - name: Use the selected compiler throughout the job
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.pin.outputs.version }}
      run: printf 'RUSTUP_TOOLCHAIN=%s\n' "$TOOLCHAIN" >> "$GITHUB_ENV"
