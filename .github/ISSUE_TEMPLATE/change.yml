name: Change
description: Propose a change to behavior, a contract, or documentation
labels: ["change"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem is not solved today?
      description: Describe the observed gap, not the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe what should be observable after the change.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: State what the change affects and what it intentionally does not.
  - type: checkboxes
    id: contracts
    attributes:
      label: What does the change affect?
      options:
        - label: Observable CLI or API behavior
        - label: Machine contract or schema
        - label: State or error set
        - label: Documentation only
