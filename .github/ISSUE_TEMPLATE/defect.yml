name: Defect
description: Observed behavior differs from documented or expected behavior
labels: ["defect"]
body:
  - type: markdown
    attributes:
      value: |
        Do not publish vulnerabilities, secrets, tokens, or `.env` contents here.
        Use `SECURITY.md` and GitHub's private reporting channels for vulnerabilities.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: >
        Give the exact command or request and its output. `--json` output is better
        than a paraphrase.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected?
      description: Explain why, with a document or contract link when available.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence of steps that produces the observation.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ai-stp version --json` or the exact commit.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, other]
    validations:
      required: true
