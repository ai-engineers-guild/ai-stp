<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Install path</title>
  <desc id="d">install CLI, passports, select, digest-bound plan and backup, provider apply, restore</desc>
  <rect width="1200" height="260" rx="22" fill="#101010"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <rect x="24" y="40" width="176" height="180" rx="16" fill="#181818" stroke="#434343"/>
      <text x="112" y="92" text-anchor="middle" font-size="15" fill="#fb631b">01</text>
      <text x="112" y="128" text-anchor="middle" font-size="18" fill="#ffffff">install</text>
      <text x="112" y="158" text-anchor="middle" font-size="14" fill="#858483">uv tool</text>
    </g>
    <g>
      <rect x="220" y="40" width="176" height="180" rx="16" fill="#181818" stroke="#434343"/>
      <text x="308" y="92" text-anchor="middle" font-size="15" fill="#fb631b">02</text>
      <text x="308" y="128" text-anchor="middle" font-size="18" fill="#ffffff">passports</text>
      <text x="308" y="158" text-anchor="middle" font-size="14" fill="#858483">device</text>
    </g>
    <g>
      <rect x="416" y="40" width="176" height="180" rx="16" fill="#181818" stroke="#434343"/>
      <text x="504" y="92" text-anchor="middle" font-size="15" fill="#fb631b">03</text>
      <text x="504" y="128" text-anchor="middle" font-size="18" fill="#ffffff">select</text>
      <text x="504" y="158" text-anchor="middle" font-size="14" fill="#858483">exact graph</text>
    </g>
    <g>
      <rect x="612" y="40" width="176" height="180" rx="16" fill="#181818" stroke="#434343"/>
      <text x="700" y="92" text-anchor="middle" font-size="15" fill="#fb631b">04</text>
      <text x="700" y="128" text-anchor="middle" font-size="18" fill="#ffffff">plan</text>
      <text x="700" y="158" text-anchor="middle" font-size="14" fill="#858483">digest + backup</text>
    </g>
    <g>
      <rect x="808" y="40" width="176" height="180" rx="16" fill="#181818" stroke="#434343"/>
      <text x="896" y="92" text-anchor="middle" font-size="15" fill="#fb631b">05</text>
      <text x="896" y="128" text-anchor="middle" font-size="18" fill="#ffffff">apply</text>
      <text x="896" y="158" text-anchor="middle" font-size="14" fill="#858483">provider</text>
    </g>
    <g>
      <rect x="1004" y="40" width="172" height="180" rx="16" fill="#181818" stroke="#434343"/>
      <text x="1090" y="92" text-anchor="middle" font-size="15" fill="#fb631b">06</text>
      <text x="1090" y="128" text-anchor="middle" font-size="18" fill="#ffffff">restore</text>
      <text x="1090" y="158" text-anchor="middle" font-size="14" fill="#858483">on failure</text>
