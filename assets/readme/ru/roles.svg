<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">CLI, веб и провайдер</title>
  <desc id="d">Агент ведёт CLI. Веб владеет аккаунтом и каталогом. Нативное состояние харнесса пишет только провайдер.</desc>
  <rect width="1200" height="320" rx="22" fill="#101010"/>
  <g>
    <rect x="28" y="28" width="368" height="264" rx="18" fill="#181818" stroke="#434343"/>
    <text x="52" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">CLI + АГЕНТ</text>
    <text x="52" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Подбор, проверка, пакет</text>
    <text x="52" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">Каждая команда — один JSON-</text>
    <text x="52" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">конверт. Нативные файлы</text>
    <text x="52" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">харнесса не пишет.</text>
  </g>
  <g>
    <rect x="416" y="28" width="368" height="264" rx="18" fill="#181818" stroke="#434343"/>
    <text x="440" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">WEB</text>
    <text x="440" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Аккаунт и каталог</text>
    <text x="440" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">Показывает публичные объекты,</text>
    <text x="440" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">устройства, grants. Не собирает</text>
    <text x="440" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">и не устанавливает сетап.</text>
  </g>
  <g>
    <rect x="804" y="28" width="368" height="264" rx="18" fill="#181818" stroke="#434343"/>
    <text x="828" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">PROVIDER</text>
    <text x="828" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Пишет нативное состояние</text>
    <text x="828" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">Выпущенный setup-system этого</text>
    <text x="828" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">харнесса. План, backup, apply,</text>
    <text x="828" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">restore. Своя лицензия.</text>
  </g>
</svg>
