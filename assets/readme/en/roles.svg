<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">CLI, web, and provider</title>
  <desc id="d">The agent drives the CLI. The web owns account and catalog. Only the provider writes native harness state.</desc>
  <rect width="1200" height="320" rx="22" fill="#101010"/>
  <g>
    <rect x="28" y="28" width="368" height="264" rx="18" fill="#181818" stroke="#434343"/>
    <text x="52" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">CLI + AGENT</text>
    <text x="52" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Select, validate, bundle</text>
    <text x="52" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">Every command is one JSON</text>
    <text x="52" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">envelope. Does not write the</text>
    <text x="52" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">harness's native files.</text>
  </g>
  <g>
    <rect x="416" y="28" width="368" height="264" rx="18" fill="#181818" stroke="#434343"/>
    <text x="440" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">WEB</text>
    <text x="440" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Account and catalog</text>
    <text x="440" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">Shows public objects, devices,</text>
    <text x="440" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">grants. Does not assemble</text>
    <text x="440" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">or install a setup.</text>
  </g>
  <g>
    <rect x="804" y="28" width="368" height="264" rx="18" fill="#181818" stroke="#434343"/>
    <text x="828" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">PROVIDER</text>
    <text x="828" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff">Writes native state</text>
    <text x="828" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">Released setup-system for that</text>
    <text x="828" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">harness. Plan, backup, apply,</text>
    <text x="828" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#858483">restore. Separate license.</text>
  </g>
</svg>
