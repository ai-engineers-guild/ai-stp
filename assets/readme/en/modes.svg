<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t d">
  <title id="t">Local, catalog, signed-in</title>
  <desc id="d">No account for local work. Anonymous catalog reads. Google or GitHub for private objects, sync, publication, devices and grants.</desc>
  <rect width="1200" height="240" rx="22" fill="#101010"/>
  <g>
    <rect x="28" y="28" width="368" height="184" rx="18" fill="#181818" stroke="#434343"/>
    <text x="52" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">LOCAL</text>
    <text x="52" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff">No account required</text>
    <text x="52" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#858483">Registry, passports, index,</text>
    <text x="52" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#858483">select, install public objects.</text>
  </g>
  <g>
    <rect x="416" y="28" width="368" height="184" rx="18" fill="#181818" stroke="#434343"/>
    <text x="440" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">CATALOG</text>
    <text x="440" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff">Anonymous read</text>
    <text x="440" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#858483">Public setups and components.</text>
    <text x="440" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#858483">No sign-in to browse.</text>
  </g>
  <g>
    <rect x="804" y="28" width="368" height="184" rx="18" fill="#181818" stroke="#434343"/>
    <text x="828" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fb631b">SIGNED IN</text>
    <text x="828" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff">Google or GitHub</text>
    <text x="828" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#858483">Private objects, sync, publish,</text>
    <text x="828" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#858483">devices, grants, reports.</text>
  </g>
</svg>
