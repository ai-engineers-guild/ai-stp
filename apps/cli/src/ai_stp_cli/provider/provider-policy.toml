# The locally pinned provider trust policy (`docs/contracts/provider-release.md`).
#
# Nothing inside a downloaded manifest widens what this file allows. That is the
# whole point of pinning a policy rather than reading one: a release describes
# itself, and this describes what this machine is willing to believe.
#
# Signature verification remains supported by the contract, but the displaced
# NDDev-it-com provider line is no longer trusted by the shipped policy.

schema_version = 2
policy_id = "nddev/provider/1"

# What a signature must be over. A signature over anything else is a valid
# signature of the wrong thing.
signature_subject = "ai-stp:provider-release-manifest:v1"

# The floor for every provider, independent of what any single machine has
# installed. Raising it after a compromise refuses old releases everywhere,
# including on machines that never installed anything.
minimum_sequence = 0

allowed_publishers = []
verified_publishers = []
allowed_repositories = []
allowed_keys = []
public_keys = {}
revoked_keys = []
supported_protocols = [1, 3]
releases = []

[[build_attestations]]
repository = "github.com/NDDev-OpenNetwork/claude-setup-system"
signer_workflow = "NDDev-OpenNetwork/claude-setup-system/.github/workflows/release.yml"
verified_publisher = false

