# Профиль набора инструментов `mvp-full` (SPEC-014).
#
# Состав задаётся политикой, а не содержимым выбранного проекта (REQ-1402):
# пустой проект и проект с одной документацией получают одно и то же.
#
# Каждая запись обязана нести точную версию, точный источник, доказательство
# целостности, лицензию и матрицу систем (REQ-1403). Проверка отвергает запись,
# в которой чего-то из этого нет, поэтому добавить инструмент «пока без суммы»
# невозможно — это осознанное ограничение, а не недосмотр.
#
# `digest_source` различает две вещи разной силы: сумму, опубликованную самим
# поставщиком, и сумму, посчитанную нами при однократной загрузке. Вторая
# защищает от подмены после закрепления, но не подтверждает, что закрепили
# правильное. Смешивать их в одном поле значило бы потерять это различие.

schema_version = 1
profile = "mvp-full"

# Пять экосистем по REQ-1407. Экосистема без инструмента остаётся объявленной и
# отвечает `not_available` с причиной — это честнее, чем молча её не показать.
[ecosystems]
python = "Python"
typescript = "TypeScript и JavaScript"
rust = "Rust"
go = "Go"
dart = "Dart и Flutter"

[[tools]]
id = "ruff"
ecosystem = "python"
purpose = "linter"
version = "0.16.1"
license = "MIT"
entry_point = "ruff"
digest_source = "vendor_published"
# Суммы взяты из файлов `<asset>.sha256` самого релиза 0.16.1.

