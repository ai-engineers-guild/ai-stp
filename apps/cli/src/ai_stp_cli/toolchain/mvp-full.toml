# Toolchain profile `mvp-full` (SPEC-014).
#
# The set is defined by policy, not by the selected project's contents (REQ-1402):
# an empty project and a documentation-only project receive the same set.
#
# Each entry must carry an exact version, exact source, integrity evidence, a
# license, and a platform matrix (REQ-1403). Validation rejects incomplete entries,
# so a tool cannot be added "without a digest for now" by accident.
#
# `digest_source` distinguishes two differently strong facts: a digest published
# by the vendor and one calculated during a one-time download. The latter protects
# against replacement after pinning but does not prove that the right artifact was
# pinned. Combining them would lose that distinction.

schema_version = 1
profile = "mvp-full"

# Five ecosystems under REQ-1407. An ecosystem without a tool remains declared and
# returns `not_available` with a reason; silently hiding it would be less honest.
[ecosystems]
python = "Python"
typescript = "TypeScript and JavaScript"
rust = "Rust"
go = "Go"
dart = "Dart and Flutter"

[[tools]]
id = "ruff"
ecosystem = "python"
purpose = "linter"
version = "0.16.1"
license = "MIT"
entry_point = "ruff"
digest_source = "vendor_published"
# Digests come from the release's own `<asset>.sha256` files for version 0.16.1.

[tools.artifacts.linux-x86_64]
url = "https://github.com/astral-sh/ruff/releases/download/0.16.1/ruff-x86_64-unknown-linux-gnu.tar.gz"
