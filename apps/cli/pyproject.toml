[project]
name = "ai-stp-cli"
version = "0.0.10"
description = "The ai_stp command line interface: a strict machine contract an agent drives."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AI Engineers Guild" }]
keywords = ["ai", "cli", "developer-tools", "setup", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ai-stp-assurance==0.0.10",
    "ai-stp-contracts==0.0.10",
    "ai-stp-foundation==0.0.10",
    "ai-stp-passports==0.0.10",
    "click>=8.1",
    "pynacl>=1.6.2",
    "httpx>=0.28",
    "jsonschema>=4.26",
    "keyring>=25.6",
    "pydantic>=2.9",
    "pyyaml>=6",
    # Format-preserving TOML writing, for `ADR-0129`: a component whose landing
    # is a key inside a host file the provider owns is compiled as a
    # contribution to that file, and the consumer assembles the full bytes.
    #
    # `tomllib` in the standard library only reads. Writing values back would
    # round-trip `config.toml` through parse-and-serialise and erase every
    # comment its owner wrote — losing comments in a file we did not create is
    # data damage, not cosmetics.
    #
    # Owner: `ADR-0129`. Removal path: it goes when that layout rule does.
    "tomlkit>=0.13",
]

[project.scripts]
ai-stp = "ai_stp_cli.app:run"

[project.urls]
Homepage = "https://github.com/ai-engineers-guild/ai-stp"
Repository = "https://github.com/ai-engineers-guild/ai-stp"
Issues = "https://github.com/ai-engineers-guild/ai-stp/issues"

[tool.uv.sources]
ai-stp-assurance = { workspace = true }
ai-stp-contracts = { workspace = true }
ai-stp-foundation = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
