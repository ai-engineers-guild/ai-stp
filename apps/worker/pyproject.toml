[project]
name = "ai-stp-worker"
version = "0.0.16"
description = "Background worker: custom PostgreSQL job queue runner with bounded polling and graceful drain."
requires-python = ">=3.12"
dependencies = [
  "ai-stp-contracts",
  "ai-stp-platform",
  "httpx>=0.28",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
ai-stp-worker = "ai_stp_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
