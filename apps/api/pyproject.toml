[project]
name = "ai-stp-api"
version = "0.0.7"
description = "FastAPI /v1 application shell: envelope, error mapping, health and observability."
requires-python = ">=3.12"
dependencies = [
    "ai-stp-foundation",
    "ai-stp-platform",
    "ai-stp-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "authlib>=1.6.6",
    "cryptography>=44.0.0",
    "itsdangerous>=2.2.0",
]

[project.scripts]
ai-stp-api = "ai_stp_api.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
