[project]
name = "ai-stp-api"
version = "0.0.16"
description = "FastAPI /v1 application shell: envelope, error mapping, health and observability."
requires-python = ">=3.12"
dependencies = [
  "ai-stp-contracts",
  "ai-stp-foundation",
  "ai-stp-passports",
  "ai-stp-platform",
  "ai-stp-sources",
  "authlib>=1.6.6",
  "cryptography>=44.0.0",
  "fastapi>=0.161.1",
  "httpx>=0.28",
  "itsdangerous>=2.2.0",
  "lxml>=6.0",
  "maxminddb>=2.8",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-sdk>=1.27",
  "pillow>=13.0.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.5",
  "signxml>=5.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "starlette>=1.7.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-stp-api = "ai_stp_api.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
