[project]
name = "ai-stp-platform"
version = "0.0.16"
description = "Shared server runtime: async database access, the custom job queue and readiness probes."
requires-python = ">=3.12"
dependencies = [
  "ai-stp-assurance",
  "ai-stp-contracts",
  "ai-stp-foundation",
  "ai-stp-passports",
  "ai-stp-sources",
  "aiobotocore>=3.9.0",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "botocore>=1.43.106",
  "cryptography>=44.0.0",
  "httpx>=0.28",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "sqlalchemy[asyncio]>=2.1.6",
  "structlog>=24.4",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.deptry.per_rule_ignores]
# SQLAlchemy selects asyncpg by URL; zoneinfo loads tzdata on Windows.
DEP002 = ["asyncpg", "tzdata"]

[tool.deptry.package_module_name_map]
# The conditional Windows data package is absent on Unix analysis hosts.
tzdata = ["tzdata"]

[tool.uv.sources]
ai-stp-foundation = { workspace = true }
ai-stp-passports = { workspace = true }
ai-stp-contracts = { workspace = true }
ai-stp-assurance = { workspace = true }
ai-stp-sources = { workspace = true }

# Include non-Python safety policy assets (opengrep yml, yara rules).
[tool.uv.build-backend]
module-name = "ai_stp_platform"
module-root = "src"
# uv_build includes package data under the module tree by default; policy_pack
# lives at src/ai_stp_platform/safety/policy_pack/.
