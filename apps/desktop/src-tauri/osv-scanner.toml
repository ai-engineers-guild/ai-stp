reason = "proc-macro-error 1.0.4 unmaintained; pulled only by glib-macros 0.18.5 and gtk3-macros 0.18.2 in the same tauri-pinned GTK3 stack, so it cannot move independently; re-evaluate when tauri moves to GTK4"

