[package]
name = "ai-stp-desktop"
version = "0.5.3"
edition = "2024"
description = "ai-stp desktop application"
license = "Apache-2.0"
# The application is distributed through its native installers.
publish = false

[lib]
name = "ai_stp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
ai-stp-desktop-core = { path = "../core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
serde_json = "=1.0.154"
tauri-plugin-dialog = "=2.8.4"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
