[package]
name = "ai-stp-desktop-core"
version = "0.5.2"
edition = "2024"
description = "Contract consumer core for the ai-stp desktop app: CLI envelope parsing, command descriptors and bounded native process execution."
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
sha2 = "=0.11.1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
