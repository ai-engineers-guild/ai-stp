[package]
name = "ai-stp-cli-v2"
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"
description = "Native ai-stp CLI engine"

[[bin]]
name = "ai-stp-v2"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
jsonschema = { version = "=0.58.6", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled", "serialize", "hooks", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
serde_json_canonicalizer = "=0.3.2"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.0"
sigstore-verify = { version = "=0.14.0", default-features = false }
ulid = "=3.0.0"
unicode-normalization = "=0.1.25"
unicode-general-category = "=1.1.0"
unicase = "=2.10.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
