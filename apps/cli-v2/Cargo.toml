[package]
name = "ai-stp-cli-v2"
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"
description = "Native ai-stp CLI engine"

[[bin]]
name = "ai-stp-v2"
path = "src/main.rs"

[dependencies]
csv = "=1.4.0"
base64 = "=0.22.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
jsonschema = { version = "=0.58.6", default-features = false }
jsonc-parser = { version = "=0.34.0", default-features = false, features = ["cst"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "serialize", "hooks", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
serde_json_canonicalizer = "=0.3.2"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.0"
sigstore-tuf = { version = "=0.14.0", default-features = false }
sigstore-verify = { version = "=0.14.0", default-features = false }
ulid = "=3.0.0"
toml_edit = { version = "=0.25.16", default-features = false, features = ["parse", "display"] }
tree-sitter = { version = "=0.27.1", default-features = false, features = ["std"] }
tree-sitter-python = "=0.25.0"
unicode-normalization = "=0.1.25"
unicode-general-category = "=1.1.0"
unicase = "=2.10.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
crc32fast = "=1.5.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
zeroize = "=1.9.1"
ignore = "=0.4.33"
regex = { version = "=1.13.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
security-framework = "=3.7.0"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring-core = "=1.0.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }
winx = "=0.36.4"
windows-native-keyring-store = "=1.1.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
