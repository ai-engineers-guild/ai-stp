# YAML syntax and style. Run through just docs-source.
exclude = [
    ".work/",
    ".tmp/",
    ".site/",
    ".venv/",
    ".venv-check/",
    ".serena/",
    ".serena.local-backup-before-ff/",
    ".gitlab-lab/",
    ".gds/",
    "node_modules/",
    ".playwright-mcp/",
]

[files]
yaml = [
    "*.yaml",
    "*.yml",
    ".yamllint",
]

[lint.rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
comments-indentation = "enable"
document-end = "disable"
document-start = "disable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
key-duplicates = "enable"
key-ordering = "disable"
new-line-at-end-of-file = "enable"
new-lines = "disable"
octal-values = "enable"
quoted-strings = "disable"
trailing-spaces = "enable"

[lint.rules.comments]
level = "warning"
min-spaces-from-content = 1

[lint.rules.empty-lines]
max = 2

[lint.rules.indentation]
indent-sequences = "consistent"
spaces = 2

[lint.rules.line-length]
allow-non-breakable-words = true
max = 100

[lint.rules.truthy]
allowed-values = [
    "true",
    "false",
]
check-keys = false
level = "warning"

