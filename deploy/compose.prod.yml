# Production stack (SPEC-019, ADR-0040, SPEC-024, ADR-0044, ADR-0086, ADR-0135).
# Copy .env.prod.example to .env.prod and fill secrets before bring-up.
# Postgres and RustFS stay internal. api, web and docs publish to loopback
# only; the host's nginx terminates TLS and owns the public route split
# (deploy/nginx/ai-stp.conf.template).

# Pinned: the project name used to come from the deployment root's directory
# name (~/ai_stp on the host). Moving the compose file under deploy/ would
# rename the project to `deploy` and orphan every named volume — pgdata,
# rustfs, osv_offline, clamav_db, logs. A non-default root overrides via
# COMPOSE_PROJECT_NAME (env beats the `name:` key).
name: ai_stp

# Docker's json-file driver rotates nothing by itself: an unbounded
# container log grows /var/lib/docker until the host disk is the outage.
# 10m x 3 per container bounds stdout retention for the whole stack.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    # Only the three keys the entrypoint consumes are injected. `env_file`
    # would hand the whole `.env.prod` — OAuth secrets, the session secret,
    # GitHub tokens — to a third-party image that has no use for them.
    # Additional POSTGRES_* tuning belongs in this block explicitly; deploy
    # preflight guarantees the three values are present and non-placeholder.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # From 18 the image keeps the cluster in /var/lib/postgresql/<major>/docker,
    # so the next major can run `pg_upgrade --link` within this one volume.
    # `pgdata` still holds the 16 cluster as the rollback copy;
    # deploy/postgres-major-upgrade.sh moved its data here.
    volumes:
      - pgdata18:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    logging: *default-logging

  rustfs:
    # Pinned by digest and named by tag, like every other dependency here:
    # the digest is what runs, the tag is what Dependabot and a reviewer read.
    # `:latest` moved under us on 2026-08-20 — the image pulled that morning
    # answered 403 on the MinIO-compatible health path the check had used,
    # `api` waits on a healthy `rustfs` and never left `Created`, and the site
    # served 502 until the path was corrected (`#394`).
    #
    # 1.0.1 replaced 1.0.0-beta.8, which sixteen published advisories (two
    # critical) affect. The upgrade was rehearsed on a beta.8 volume seeded
    # through `ImmutableObjectStore`: every object read back digest-verified,
    # new writes and the private-bucket test passed, anonymous reads got 403.
    # yamllint disable-line rule:line-length
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    # The store receives exactly its own credential pair — which must equal the
    # AI_STP_STORAGE_* pair the API uses, and the deploy preflight compares
    # them before any effect. As with postgres, `env_file` would leak every
    # application secret into this third-party image's environment.
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      # Nothing here uses the web console, and its preview modal carried both
      # critical advisories of the beta line. A listener that serves no one is
      # attack surface only.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs:/data
    networks: [internal]
    healthcheck:
      # Readiness, not liveness: `api` and the storage migration wait on this
      # through `service_healthy`, and since 1.0.0 `/health/ready` reports
      # storage quorum while `/health` only says the process answers. Never
      # `/minio/health/live`, which answered 403 on 2026-08-20 (`#394`).
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: always
    logging: *default-logging

  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: ../.env.prod
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    logging: *default-logging

  # Two steps, and only one runs here. The integrity reconcile reads what is
  # published and checks it against the projection's own rules. The development
  # fixture seed does not run on a serving environment: it writes invented
  # objects — `fixture-component`, `river-*`, `northwind-*` — and this compose
  # file put twenty-two of them on the public site, once per deploy, beside the
  # real first-party corpus. The refusal is in `seed_cli.fixtures_wanted`, keyed
  # on `AI_STP_API_ENVIRONMENT`, so it holds however this service is invoked.
  seed:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker
    command: ["python", "-m", "ai_stp_platform.seed_cli"]
    env_file:
      - path: ../.env.prod
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: api
    environment:
      AI_STP_API_GIT_COMMIT: ${AI_STP_API_GIT_COMMIT:-}
    env_file:
      - path: ../.env.prod
        required: false
    volumes:
      - logs:/var/log/ai_stp
      # Coarse-location database (SPEC-023 REQ-2314). Read-only, and empty in the
      # repository: the file and its update policy belong to the operator. Absent,
      # the lookup returns nothing and login is unaffected.
      - ./geoip:/srv/geoip:ro
    ports:
      - "${AI_STP_API_BIND:-127.0.0.1:58082}:8000"
    networks: [internal, edge]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/live')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      # Probe every 2s while starting so `up --wait` in the deploy returns
      # as soon as the new container serves, not after a full interval.
      start_interval: 2s
    restart: always
    logging: *default-logging

  content-import:
    # One-shot after migrate + healthy API. Web waits for exit 0 (SPEC-054).
    # The snapshot is built at startup from the release content. The deploy
    # script supplies the exact commit to the API and importer environments.
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: content-import
    command: ["python", "-m", "ai_stp_platform.content.importer"]
    environment:
      AI_STP_API_BASE_URL: http://api:8000
      AI_STP_API_GIT_COMMIT: ${AI_STP_API_GIT_COMMIT:-}
      AI_STP_CONTENT_HUB: /content
      AI_STP_CONTENT_SNAPSHOT: /tmp/content-snapshot.json
    env_file:
      - path: ../.env.prod
        required: false
    volumes:
      - ../docs-user-facing/content:/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    logging: *default-logging

  osv-refresh:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker-safety
    command:
      - sh
      - -c
      - "while /opt/ai_stp/scripts/safety/refresh_osv_db.sh; do sleep 21600; done; exit 1"
    environment:
      AI_STP_OSV_OFFLINE_DIR: /var/lib/ai_stp/osv
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /var/lib/ai_stp/osv
      AI_STP_OSV_MAX_AGE_HOURS: ${AI_STP_OSV_MAX_AGE_HOURS:-36}
      AI_STP_OSV_ECOSYSTEMS: ${AI_STP_OSV_ECOSYSTEMS:-PyPI,npm,Go,crates.io}
    volumes:
      - osv_offline:/var/lib/ai_stp/osv
    networks: [edge]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from ai_stp_platform.safety.osv_health import osv_db_ready;
          raise SystemExit(0 if osv_db_ready(require_fresh=True) else 1)
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always
    logging: *default-logging

  clamav-refresh:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker-safety
    user: root
    command:
      - sh
      - -c
      - "while freshclam --datadir=/var/lib/clamav; do sleep 21600; done; exit 1"
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [edge]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          find /var/lib/clamav -maxdepth 1 -type f
          \( -name '*.cvd' -o -name '*.cld' \)
          -size +0c | grep -q .
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    logging: *default-logging

  worker:
    # Safety validate path: pinned scanners + EXTERNAL_CLI (see deploy/docker/Dockerfile.app).
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker-safety
    environment:
      AI_STP_SAFETY_EXTERNAL_CLI: "1"
      AI_STP_SAFETY_SANDBOX: auto
      AI_STP_SAFETY_REQUIRE_BWRAP: "1"
      AI_STP_OSV_OFFLINE_DIR: /var/lib/ai_stp/osv
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /var/lib/ai_stp/osv
      AI_STP_OSV_MAX_AGE_HOURS: ${AI_STP_OSV_MAX_AGE_HOURS:-36}
      AI_STP_OSV_REQUIRE_FRESH: "1"
    # Docker's default seccomp profile blocks the user namespace that
    # Bubblewrap needs. Ubuntu 24.04 also requires a named AppArmor profile
    # that allows `userns` — docker-default and an unconfined AppArmor
    # attachment both refuse it. Keep the container uid 10001;
    # load-apparmor.sh installs the named profile.
    security_opt:
      - seccomp=unconfined
      - apparmor=ai-stp-worker
    env_file:
      - path: ../.env.prod
        required: false
    volumes:
      - logs:/var/log/ai_stp
      - osv_offline:/var/lib/ai_stp/osv
      - clamav_db:/var/lib/clamav:ro
    # edge is required: deliver_invitation reaches api.resend.com and
    # repository_metrics/github_archive/official_upstream_sync reach
    # api.github.com/codeload — an internal-only worker dead-letters them.
    networks: [internal, edge]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      osv-refresh:
        condition: service_healthy
      clamav-refresh:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from ai_stp_platform.safety import safety_readiness;
          raise SystemExit(0 if safety_readiness() else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
      target: prod
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.example.invalid}
        AI_STP_WEB_PROFILE: ${AI_STP_WEB_PROFILE:-public_saas}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-true}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_YANDEX_METRIKA_COUNTER_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_COUNTER_ID:-}
        NEXT_PUBLIC_COOKIE_CONSENT_ENABLED: ${NEXT_PUBLIC_COOKIE_CONSENT_ENABLED:-true}
        AI_STP_FEATURE_CONTENT_HUB: ${AI_STP_FEATURE_CONTENT_HUB:-}
        AI_STP_FEATURE_SAAS_PUBLIC_PAGES: ${AI_STP_FEATURE_SAAS_PUBLIC_PAGES:-}
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.example.invalid}
      AI_STP_USER_DOCS_URL: ${AI_STP_USER_DOCS_URL:-https://docs.example.invalid}
      AI_STP_API_BASE_URL: http://api:8000
      AI_STP_USE_MOCKS: "false"
    env_file:
      - path: ../.env.prod
        required: false
    ports:
      - "${AI_STP_WEB_BIND:-127.0.0.1:58081}:3000"
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
      content-import:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
      # Probe every 2s while starting so `up --wait` in the deploy returns
      # as soon as the new container serves, not after a full interval.
      start_interval: 2s
    restart: always
    logging: *default-logging

  docs:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.docs
      target: prod
      args:
        AI_STP_USER_DOCS_SITE_URL: ${AI_STP_USER_DOCS_URL:-https://docs.example.invalid}
    ports:
      - "${AI_STP_DOCS_BIND:-127.0.0.1:58083}:8080"
    networks: [edge]
    healthcheck:
      # Every long-running service reports health; a silent `docs` used to be
      # the one container `docker compose ps` could not describe. The alpine
      # nginx image carries busybox `wget` — no extra package.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    logging: *default-logging


networks:
  internal:
    internal: true
  edge:

volumes:
  pgdata:
  pgdata18:
  rustfs:
  logs:
  osv_offline:
  clamav_db:
