# Static file server for the built user documentation, inside the docs image.
#
# This is not the public edge: the deployment host's nginx terminates TLS and
# proxies to the port below (ADR-0135). Here nginx only serves the mkdocs output.

server {
    listen 8080;
    server_name _;

    root /srv;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # mkdocs emits directory-style URLs, so a path resolves to its index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
