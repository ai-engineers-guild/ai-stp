# Development stack (SPEC-019, ADR-0040, SPEC-024, ADR-0044). Self-contained: runs
# out of the box without any .env.dev. An optional .env.dev overrides these defaults.
# Postgres and RustFS stay internal. No host proxy in dev: web (:3000) and api (:8000)
# are published on the host; browser /v1/* is rewritten by Next to the API.

# Pinned: the project name used to come from the checkout's directory name
# (typically `ai-stp`). Under deploy/ it would become `deploy` and orphan
# dev volumes (pgdata, web_next, ...). Override: COMPOSE_PROJECT_NAME.
name: ai-stp

x-app-env: &app-env
  AI_STP_DB_URL: postgresql+asyncpg://ai_stp:ai_stp_dev@postgres:5432/ai_stp
  AI_STP_STORAGE_ENDPOINT: http://rustfs:9000
  # Legacy source for the one-bucket storage migration; new writes use the
  # explicit artifact and asset buckets below.
  AI_STP_STORAGE_BUCKET: ai-stp-dev
  AI_STP_STORAGE_ARTIFACT_BUCKET: ai-stp-dev-artifacts
  AI_STP_STORAGE_ASSET_BUCKET: ai-stp-dev-assets
  AI_STP_STORAGE_ACCESS_KEY_ID: ai_stp
  AI_STP_STORAGE_SECRET_ACCESS_KEY: ai_stp_dev
  AI_STP_STORAGE_REGION: us-east-1
  AI_STP_STORAGE_KEY_PREFIX: objects
  AI_STP_API_ENVIRONMENT: dev
  AI_STP_API_LOG_DIR: /var/log/ai_stp
  # Dual-window HTTP gate (ADR-0128 / SPEC-010 REQ-1015). Code defaults match
  # these values; they are named here so a stack without .env.dev still shows
  # the policy. Explicit 0 disables that dimension.
  AI_STP_API_RATE_LIMIT_OVERALL_REQUESTS: "100"
  AI_STP_API_RATE_LIMIT_OVERALL_WINDOW_SECONDS: "60"
  AI_STP_API_RATE_LIMIT_IP_REQUESTS: "1000"
  AI_STP_API_RATE_LIMIT_IP_WINDOW_SECONDS: "3600"
  AI_STP_API_RATE_LIMIT_MAX_KEYS: "2048"
  AI_STP_WORKER_LOG_DIR: /var/log/ai_stp
  AI_STP_WORKER_WORKER_ID: worker-dev
  # Dev-only HMAC secret for opaque public-catalog cursors (ADR-0042, min 32 chars).
  # Throwaway like the other dev credentials above; prod uses .env.prod.
  AI_STP_CATALOG_CURSOR_SIGNING_SECRET: dev-only-catalog-cursor-secret-change-me-32chars
  AI_STP_CATALOG_USAGE_ENABLED: "true"
  AI_STP_CATALOG_USAGE_SECRET: dev-only-catalog-usage-secret-change-me-32chars
  # Safety validate path (worker-safety image): external CLIs + offline OSV mount.
  AI_STP_SAFETY_EXTERNAL_CLI: "1"
  AI_STP_SAFETY_SANDBOX: auto
  AI_STP_OSV_OFFLINE_DIR: /var/lib/ai_stp/osv
  # osv-scanner offline packs root (must match AI_STP_OSV_OFFLINE_DIR volume).
  OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /var/lib/ai_stp/osv
  AI_STP_OSV_MAX_AGE_HOURS: "36"
  AI_STP_SEO_ENRICHMENT_ENABLED: "false"
  AI_STP_CONTENT_IMPORT_TOKEN: ${AI_STP_CONTENT_IMPORT_TOKEN:-dev-only-content-import-token-32chars}

x-web-env: &web-env
  # Structural web surfaces are selected before the Next dev/build process starts.
  AI_STP_WEB_PROFILE: ${AI_STP_WEB_PROFILE:-public_saas}
  AI_STP_FEATURE_CONTENT_HUB: ${AI_STP_FEATURE_CONTENT_HUB:-}
  AI_STP_FEATURE_SAAS_PUBLIC_PAGES: ${AI_STP_FEATURE_SAAS_PUBLIC_PAGES:-}
  AI_STP_FEATURE_CATALOG_USAGE_METRICS: "true"
  # Browser-facing origin is the published web port (no reverse proxy in dev).
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Public user docs are a separate MkDocs container; /docs remains API docs.
  AI_STP_USER_DOCS_URL: http://localhost:${AI_STP_USER_DOCS_PORT:-8011}
  AI_STP_API_BASE_URL: http://api:8000
  # Real API for catalog and auth (OAuth credentials from .env.dev).
  AI_STP_USE_MOCKS: "false"
  AI_STP_MOCK_AUTH: "false"
  AI_STP_SESSION_SECRET: dev-only-change-me-to-a-long-random-string
  # Official GA / Yandex Metrika. Empty id = that vendor off. Set
  # NEXT_PUBLIC_ANALYTICS_ENABLED=false to disable both even when ids are set.
  NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-true}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
  NEXT_PUBLIC_YANDEX_METRIKA_COUNTER_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_COUNTER_ID:-}
  NEXT_PUBLIC_COOKIE_CONSENT_ENABLED: ${NEXT_PUBLIC_COOKIE_CONSENT_ENABLED:-true}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_stp
      POSTGRES_PASSWORD: ai_stp_dev
      POSTGRES_DB: ai_stp
    env_file:
      - path: ../.env.dev
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Localhost-only access lets the platform test fixtures create isolated
    # databases without exposing PostgreSQL beyond the developer workstation.
    ports:
      - "127.0.0.1:${AI_STP_TEST_DB_PORT:-55433}:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    # Same digest as production. A development stack that resolves a
    # different build is a development stack that cannot reproduce the
    # failure production had (`#394`).
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      # Must match AI_STP_STORAGE_* in x-app-env. If these are missing at first
      # start, rustfs falls back to built-in defaults and API gets HeadBucket 403.
      RUSTFS_ACCESS_KEY: ai_stp
      RUSTFS_SECRET_KEY: ai_stp_dev
      # Off as in production, so development cannot depend on it.
      RUSTFS_CONSOLE_ENABLE: "false"
    env_file:
      - path: ../.env.dev
        required: false
    volumes:
      - rustfs:/data
    networks: [internal]
    healthcheck:
      # The production check, so development reproduces what production
      # waits on: readiness (`/health/ready`, storage quorum since 1.0.0), never
      # the MinIO-compatible path that answered 403 on 2026-08-20 (`#394`).
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mailpit:
    # Local catch-all SMTP + web UI (http://localhost:8025): the default mail
    # path in dev — invitation mail really sends and is readable in the UI.
    # It accepts and stores every message; nothing is relayed outside.
    image: axllent/mailpit:v1.31.3
    ports:
      # Web UI holds invitation links — loopback only, like the SMTP listener.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks: [internal]
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    env_file:
      - path: ../.env.dev
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  seed:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker
    command: ["python", "-m", "ai_stp_platform.seed_cli"]
    environment: *app-env
    env_file:
      - path: ../.env.dev
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: api
    environment:
      <<: *app-env
      AI_STP_API_GIT_COMMIT: ${AI_STP_API_GIT_COMMIT:-}
      # Default OAuth to local browser/API origins; override these for a declared
      # tunnel origin whose callback is registered with the provider.
      AI_STP_AUTH_PUBLIC_BASE_URL: ${AI_STP_AUTH_PUBLIC_BASE_URL:-http://localhost:3000}
      AI_STP_AUTH_OAUTH_REDIRECT_BASE_URL: >-
        ${AI_STP_AUTH_OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
    env_file:
      - path: ../.env.dev
        required: false
    # Host :8000 for OAuth provider callbacks when Google/GitHub still list
    # http://localhost:8000/v1/auth/{provider}/callback (site itself is :3000).
    ports:
      - "8000:8000"
    volumes:
      - logs:/var/log/ai_stp
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/live')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  content-import:
    # One-shot after migrate + healthy API. Web must not become ready before
    # this exits 0 (SPEC-054). The importer resolves the current checkout HEAD
    # at startup, so no commit build argument is needed.
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: content-import
    command: ["python", "-m", "ai_stp_platform.content.importer"]
    environment:
      <<: *app-env
      AI_STP_API_BASE_URL: http://api:8000
      AI_STP_CONTENT_SNAPSHOT: /tmp/content-snapshot.json
      AI_STP_CONTENT_HUB: /repo/docs-user-facing/content
      AI_STP_CONTENT_REPOSITORY: /repo
    env_file:
      - path: ../.env.dev
        required: false
    volumes:
      - ../.git:/repo/.git:ro
      - ../docs-user-facing/content:/repo/docs-user-facing/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  worker:
    # Publication validate uses pinned scanner CLIs (not the bare worker target).
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
      target: worker-safety
    environment: *app-env
    # Mail defaults live in mailpit.env — env_file order decides, so a real
    # relay in .env.dev (SMTP_* or a Resend key) overrides the catch-all.
    # AI_STP_WORKER_GITHUB_TOKEN also comes from .env.dev. Do not add
    # environment overrides for these: they would win over the env_file.
    env_file:
      - path: mailpit.env
      - path: ../.env.dev
        required: false
    volumes:
      - logs:/var/log/ai_stp
      - osv_offline:/var/lib/ai_stp/osv
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
      target: dev
    environment:
      <<: *web-env
      # Keep compile cache off the Windows bind mount (major I/O win under Docker Desktop).
      NEXT_TELEMETRY_DISABLED: "1"
      # Docker Desktop bind mounts may omit file-change events from Windows.
      WATCHPACK_POLLING: "true"
      AI_STP_USER_FACING_ROOT: /docs-user-facing
    # The cache lives in a persistent Linux volume for Docker Desktop I/O speed.
    # Clear it before boot so a long-lived HMR graph cannot survive a restart.
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/.next &&
        find /app/.next -mindepth 1 -maxdepth 1 -exec rm -r -- {} + &&
        exec node node_modules/next/dist/bin/next dev --hostname 0.0.0.0 --port 3000
    env_file:
      - path: ../.env.dev
        required: false
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      # .next on a Linux volume: avoid 9p/virtiofs latency for webpack output.
      - web_next:/app/.next
      - ../docs-user-facing:/docs-user-facing:ro
      - ../packages/contracts/src/ai_stp_contracts/fixtures/v1/corporate-overview.json:/packages/contracts/src/ai_stp_contracts/fixtures/v1/corporate-overview.json:ro
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
      content-import:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 30s
      retries: 8
      start_period: 5m
    restart: unless-stopped

  docs:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.docs
      target: dev
    environment:
      AI_STP_USER_DOCS_SITE_URL: http://localhost:${AI_STP_USER_DOCS_PORT:-8011}/
      AI_STP_USER_DOCS_EN_SITE_URL: http://localhost:${AI_STP_USER_DOCS_PORT:-8011}/en/
    ports:
      - "${AI_STP_USER_DOCS_PORT:-8011}:8000"
    volumes:
      - ../docs-user-facing/docs:/app/docs-user-facing/docs:ro
      - ../docs_scripts/user-mkdocs.yml:/app/docs_scripts/user-mkdocs.yml:ro
      - ../docs_scripts/user-mkdocs.en.yml:/app/docs_scripts/user-mkdocs.en.yml:ro
      - ../docs_scripts/user_docs_dev.py:/app/docs_scripts/user_docs_dev.py:ro
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          from urllib.request import urlopen
          urlopen("http://127.0.0.1:8000/")
          urlopen("http://127.0.0.1:8000/en/")
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata:
  rustfs:
  logs:
  osv_offline:
  web_node_modules:
  web_next:
