# Corporate mode for the existing development web service; no extra service.
services:
  api:
    environment:
      # SSR enrichment shares one Docker peer; retain bounded gates for local acceptance.
      AI_STP_API_RATE_LIMIT_OVERALL_REQUESTS: "1000"
      AI_STP_API_RATE_LIMIT_IP_REQUESTS: "10000"
  web:
    # Run the image's sources, not the Windows bind mount, for this acceptance deployment.
    volumes: !override
      - web_node_modules:/app/node_modules
      - ../docs-user-facing:/docs-user-facing:ro
    # Corporate module exclusions use the build's Turbopack aliases. Keep the
    # real API/auth transport in this stack; fixtures are opt-in for tests.
    environment:
      AI_STP_WEB_PROFILE: corporate_hub
      AI_STP_USE_MOCKS: "false"
      AI_STP_MOCK_AUTH: "false"
      AI_STP_FEATURE_CONTENT_HUB: "false"
      AI_STP_FEATURE_SAAS_PUBLIC_PAGES: "false"
      AI_STP_FEATURE_CATALOG_USAGE_METRICS: "false"
