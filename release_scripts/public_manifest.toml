# These assert what *this* working copy's workflows say. Published unchanged
# they would not merely be redundant, they would be false: the public tree runs
# on GitHub-hosted runners, so an assertion that a job names a fleet class fails
# there. The overlay carries the public equivalent instead.
"tests/unit/test_deploy_hardening.py" = "asserts the private workflow contract"
"tests/contract/test_release_candidate.py" = "asserts the private workflow contract"
"tests/unit/test_provider_kit.py" = "names the private harness repository"

# These read artefacts only this working copy has: the audit status document
# withheld above, this repository's branch protections, and the export's own
# private half. Published unchanged they would fail rather than inform.
"tests/contract/test_audit_remediation_status.py" = "reads a withheld document"
"tests/contract/test_repository_protections.py" = "asserts this repository's protections"
"tests/contract/test_public_export.py" = "asserts the export's private half"
