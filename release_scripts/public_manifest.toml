# What the public `ai-stp` repository contains, and what it may never contain.
#
# An allowlist, deliberately. Discovery elsewhere in this repository uses a
# denylist because a mistake there hides a component; here a mistake publishes
# one, so a path that nobody named stays private by default.
#
# `roots` are top-level tracked entries. Everything under a named root is
# published unless `exclude_paths` removes it or `forbidden` rejects it.

roots = [
  "apps",
  "packages",
  "tests",
  "schemas",
  "migrations",
  "specs",
  "docs",
  "docs_scripts",
  "user-docs",
  "deploy",
  "skills",
  "scripts",
  "release_scripts",
  "provider-kit",
  ".repo-safety",
  ".serena",
  "alembic.ini",
  "justfile",
  "pyproject.toml",
  "uv.lock",
  "docker-compose.dev.yml",
  "docker-compose.prod.yml",
  "Dockerfile",
  "Dockerfile.user-docs",
  "Dockerfile.worker-safety",
  ".dockerignore",
  ".gitattributes",
  ".gitignore",
  ".gitleaks.toml",
  ".env.dev.example",
  ".env.prod.example",
  # Supplied by the overlay rather than by this tree, and named here all the
  # same: `roots` describes what the built tree may contain, and the built
  # tree runs this same report in its own gate.
  "CODE_OF_CONDUCT.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "PRODUCT.md",
  "QUICKSTART.md",
]

# Named so the reason survives, rather than left out silently. A key may be a
# top-level root or a single path; both are matched against the tracked name.
[withheld]
# The Serena project config and its ignore rules are ordinary contributor
# hygiene and are published; only the memories are this working copy's own.
".serena/memories" = "agent memory: internal narrative, host names, private issue numbers"
".impeccable" = "review screenshots and development logs, not implementation"
".gds" = "GDS artifacts, owned by another system"
"plans" = "dated internal planning notes, superseded by specs"
".claude" = "agent entry point for the private working copy"
".agents" = "agent entry point for the private working copy"
"AGENTS.md" = "internal working rules: fleet classes, deployment host, private tracker"
".github" = "workflows address a private runner fleet; the overlay supplies public ones"
"release_scripts/public_forbidden.toml" = "names the private infrastructure it exists to refuse"
"release_scripts/public_overlay" = "its files are published at their target paths, not at this one"

