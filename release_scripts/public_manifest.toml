# copy has. They are not redacted, because a redacted decision record is worse
# than an absent one: it reads as complete while its reasoning has been cut out.
"docs/adr/ADR-0080-ci-on-ephemeral-fleet-scale-set.md" = "private fleet decision"
"docs/adr/ADR-0098-deployment-runs-on-the-ephemeral-fleet.md" = "private fleet decision"
