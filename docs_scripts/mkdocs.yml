# The config lives beside the scripts rather than at the root: paths below are
# relative to this file. Run it through just so the -f flag is not forgotten.
# Placeholders are quoted because otherwise YAML reads {{ as the start of a map.

site_name: "{{PROJECT_NAME}}"
site_description: "{{ONE_SENTENCE_ABOUT_PURPOSE}}"
repo_url: https://github.com/{{OWNER}}/{{REPO}}
edit_uri: edit/main/docs/

docs_dir: ../docs
site_dir: ../.site

# The prototype index is published as a Markdown page: the same-named HTML
# remains the source artifact and must not compete for the same route.
exclude_docs: |
  references/prototypes/index.html

# specs are not included in the site: they are working artifacts, not reader
# documentation.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  # Render Mermaid without external scripts. Material's native integration is
  # preferable to mermaid2 because it works with the other theme features and
  # adds no separate dependency.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: ru
  # Navigation is built from the directory structure. An explicit nav would
  # need manual synchronization for every new document and could silently drift.
  - awesome-pages
  # The last-change date comes from Git. Beside last_verified it shows whether a
  # document was edited after it was checked against the code.
  - git-revision-date-localized:
      type: date
      locale: en
      enable_creation_date: false
      fallback_to_build_date: true
      # Missing file history must not break the build: a fresh clone and the
      # first commit are normal states, while mkdocs --strict turns warnings
      # into errors.
      strict: false

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    # Documents intentionally link to AGENTS.md, SECURITY.md, and specs/, which
    # are not part of the site. These links are valid when reading the repository,
    # which is the primary consumption path for agents. docs_lint.py checks link
    # integrity across the full tree.
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore
    anchors: warn

strict: true
