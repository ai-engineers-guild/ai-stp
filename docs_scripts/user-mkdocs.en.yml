# English user-documentation line. It is built separately at `/en/`; the Russian
# line and its configuration own the structure, and English follows it. A test
# catches page-set drift.

site_name: ai_stp user docs
site_description: ai_stp user documentation for developers and agents.
site_url: !ENV [AI_STP_USER_DOCS_EN_SITE_URL, "http://localhost:8011/en/"]
repo_url: https://github.com/ai-engineers-guild/ai-stp
edit_uri: edit/main/docs-user-facing/docs/en/

# Both language lines are built separately: Russian at the root and English at
# `/en/`. `mkdocs-static-i18n` would provide one build with a switch, but its
# Material extra is pinned below 9.7.2 while this project uses Material 9.7.7;
# adding a dependency that requires a downgrade costs more than a second build.
# `extra.alternate` is Material's native selector and needs no plugin.
extra:
  alternate:
    - name: Русский
      link: /
      lang: ru
    - name: English
      link: /en/
      lang: en

docs_dir: ../docs-user-facing/docs/en
site_dir: ../.site-user-docs/en

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: en
  - awesome-pages
  - git-revision-date-localized:
      type: date
      locale: en
      enable_creation_date: false
      fallback_to_build_date: true
      strict: false

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

strict: true
