extends: default

yaml-files:
  - "*.yaml"
  - "*.yml"
  - ".yamllint"

ignore: |
  .work/
  .tmp/
  .site/
  .venv/
  .venv-check/
  .serena/
  .serena.local-backup-before-ff/
  node_modules/
  .playwright-mcp/

rules:
  line-length:
    max: 100
    allow-non-breakable-words: true
  indentation:
    spaces: 2
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  comments-indentation: enable
  empty-lines:
    max: 2
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  document-start: disable
  new-lines: disable
  octal-values: enable
  key-duplicates: enable
