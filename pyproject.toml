# Workspace root. Not an installable package: real code lives in packages/*.
# Single source of truth for Python dependencies is the root uv.lock.

[project]
name = "ai-stp"
version = "0.0.2"
description = "Git-native registry and setup layer for AI harness configurations (workspace root)."
requires-python = ">=3.12"
dependencies = [
    "ai-stp-api",
    "ai-stp-assurance",
    "ai-stp-cli",
    "ai-stp-contracts",
    "ai-stp-foundation",
    "ai-stp-passports",
    "ai-stp-platform",
    "ai-stp-worker",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.112",
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # Measured before it was added, on the whole suite with the coverage gate
    # on: 548s in one process against 325s across four, 3776 passed and 93.12%
    # both times. The suite was already safe to distribute — every test that
    # needs PostgreSQL gets its own database cloned from a per-worker migrated
    # template (ADR-0108) — and the slowest tests are the ones that spawn a CLI
    # process, which is exactly the shape that parallelises. Removing it is one
    # flag in `justfile::back-test`.
    "pytest-xdist>=3.6",
    # Duration data for cross-job sharding (`just back-durations` writes it,
    # `--splits/--group` consumes it). Inert until sharding is switched on;
    # removal is the dev-group entry plus the one recipe.
    "ruff>=0.12",
]
# Documentation toolchain, moved verbatim from docs_scripts/requirements.lock.txt
# (deleted in the same change). Exact pins preserved; uv.lock owns integrity hashes.
docs = [
    "babel==2.18.0",
    "bracex==3.0.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "ghp-import==2.1.0",
    "gitdb==4.0.12",
    "GitPython==3.1.58",
    "idna==3.18",
    "Jinja2==3.1.6",
    "Markdown==3.10.3",
    "MarkupSafe==3.0.3",
    "mergedeep==1.3.4",
    "mkdocs==1.6.1",
    "mkdocs-awesome-pages-plugin==2.9.3",
    "mkdocs-get-deps==0.2.2",
    "mkdocs-git-revision-date-localized-plugin==1.5.3",
    "mkdocs-material==9.7.7",
    "mkdocs-material-extensions==1.3.1",
    "natsort==8.4.0",
    "packaging==26.3",
    "paginate==0.5.7",
    "pathspec==1.1.1",
    "platformdirs==4.11.0",
    "Pygments==2.20.0",
    "pymdown-extensions==11.0.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "PyYAML==6.0.2",
    "pyyaml-env-tag==1.1",
    "regex==2026.7.19",
    "requests==2.34.2",
    "six==1.17.0",
    "smmap==5.0.3",
    "urllib3==2.7.0",
    "watchdog==6.0.0",
    "wcmatch==11.0.1",
    "yamllint==1.35.1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# apps/web is a Node/bun workspace (ADR-0043), not a Python package; keep it out of uv.
exclude = ["apps/web"]

[tool.uv.sources]
ai-stp-foundation = { workspace = true }
ai-stp-passports = { workspace = true }
ai-stp-contracts = { workspace = true }
ai-stp-assurance = { workspace = true }
ai-stp-cli = { workspace = true }
ai-stp-platform = { workspace = true }
ai-stp-api = { workspace = true }
ai-stp-worker = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/foundation/src",
    "packages/passports/src",
    "packages/contracts/src",
    "packages/assurance/src",
    "apps/cli/src",
    "apps/platform/src",
    "apps/api/src",
    "apps/worker/src",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Russian is the documented prose language of the validators; the ambiguous
# cyrillic-vs-latin lookalike rules only fight legitimate text there.
"docs_scripts/**" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["packages", "apps", "tests", "docs_scripts", "release_scripts"]
# Product code and its tests are strict; the documentation validators run at
# basic level until their full typing lands.
typeCheckingMode = "basic"
strict = ["packages", "apps", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `docs_scripts` holds repository tooling that the gate also tests; the
# projection generator is one of them and its contract test imports it.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --cov=packages --cov=apps --cov-report=term-missing:skip-covered --cov-fail-under=90"
filterwarnings = [
    # Python 3.13+ reports an unclosed sqlite3 connection from its finalizer.
    # Pytest captures that finalizer as an unraisable warning, so promoting only
    # ResourceWarning would leave the resource-lifecycle gate falsely green.
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "platform: platform backend tests",
    "cli: CLI tests",
    "manual: manual exploration, excluded from CI and gates",
    "unprivileged: needs a process the filesystem actually restricts (see tests/conftest.py)",
    # Assigned automatically by tests/conftest.py from fixture usage, not
    # handwritten per file: a test that reaches one of the PostgreSQL fixtures
    # needs AI_STP_TEST_DB_URL, and selection by marker must not drift from
    # what the fixtures actually require.
    "pg: requires PostgreSQL via AI_STP_TEST_DB_URL",
]

[tool.coverage.run]
source = ["packages", "apps"]
# sysmon (ADR-0117) cannot run with concurrency=greenlet: coverage 7.15
# prints `Can't use core=sysmon` and silently falls back to ctrace, which
# is how the gate paid for the slow core plus a warning on every xdist
# worker. thread stays; await-crossing SQLAlchemy greenlets are the cost
# of the chosen core, not a second tracing plugin.
concurrency = ["thread"]
core = "sysmon"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
# The threshold is compared against a *rounded* total: coverage's
# `should_fail_under` evaluates `round(total, precision) < fail_under`. At the
# default precision of 0 a gate of 95 really passes at 94.5, and pytest-cov
# still prints "FAIL Required test coverage" because its message uses the
# unrounded number — a run that says FAIL and exits 0. Observed on
# letya999@6a41c28 at 94.55% in CI and 94.88% locally. Two decimals shrink the
# blind band from half a point to 0.005; it cannot be removed, only narrowed.
precision = 2
