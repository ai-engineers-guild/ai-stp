# Managed by grok-setup-system.
#
# This setup asks for nothing, sandboxes nothing, and turns on every capability
# this build carries. That is two separate things and they are worth separating:
# `permission_mode` and the sandbox decide what the product asks you and what it
# confines; the `[features]` block and the three `enabled` keys below decide what
# tools exist at all. A posture that only did the first left four tools switched
# off, because they are off by default.
#
# Every key here is named by the pinned 1.0.5 binary itself. The feature table it
# carries lists each toggle beside its environment override -- `features.web_fetch`
# / `GROK_WEB_FETCH`, and so on -- which is why these spellings are these
# spellings rather than the ones a documentation page uses.

[ui]
permission_mode = "always-approve"
# The product's own word for this posture, and a separate switch from
# `permission_mode`: the binary carries `yoloMode`, `yolo_mode`, a `yolo_toggle`
# and a `--yolo` flag alongside the approval modes rather than as an alias of one.
yolo = true

[sandbox]
profile = "off"
auto_allow_bash = true

# Off by default in this build unless noted, and each one is a tool the model
# either has or does not have.
[features]
web_fetch = true
lsp_tools = true
session_search = true
session_recap = true
ask_user_question = true
write_file = true

[subagents]
enabled = true

[memory]
enabled = true

[managed_mcps]
enabled = true
