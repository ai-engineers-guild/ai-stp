# Managed by codex-setup-system.
#
# Every key here is from learn.chatgpt.com/docs/config-file/config-reference.
#
# **Two of the three move this build's defaults on purpose, and the
# measurement is recorded rather than implied.** Measured 2026-08-30 against
# the pinned artifact on linux/x86_64, with a temporary CODEX_HOME and
# `codex doctor` reading the resolved values back:
#
#   empty file                       approval OnRequest, filesystem restricted
#   approval_policy = "on-request"   approval OnRequest      -- control: the default
#   sandbox_mode = "workspace-write" filesystem restricted   -- control: the default
#   approval_policy = "never"        approval Never          -- what this file sets
#   sandbox_mode = "danger-full-access"  filesystem unrestricted
#
# The first three lines are the control: an instrument that printed one
# answer for every input would have produced the last two readings too.
#
# Every posture shares this autonomous pair -- approvals ask for nothing and
# the sandbox confines nothing; what differs between them is which tools
# exist beside it. `model_reasoning_effort` is the key `doctor` does not
# report, so this file cannot show you that it took. Unmeasured, not
# ineffective: the instrument is silent about it, which is a different thing
# from the product being silent.
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "medium"
