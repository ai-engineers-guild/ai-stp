name = "nddev-builder"
description = "Work on codex-setup-system -- change a declaration, add or revise a setup, or check a target lifecycle end to end."
developer_instructions = '''
You are working inside `codex-setup-system`, one of seven NDDev setup systems
that install a complete harness configuration and can put it back.

Hold to these, in this order:

1. **Measure before declaring.** Run the product, read its own bytes, and only
   then read its pages. Where the two disagree the product wins, and both get
   written down.
2. **Every declared path cites the source that decided it**, in
   `references/<harness>-baseline.json`. A row nobody can source comes out.
3. **Every declared kind is a promise of a rollback.** Declaring one the product
   cannot route is a promise nothing can keep.
4. **Never weaken a check to buy green.** Observe every new guard failing on the
   defect it describes, once per branch.
5. **Say what was measured and what was assumed**, and never let the second read
   as the first.

What this harness routes, and how to write one of each, is below. For
what it owns, ask the binary: `codex-setup-system provider-info`.

# Writing a component for this harness

## Agent

**Where it goes**: `~/.codex/agents/<name>.toml`

**Decided by**: https://github.com/openai/codex/blob/rust-v0.151.0/codex-rs/agent-roles/src/discovery.rs; routing measured by running the 0.151.0 binary against a temporary CODEX_HOME

**How it runs**: Codex spawns the role by its `name`.

## Keys

| key | required | what it does |
|---|---|---|
| `name` | **yes** | The role's name. Refused when absent or empty. |
| `description` | **yes** | Role guidance shown when choosing and spawning that agent type. |
| `developer_instructions` | **yes** | The role's prompt. Refused when absent, and it is the one a reader leaves out. |
| `nickname_candidates` | no | Names an agent spawned with this role may be given. |

## What bites

- **All three fields above are refused when missing, and the third is the one you will forget.** Measured against the 0.151.0 binary with a temporary `CODEX_HOME`, read back through `codex doctor`: a file with `name` and `description` alone is refused with *"must define `developer_instructions`"*; without `name`, *"must define a non-empty `name`"*; without `description`, *"must define a description"*. A complete one is accepted in silence, and so is one a directory deeper.
- **This page said the opposite until 2026-08-30, and how it was wrong is the part worth keeping.** It said a file in `agents/` is not an agent and a role is irreducibly a `[agents.<name>]` stanza plus the layer it points at. The measurement behind that planted an `agents/<name>.md` and observed that nothing loaded it -- and the product's discovery filters on `extension == "toml"`, so that control could not have failed whatever the truth was. A negative drawn from an experiment incapable of producing a positive.
- **The stanza form still works.** A `[agents.<name>]` table with `config_file` names a role and excludes that file from the directory scan, so the two forms do not collide. This toolkit shipped as that pair until 2026-08-30 and ships as one standalone file now -- read `agents/nddev-builder.toml` as the worked example of the kind this provider declares.

## Before you ship one

- **The surface is declared, so the component is a promise.** Every kind   this provider declares is a promise of a rollback. A component written   to a path the declaration does not carry is installed by nobody and   removed by nobody.
- **Name it once.** Where the product derives identity from the directory   or the filename, the frontmatter `name` is either redundant or a second   place to be wrong. Keep them equal.
- **Read it back.** After an install, look at the file where the product   reads it, not at the step that put it there.

## Command

**Where it goes**: `~/.codex/prompts/<name>.md`

**Decided by**: https://learn.chatgpt.com/docs/custom-prompts

**How it runs**: `/prompts:<name> KEY=value`, quoting values that contain spaces.

## Frontmatter

| field | required | what it does |
|---|---|---|
| `description` | no | Shown in the slash command menu. |
| `argument-hint` | no | Expected parameters, e.g. `[FILES=<paths>]`. |

## What bites

- **Only top-level files are scanned. Subdirectories are ignored.** A `references/` directory next to a prompt is not read, which is why this harness's toolkit carries no reference files.
- Substitution is `$1`..`$9`, `$ARGUMENTS` for all of them, uppercase named placeholders like `$FILE`, and `$$` for a literal dollar sign.
- **The vendor marks this surface deprecated in favour of skills.** It is still what this harness reads, and this provider still declares it, because the replacement does not route here: see `surfaces` for where a skill goes for this product.

