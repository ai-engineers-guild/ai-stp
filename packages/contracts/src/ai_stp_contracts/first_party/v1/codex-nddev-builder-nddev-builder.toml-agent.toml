# The Commands This Program Answers

Use this reference when changing how a target is installed, observed, restored
or removed.

Ask the binary rather than this file if the two ever disagree:
`codex-setup-system` with no arguments prints every command it has.

```text
list                                          every setup this build carries
status    --target <dir>                      what a target holds, changing nothing
install   <setup> --target <dir>              write a setup into a target
select    <setup> --target <dir>              reach a different setup's complete state
reinstall --target <dir>                      write the applied setup again
diff      --target <dir>                      what drifted since it was applied
backups   --target <dir>                      the slots, newest first
restore   [--backup <ref>] --target <dir>     the last backup, or a named one
hold      --backup <ref> [--reason <why>] --target <dir>
release   --backup <ref> --target <dir>
remove    --target <dir>                      the files this program recorded writing
software  --prefix <dir>                      which product versions a prefix holds
rollback  --to <version> --prefix <dir>       point the command at one already there
```

There is no `--json` on these. JSON is the **provider** surface --
`provider-info`, `status --target <dir> --json`, `validate-bundle`,
`plan-operation`, `apply-operation`, `recover-operation` -- and a consumer calls
those.

## Invariants worth knowing before changing anything

- **The target is named, never guessed.** Absolute, existing, a directory, and
  its final component not a symbolic link. Nothing is inferred from `$HOME`, the
  working directory, or the documented configuration home.
- **A backup is captured before every change**, so `restore` always has
  somewhere to go. The pool is bounded; a held slot is not reclaimed and is not
  counted against the bound.
- **There is one write path.** A human command builds a real plan and calls the
  same `perform` the wire surface does, so a human command cannot bypass a
  guarantee the provider owes its consumer.
- **`remove` withdraws the files this provider recorded writing.** Unrecorded
  neighbours stay. `reset` is the separately named whole-namespace empty;
  default install, replace and remove do not take namespaces whole.

## The software half

`software_install`, `software_update` and `software_remove` are the product's
own program, not its configuration. They live under `--prefix`, never under
`--target`: one program can serve several targets, and a program inside a target
would claim a path this build promises not to touch.

Each build pins two versions -- the current one and the one before it -- so an
update has somewhere to come from and a rollback somewhere to return to. A bump
moves the current pin into the second slot rather than adding a second choice.

# The ai-stp CLI lifecycle

Native install, select and restore of this provider are the lifecycle section
of this toolkit. This page is the consumer path: author a component, compose a
setup, install it, read it back, release an immutable version, and request
publication.

Resolve every flag from `ai-stp help --agent --json`. Do not invent options.
Start with `ai-stp doctor --json`.

## Exercise from a blank authoring directory

1. **Scaffold** a real skill with `ai-stp component scaffold plan` then
   `ai-stp component scaffold apply`. Replace every draft marker before
   compose or release.
2. **Passport.** `ai-stp component passport validate` and
   `ai-stp component skill validate` on the package directory (the directory
   with `SKILL.md` at its root), not the whole tree.
3. **Harness semantics.** This harness's surfaces table says where the kind
   lands. Do not invent a path the declaration does not carry. Adaptations are
   those native files, not a second copy of the passport.
4. **Compose a setup.** `ai-stp select propose` then `ai-stp select confirm`,
   or `ai-stp setup compose plan`. Confirm only the proposal just returned.
5. **Install and read back.** `ai-stp install plan`, then `ai-stp install apply`
   with that plan's digest, then `ai-stp target status` with the same provider.
   Trust `pending_authorization`, not the apply exit code.
6. **Immutable release.** `ai-stp component version release`.
7. **Requested publication.** `ai-stp component publish` or
   `ai-stp setup publish plan`. Publicity is a separate user decision.

## What this page does not name

- Private authoring gates, repository coordinates, or unpublished tools.
- Flags other than `ai-stp doctor --json` and `ai-stp help --agent --json`.

# Before Handing Off

Run the checks this tree's CI runs, in order, and report what each one said
rather than that it passed.

```bash
cargo fmt --all --check
cargo clippy --workspace --all-targets -- -D warnings
cargo test --workspace
```

If a command here is not present, say so rather than working around it.

## A lifecycle smoke test against a disposable target

Never against a live configuration home. A temporary directory outside the
repository:

```bash
target="$(mktemp -d)/codex-target"
mkdir -p "$target"
codex-setup-system install baseline    --target "$target"
codex-setup-system status              --target "$target"
codex-setup-system select full-auto    --target "$target"
codex-setup-system diff                --target "$target"
codex-setup-system backups             --target "$target"
codex-setup-system restore             --target "$target"
codex-setup-system remove              --target "$target"
```

The same sequence runs as a test in every published tree, on ubuntu, macos and
windows, against the binary that tree builds -- so a change that breaks it fails
before anyone types it.

## Conformance against the consumer

The wire surface is checked by the consumer's own runner, not by anything here.
Ask `codex-setup-system provider-info` for `harness_id`; that is the value
`--harness` takes, and it is not always the directory name.

```bash
ai-stp provider conformance --harness <harness_id> \
  --executable target/release/codex-setup-system \
  --target <empty-dir> --protocol-version 3 --json
```

Report the verdict with the consumer version that gave it. An empty target and a
populated one are different questions. A defect that only appears against a real
home is the kind this project has already shipped.

## The rule that does not move

Never weaken an invariant, raise a threshold, silence a check or delete a test
to buy green.

Every new guard is observed **failing on the defect it describes** before it is
kept -- and once per branch, not once per guard. A guard whose test has never
been red proves nothing, and this estate has twice found a new guard's first
test passing under a mutation because every case it named exercised the same
branch.

## Classifying a finding is not silencing it

A false positive dismissed with its reasoning recorded is correct. Rewriting
code until a checker goes quiet is not. The difference is whether the change
stands on its own merits: if the code was worse for a reason that has nothing to
do with the checker, fix it; if it was not, dismiss the finding and say why.

## What this toolkit does not do

- It does not push, tag, or release.
- It does not write a live configuration home.
- It does not install software or start a product.

# Writing this harness's configuration

## The file

| | |
|---|---|
| path | `~/.codex/config.toml` |
| grammar | **toml** |
| comments | **parse** |
| home moved by | `CODEX_HOME` |

TOML, so `#` comments are part of the grammar. No JSON schema is possible for it and none is expected; the setups are checked by parsing instead.

## The same question on the other harnesses

| harness | file | grammar | comments |
|---|---|---|---|
| `antigravity` | `antigravity-cli/settings.json` | json | no |
| `claude` | `settings.json` | json | no |
| **this one** | `config.toml` | toml | yes |
| `cursor` | `cli-config.json` | json | no |
| `grok` | `config.toml` | toml | yes |
| `opencode` | `opencode.json` | jsonc | yes |
| `pi` | `settings.json` | json | no |

**A comment is not a stylistic choice.** In a strict-JSON file a `//` is
a parse error, and the product does not start rather than starting
without your setting. Two of the seven take comments; the rest do not,
and one of those takes them at two spellings of the same file.

## Before you write one

- **Ask what the product resolved, not what the file says.** Write the
  key, start the product, and read its own answer back. A key the
  product does not know is usually accepted in silence -- which reads
  as configured and does nothing.
- **Put an invented key beside yours.** If the product complains about
  neither, the run discriminates nothing and *the key survived* says
  nothing at all. That control is what separates a file that is parsed
  from a file that is merely read.
- **A value here may not be the effective one.** Where an administrator
  layer exists it clamps everything below it, so a setup can install,
  verify and restore cleanly on a managed machine and change nothing.
  the `nddev-surfaces` prompt, and `codex-setup-system provider-info`, records which layers this product has and
  what was searched for the ones it does not.


# Writing this harness's instruction file

## Where it goes

`~/.codex/AGENTS.md`

Decided by: https://learn.chatgpt.com/docs/agent-configuration/agents-md

## What the record says about it

**Searched in the product's own pinned bytes on 2026-08-29 and not found, which argues nothing either way.** Fixed-string, anchored to this product's configuration home -- the bare leaf name is in every one of these binaries and proves nothing, so only the anchored form counts. An invented path was searched in the same run and was also absent, so the search discriminates.

This row stays `page` because **a path built by joining a directory to a name at runtime never appears as a literal**, and that is the shape of every remaining one. Moving it off `page` needs the product run against a target and asked what it resolved, not a deeper grep.

**Off `page` on 2026-08-31, by running the product and asking what it resolved -- which is what this row said it would take.** The pinned `codex-0.151.0-linux-x64.tgz` was fetched, its digest checked against the artifact table, and `codex debug prompt-input` run against a temporary `CODEX_HOME`. That command renders the model-visible input as JSON, and a marker written into the instruction file at the configuration home is in it.

**Two controls, because one proves nothing.** A marker never written to any file is absent from the same output, so the search discriminates; and removing the file makes the marker disappear, so the result is about this file rather than about anything else the command renders. The earlier session was right that a deeper grep could not settle this -- the instrument was a command nobody had looked for.

