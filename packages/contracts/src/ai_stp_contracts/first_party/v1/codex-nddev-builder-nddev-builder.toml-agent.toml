# The second target this harness owns

## `target_scope: user_root`, rooted at `~/.agents`

**`~/.agents` is not this product's configuration home.** It is a
different target, reached by a consumer naming the scope on the
request, and every path below is relative to that root rather than
to the home -- writing the root into the path again would nest it
twice, which is a mistake this estate has made and shipped.

| path | routes | decided by | exercised by |
|---|---|---|---|
| `skills` | skill | <https://learn.chatgpt.com/docs/build-skills> | **ran it** |
### `skills`, as measured

The documented user-level skills directory is $HOME/.agents/skills. Relative to this scope's own root it is `skills`, not `.agents/skills` -- the root is what the scope names, and writing it into the path again would put the skills at ~/.agents/.agents/skills. Codex also reads $CODEX_HOME/skills, measured, which is declined in the global block and for reasons recorded there.

**Run, not read.** The pinned `codex-0.150.1-linux-x64.tgz` was fetched, its digest checked against the artifact table, and the binary driven with `debug prompt-input` against a temporary `HOME` and `CODEX_HOME`. A `SKILL.md` at `$HOME/.agents/skills/nddev-user-root-probe/` appears in the rendered `<skills_instructions>` list with that file locator, beside the product's own five bundled skills.

**With a control, because a positive without one says nothing.** A second skill was placed at `$HOME/.agents-not-a-root/skills/` -- a sibling root no page names -- and it is absent from the same listing. So the product is reading the documented root rather than scanning `$HOME` broadly, which is the reading a bare positive could not distinguish.


Considered under this scope and not owned:

- **`agents`** — No page names a user-level agents directory under the .agents convention. learn.chatgpt.com/docs/build-skills documents skills at $HOME/.agents/skills and says nothing about siblings; a declared kind is a promise of a rollback, and this one would promise a rollback of a directory nothing reads.
- **`AGENTS.md`** — Instructions at user level are ~/.codex/AGENTS.md, which the global scope already owns. A second copy under the convention root would be a second statement of one fact, and nothing documents Codex reading it there.


**A setup cannot carry one of these.** A setup is installed into one
target and its payload is relative to that target, so a component
for this scope is installed by the consumer against that root -- not
by a setup aimed at the configuration home. If you are looking for
where to put one by hand, it is the path above joined to the root
above, and nowhere under the home.

**The root is shared, and that changes what removal means.** Several
products read it. Under this scope `remove`, the backup and a
restore act on the files this provider recorded writing rather than
on the directory whole, so a neighbour's files are never captured
into a slot here and never reverted out of one.

