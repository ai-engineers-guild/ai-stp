<!doctype html>
<html lang="ru" data-mode="machine">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai_stp · HTML prototypes</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 24px; border-bottom: var(--line) solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 4px; height: 14px; border-radius: 1px; background: var(--accent); flex-shrink: 0;
    }
    .nav { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .nav a, .nav button.linkish {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--muted); font-size: 14px; transition: color var(--dur) var(--ease);
    }
    .nav a:hover, .nav a.is-active { color: var(--fg); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .main { width: min(1120px, 100%); margin: 0 auto; padding: 40px 24px 64px; flex: 1; }
    .footer {
      border-top: var(--line) solid var(--border); color: var(--muted);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
      text-align: center; padding: 24px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: var(--control-h); padding: 0 16px; border-radius: var(--radius-control);
      border: var(--line) solid transparent; cursor: pointer;
      font-size: 14px; font-weight: 500;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); color: var(--accent-text); }
    .btn-secondary { background: var(--surface-2); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface); color: var(--fg); }
    .btn-outline { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--surface); color: var(--fg); }
    .btn-block { width: 100%; }
    .btn-sm { min-height: 28px; padding: 0 12px; font-size: 12px; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: var(--radius-chip);
      border: var(--line) solid var(--border);
      font-family: var(--font-mono); font-size: 11px; font-weight: 500;
      color: var(--fg); background: transparent;
    }
    .chip-soft { background: var(--surface-2); border-color: transparent; color: var(--muted); }
    .chip-ok {
      background: color-mix(in srgb, var(--success) 18%, transparent);
      border-color: transparent; color: var(--success);
    }
    .card {
      background: var(--surface); border: var(--line) solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color var(--dur) var(--ease);
    }
    .card:hover { border-color: color-mix(in srgb, var(--muted) 50%, var(--border)); }
    .card h3 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.3; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; }
    .card-meta dt { color: var(--muted); font-size: 11px; }
    .card-meta dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
    .card-foot {
      display: flex; flex-wrap: wrap; gap: 12px 16px;
      border-top: var(--line) solid var(--border); padding-top: 12px;
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; }
    .field input, .field select {
      min-height: var(--control-h); padding: 0 12px;
      border-radius: var(--radius-control); border: var(--line) solid var(--border);
      background: var(--bg); color: var(--fg);
    }
    .field input.mono { font-family: var(--font-mono); letter-spacing: 0.12em; }
    .panel {
      border: var(--line) solid var(--border); border-radius: var(--radius);
      background: var(--surface); padding: 16px 18px;
    }
    .panel-empty { color: var(--muted); }
    h1 {
      margin: 0 0 8px; font-size: clamp(28px, 4vw, 36px); font-weight: 500;
      letter-spacing: -0.02em; line-height: 1.15;
    }
    h2 { margin: 0 0 8px; font-size: 20px; font-weight: 500; }
    .lede { margin: 0; max-width: 42rem; color: var(--muted); font-size: 16px; }
    .mono { font-family: var(--font-mono); }
    .muted { color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: 24px; }
    .stack-sm { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .narrow { max-width: 440px; margin: 0 auto; width: 100%; }
    .mid { max-width: 560px; margin: 0 auto; width: 100%; }
    .dl { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dl > div { min-width: 0; }
    .dl dt { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .dl dd { margin: 0; font-size: 14px; word-break: break-word; }
    .dl .span-2 { grid-column: 1 / -1; }
    .codebox {
      font-family: var(--font-mono); font-size: 13px;
      border: var(--line) solid var(--border); background: var(--surface-2);
      border-radius: var(--radius-control); padding: 12px 14px; overflow-x: auto;
    }
    .filters {
      display: grid; gap: 12px; grid-template-columns: 1fr auto; align-items: end;
      padding: 16px; border: var(--line) solid var(--border);
      border-radius: var(--radius); background: var(--surface);
    }
    .search-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:end; }
    .filter-wrap { position:relative; }
    .filter-popover {
      position:absolute; right:0; top:calc(100% + 8px); z-index:30; width:min(520px, calc(100vw - 32px));
      border:var(--line) solid var(--border); border-radius:var(--radius); background:var(--surface);
      padding:16px; box-shadow:0 16px 42px color-mix(in srgb, var(--bg) 72%, transparent);
    }
    .filter-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .filter-foot { display:flex; justify-content:flex-end; gap:8px; border-top:var(--line) solid var(--border); padding-top:12px; margin-top:16px; }
    .filter-help { position:relative; display:inline-flex; }
    .icon-btn { width:24px; height:24px; padding:0; border:var(--line) solid var(--border); background:transparent; color:var(--muted); border-radius:50%; cursor:pointer; font-family:var(--font-mono); font-size:12px; }
    .icon-btn:hover { color:var(--fg); background:var(--surface-2); }
    .help-pop { position:absolute; left:0; top:28px; z-index:34; width:220px; padding:10px; border:var(--line) solid var(--border); border-radius:var(--radius-control); background:var(--surface); color:var(--muted); font-size:12px; line-height:1.45; box-shadow:0 12px 28px color-mix(in srgb, var(--bg) 75%, transparent); }
    .applied-chips { display:flex; flex-wrap:wrap; gap:8px; min-height:24px; }
    .chip button { border:0; padding:0 0 0 6px; background:none; color:inherit; cursor:pointer; font-size:15px; line-height:1; }
    .checkline { display:flex; align-items:center; gap:8px; min-height:28px; color:var(--muted); font-size:13px; }
    .checkline input { accent-color:var(--accent); }
    .avatar { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; border:var(--line) solid var(--border); background:var(--surface-2); color:var(--fg); font-size:20px; font-weight:500; }
    .avatar-sm { width:44px; height:44px; font-size:14px; }
    .profile-head { display:flex; align-items:flex-start; gap:16px; }
    .field textarea { min-height:96px; padding:10px 12px; resize:vertical; border-radius:var(--radius-control); border:var(--line) solid var(--border); background:var(--bg); color:var(--fg); }
    .field-error { color:var(--error); font-size:12px; }
    .link-row { display:grid; grid-template-columns:24px minmax(90px,.6fr) minmax(140px,1fr) auto; gap:8px; align-items:end; }
    .drag { color:var(--muted); font-family:var(--font-mono); text-align:center; padding-bottom:9px; cursor:grab; }
    .sticky-actions { position:sticky; bottom:0; z-index:20; display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 0; border-top:var(--line) solid var(--border); background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(8px); }
    .banner { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:8px 10px; border:var(--line) solid var(--border); border-radius:var(--radius-control); background:var(--surface-2); font-size:13px; }
    .object-description { border-top:var(--line) solid var(--border); padding-top:24px; max-width:760px; }
    .markdown { color:var(--fg); font-size:15px; line-height:1.6; }
    .markdown h3 { margin:0 0 10px; font-size:17px; font-weight:500; }
    .markdown p { margin:0 0 12px; color:var(--muted); }
    .markdown a { color:var(--fg); text-decoration:underline; text-underline-offset:3px; }
    .markdown code { font-family:var(--font-mono); font-size:.9em; padding:1px 4px; border:var(--line) solid var(--border); border-radius:3px; background:var(--surface-2); color:var(--fg); }
    .markdown pre { margin:12px 0; padding:14px; overflow:auto; border:var(--line) solid var(--border); border-radius:var(--radius-control); background:var(--surface-2); font:12px/1.6 var(--font-mono); color:var(--fg); }
    .version-note { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:var(--line) solid var(--border); border-radius:var(--radius-control); font-size:13px; }
    .docs-layout { display:grid; grid-template-columns:208px minmax(0,1fr); gap:32px; align-items:start; }
    .docs-nav { position:sticky; top:76px; display:flex; flex-direction:column; gap:2px; border-right:var(--line) solid var(--border); padding-right:16px; }
    .docs-nav button { border:0; border-radius:var(--radius-control); padding:7px 8px; text-align:left; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; }
    .docs-nav button:hover, .docs-nav button.is-on { color:var(--fg); background:var(--surface-2); }
    .select-compact { min-height:28px; padding:0 26px 0 8px; border:var(--line) solid var(--border); border-radius:var(--radius-control); background:transparent; color:var(--fg); font:11px var(--font-mono); }
    .legal { max-width:720px; }
    .legal-meta { display:flex; flex-wrap:wrap; gap:12px; padding-bottom:16px; border-bottom:var(--line) solid var(--border); color:var(--muted); font:11px var(--font-mono); }
    .error-page { min-height:52vh; display:flex; flex-direction:column; justify-content:center; gap:16px; max-width:480px; }
    .footer-links { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:8px; }
    .footer-links a:hover { color:var(--fg); }
    .filters-row { display: flex; flex-wrap: wrap; gap: 10px; grid-column: 1 / -1; }
    .seg {
      display: inline-flex; border: var(--line) solid var(--border);
      border-radius: var(--radius-control); overflow: hidden;
    }
    .seg button {
      border: 0; background: transparent; color: var(--muted);
      padding: 8px 14px; cursor: pointer; font-size: 13px;
    }
    .seg button.is-on { background: var(--surface-2); color: var(--fg); }
    .list-item {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      border: var(--line) solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; background: var(--surface);
    }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 13px; cursor: pointer;
      background: none; border: 0; padding: 0;
    }
    .back:hover { color: var(--fg); }
    .proto-note {
      position: fixed; right: 16px; bottom: 16px; z-index: 50;
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
      background: var(--surface); border: var(--line) solid var(--border);
      border-radius: var(--radius); padding: 8px 10px; max-width: 260px;
    }
    @media (max-width: 720px) {
      .dl { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
      .topbar { padding: 12px 16px; }
      .main { padding: 28px 16px 48px; }
      .search-row { grid-template-columns:1fr; }
      .filter-popover { position:fixed; inset:auto 0 0; width:100%; border-radius:var(--radius-lg) var(--radius-lg) 0 0; max-height:80vh; overflow:auto; padding:20px 16px calc(16px + env(safe-area-inset-bottom)); }
      .filter-grid { grid-template-columns:1fr; }
      .filter-foot { position:sticky; bottom:-16px; padding:12px 0 calc(12px + env(safe-area-inset-bottom)); background:var(--surface); }
      .profile-head { align-items:center; }
      .link-row { grid-template-columns:20px 1fr auto; }
      .link-row .field:last-of-type { grid-column:2 / 3; }
      .docs-layout { grid-template-columns:1fr; gap:20px; }
      .docs-nav { position:static; flex-direction:row; overflow:auto; border-right:0; border-bottom:var(--line) solid var(--border); padding:0 0 10px; }
      .docs-nav button { white-space:nowrap; }
      .sticky-actions { align-items:flex-start; flex-direction:column; }
      .sticky-actions .row { width:100%; }
      .sticky-actions .btn { flex:1; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app"></div>
  <div class="proto-note">prototype · ai_stp · routes from apps/web</div>
  <script src="./app.js"></script>
</body>
</html>
