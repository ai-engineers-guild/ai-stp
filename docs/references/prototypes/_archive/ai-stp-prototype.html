/* design tokens */

:root,
[data-mode="machine"] {
  --bg: #101010;
  --surface: #181818;
  --surface-2: #1f1f1f;
  --fg: #ffffff;
  --muted: #858483;
  --border: #434343;
  --border-subtle: #2a2a2a;
  --accent: #fb631b;
  --accent-hover: #f4793f;
  --accent-text: #ffffff;
  --success: #63b436;
  --warning: #dbaa36;
  --error: #db6866;
  --font-sans: gerstnerProgramm, Arial, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --font-mono: ftSystemMono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --radius-control: 4px;
  --radius-chip: 6px;
  --radius: 8px;
  --radius-lg: 16px;
  --space-2: 4px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 40px;
  --control-h: 36px;
  --line: 1px;
  --ease: cubic-bezier(0.215, 0.61, 0.355, 1);
  --dur: 160ms;
  color-scheme: dark;
}

[data-mode="human"] {
  --bg: #ffffff;
  --surface: #f9f8f4;
  --surface-2: #f0eee6;
  --fg: #181818;
  --muted: #6b6a68;
  --border: #d4d2cb;
  --border-subtle: #e8e6df;
  --accent: #fb631b;
  --accent-hover: #f4793f;
  --accent-text: #ffffff;
  color-scheme: light;
}

/* page styles */

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 24px; border-bottom: var(--line) solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 4px; height: 14px; border-radius: 1px; background: var(--accent); flex-shrink: 0;
    }
    .nav { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .nav a, .nav button.linkish {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--muted); font-size: 14px; transition: color var(--dur) var(--ease);
    }
    .nav a:hover, .nav a.is-active { color: var(--fg); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .main { width: min(1120px, 100%); margin: 0 auto; padding: 40px 24px 64px; flex: 1; }
    .footer {
      border-top: var(--line) solid var(--border); color: var(--muted);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
      text-align: center; padding: 24px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: var(--control-h); padding: 0 16px; border-radius: var(--radius-control);
      border: var(--line) solid transparent; cursor: pointer;
      font-size: 14px; font-weight: 500;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); color: var(--accent-text); }
    .btn-secondary { background: var(--surface-2); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface); color: var(--fg); }
    .btn-outline { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--surface); color: var(--fg); }
    .btn-block { width: 100%; }
    .btn-sm { min-height: 28px; padding: 0 12px; font-size: 12px; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: var(--radius-chip);
      border: var(--line) solid var(--border);
      font-family: var(--font-mono); font-size: 11px; font-weight: 500;
      color: var(--fg); background: transparent;
    }
    .chip-soft { background: var(--surface-2); border-color: transparent; color: var(--muted); }
    .chip-ok {
      background: color-mix(in srgb, var(--success) 18%, transparent);
      border-color: transparent; color: var(--success);
    }
    .card {
      background: var(--surface); border: var(--line) solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color var(--dur) var(--ease);
    }
    .card:hover { border-color: color-mix(in srgb, var(--muted) 50%, var(--border)); }
    .card h3 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.3; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; }
    .card-meta dt { color: var(--muted); font-size: 11px; }
    .card-meta dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
    .card-foot {
      display: flex; flex-wrap: wrap; gap: 12px 16px;
      border-top: var(--line) solid var(--border); padding-top: 12px;
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; }
    .field input, .field select {
      min-height: var(--control-h); padding: 0 12px;

    .field input.mono { font-family: var(--font-mono); letter-spacing: 0.12em; }
    .panel {

      background: var(--surface); padding: 16px 18px;

    .muted { color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: 24px; }
    .stack-sm { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .narrow { max-width: 440px; margin: 0 auto; width: 100%; }
    .mid { max-width: 560px; margin: 0 auto; width: 100%; }
    .dl { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dl > div { min-width: 0; }
    .dl dt { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .dl dd { margin: 0; font-size: 14px; word-break: break-word; }
    .dl .span-2 { grid-column: 1 / -1; }
    .codebox {

      border: var(--line) solid var(--border); background: var(--surface-2);

      padding: 16px; border: var(--line) solid var(--border);

    .filter-wrap { position:relative; }
    .filter-popover {

    .filter-help { position:relative; display:inline-flex; }
    .icon-btn { width:24px; height:24px; padding:0; border:var(--line) solid var(--border); background:transparent; color:var(--muted); border-radius:50%; cursor:pointer; font-family:var(--font-mono); font-size:12px; }
    .icon-btn:hover { color:var(--fg); background:var(--surface-2); }

    .applied-chips { display:flex; flex-wrap:wrap; gap:8px; min-height:24px; }
    .chip button { border:0; padding:0 0 0 6px; background:none; color:inherit; cursor:pointer; font-size:15px; line-height:1; }

    .checkline input { accent-color:var(--accent); }
    .avatar { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; border:var(--line) solid var(--border); background:var(--surface-2); color:var(--fg); font-size:20px; font-weight:500; }
    .avatar-sm { width:44px; height:44px; font-size:14px; }
    .profile-head { display:flex; align-items:flex-start; gap:16px; }

    .field-error { color:var(--error); font-size:12px; }
    .link-row { display:grid; grid-template-columns:24px minmax(90px,.6fr) minmax(140px,1fr) auto; gap:8px; align-items:end; }
    .drag { color:var(--muted); font-family:var(--font-mono); text-align:center; padding-bottom:9px; cursor:grab; }

    .banner { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:8px 10px; border:var(--line) solid var(--border); border-radius:var(--radius-control); background:var(--surface-2); font-size:13px; }

  function docsContent() { const pages = { "getting-started": ["Начало работы", "Установите CLI, авторизуйте устройство и синхронизируйте первый объект."], catalog: ["Каталог", "Каталог хранит опубликованные паспорта компонентов и сетапов. Фильтры применяются к выдаче, а не меняют сам объект."], publishing: ["Публикация", "Публичный профиль и паспорта версий отображают только опубликованные сведения. Черновики доступны владельцу через private preview."], cli: ["CLI", "Команды используют stable id и версию. Это позволяет воспроизводимо применять состав на устройстве."] }; const p = pages[state.docsSection]; return '<article class="markdown"><h1>' + p[0] + '</h1><p>' + p[1] + '</p><h3>Быстрый путь</h3><ol><li>Установите <code>ai-stp-cli</code>.</li><li>Проверьте текущую сессию.</li><li>Синхронизируйте опубликованный объект.</li></ol><pre>ai-stp login\nai-stp catalog search --harness codex\nai-stp setup use setup_…@1.0</pre><p>Контракты и примеры хранятся в репозитории. См. <a href="#" data-nav="catalog">каталог</a> для выбора версии.</p></article>'; }

  function body() {

le") { state.profileDirty = false; state.profileStatus = "draft"; render(); } else if (a === "publish-profile") { state.profileDirty = false; state.profileStatus = "published"; render(); } else if (a === "avatar" || a === "avatar-remove" || a === "history") { state.copyStatus = a === "history" ? "История версии откроется в репозитории" : "Действие доступно в продуктовой реализации"; render(); setTimeout(() => { state.copyStatus = ""; render(); }, 1800); } else if (a === "docs-section") { state.docsSection = el.dataset.section; render(); } else if (a === "retry") { state.requestId = "req_01JQZK7B8N4M6P2R9T5V0X3Y7" + Math.floor(Math.random() * 9); render(); } }));
    const q = root.querySelector("[data-bind=q]"); if (q) q.addEventListener("change", () => { state.q = q.value; render(); });

  const allowed = ["landing", "login", "catalog", "component", "setup", "component-preview", "setup-preview", "component-edit", "setup-edit", "publisher", "account", "profile", "profile-preview", "privacy", "devices", "docs", "legal-privacy", "legal-cookies", "legal-service-rules", "legal-licensing", "not-found", "error-500"];
