[project]
name = "ai-stp-safety-cisco"
version = "0.0.0"
requires-python = ">=3.15,<3.16"
dependencies = ["cisco-ai-skill-scanner==2.3.2"]

[tool.uv]
package = false
exclude-newer = "3 days"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.workspace]
members = []
